<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17131a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Perla" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/api/avatar" />
  <title>Perla</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
  <style>
/* @@PERLA_CSS@@ */
  </style>
</head>

<body>

  <div id="gate" class="gate">
    <div class="gate-card">
      <div id="gateMark" class="gate-mark">P</div>
      <h1>Perla</h1>
      <input id="gatePassword" type="password" placeholder="password" autocomplete="off" inputmode="text" />
      <button id="gateSubmit">Unlock</button>
      <p id="gateError" class="gate-error" hidden>Wrong password.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <div id="globalNotifications" class="global-notifications" aria-live="polite"></div>
    <header class="app-header">
      <div class="app-header-inner">
        <div class="header-left">
          <button id="menuBtn" class="btn-icon btn-icon-30 menu-btn" aria-label="Menu" aria-expanded="false" title="Menu">
            <span class="hamburger-lines"><span></span><span></span><span></span></span>
          </button>
          <div class="brand">
            <span id="brandMark" class="brand-mark">P</span>
            <span class="brand-name">Perla</span>
          </div>
        </div>
        <div class="status-indicator">
          <span id="tierBadge" class="tier-badge">T1</span>
          <span id="tierTimer" class="tier-timer" hidden></span>
          <span class="status-dot" id="statusDot"></span>
        </div>
      </div>
    </header>

    <nav id="appMenu" class="floating-menu app-menu" aria-hidden="true">
      <button id="tier1Btn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <path
              d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
          </svg></span>
        <span class="menu-item-label">Tier 1 chat</span>
        <span class="menu-item-badge" id="tier1Badge"></span>
      </button>
      <button id="tier2Btn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <polyline points="4 17 10 11 4 5" />
            <line x1="12" y1="19" x2="20" y2="19" />
          </svg></span>
        <span class="menu-item-label">Tier 2 chat</span>
        <span class="menu-item-badge" id="tier2Badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13">
            <rect x="4" y="11" width="16" height="11" rx="2" ry="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg></span>
      </button>
      <div class="divider"></div>
      <button id="quickActionsBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <polygon points="11 2 3 13 10 13 9 20 19 9 12 9 13 2" />
          </svg></span>
        <span class="menu-item-label">Quick Actions</span>
      </button>
      <button id="remindersBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg></span>
        <span class="menu-item-label">Reminders</span>
      </button>
      <button id="driveBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <rect x="2" y="4" width="18" height="14" rx="2" />
            <line x1="2" y1="13" x2="20" y2="13" />
            <circle cx="16" cy="16" r="1" />
          </svg></span>
        <span class="menu-item-label">System</span>
      </button>
      <button id="historyBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg></span>
        <span class="menu-item-label">History</span>
      </button>
      <button id="clearChatBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <path d="M3 6h18" />
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
            <line x1="10" y1="11" x2="10" y2="17" />
            <line x1="14" y1="11" x2="14" y2="17" />
          </svg></span>
        <span class="menu-item-label">Clear chat</span>
      </button>
      <div class="divider"></div>
      <button id="checkSessionBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <path d="M20 6L9 17l-5-5" />
          </svg></span>
        <span class="menu-item-label">Check session</span>
      </button>
      <button id="restartServiceBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round" width="19" height="19">
            <polyline points="1 4 1 10 7 10" />
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
          </svg></span>
        <span class="menu-item-label">Restart service</span>
      </button>
    </nav>


    <div id="historyPanel" class="dropdown-panel" hidden>
      <div class="history-toolbar">
        <div class="history-daypicker-wrap">
          <button id="historyDayBtn" class="history-daypicker-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="history-daypicker-icon">
              <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><rect x="3" y="4.5" width="16" height="14" rx="2"/><line x1="3" y1="9" x2="19" y2="9"/><line x1="7" y1="2.5" x2="7" y2="6.5"/><line x1="15" y1="2.5" x2="15" y2="6.5"/></svg>
            </span>
            <span id="historyDayBtnLabel">Select a day…</span>
            <span class="history-daypicker-caret">
              <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="5 8 11 14 17 8"/></svg>
            </span>
          </button>
          <div id="historyDayMenu" class="floating-menu history-day-menu scroll-area" aria-hidden="true" role="listbox"></div>
        </div>
        <div id="historyTierFilter" class="history-tier-filter" role="group" aria-label="Filter by tier">
          <button class="history-tier-btn active" data-tier="all">All</button>
          <button class="history-tier-btn" data-tier="1">Tier 1</button>
          <button class="history-tier-btn" data-tier="2">Tier 2</button>
        </div>
      </div>
      <span id="historyStatus" class="status"></span>
    </div>

    <div id="remindersBar" class="dropdown-panel" hidden>
      <div class="reminder-composer">
        <div class="reminder-composer-top">
          <button id="reminderAddToggle" class="btn-icon btn-icon-30 reminder-add-toggle" aria-label="New reminder"
            aria-expanded="false" aria-controls="reminderComposerMenu" title="New reminder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" width="16" height="16">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
          </button>
        </div>
        <div id="reminderComposerMenu" class="reminder-composer-menu" hidden>
          <input id="reminderTextInput" class="input" type="text" placeholder="Remind me to…" autocomplete="off" />
          <input id="reminderDueInput" class="input" type="datetime-local" aria-label="When" />
          <select id="reminderRepeatInput" class="input" aria-label="Repeat">
            <option value="">Once</option>
            <option value="hourly">Hourly</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
          <button id="reminderAddBtn">Add</button>
        </div>
      </div>
      <span id="remindersStatus" class="status"></span>
    </div>

    <div id="drivePanel" class="drive-panel scroll-area" hidden>
      <div class="drive-toolbar">
        <div id="driveBreadcrumbWrap" class="drive-breadcrumb-wrap">
          <div id="driveBreadcrumbs" class="drive-breadcrumbs"></div>
          <div id="drivePathEditRow" class="drive-path-edit-row" hidden>
            <span class="drive-path-edit-icon">
              <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="2" y="4" width="18" height="14" rx="2"/><line x1="2" y1="13" x2="20" y2="13"/></svg>
            </span>
            <input id="drivePathEditInput" type="text" autocomplete="off" spellcheck="false" placeholder="Path from home, e.g. Documents/Reports" />
          </div>
          <button id="driveBreadcrumbEditBtn" class="btn-icon btn-icon-28" aria-label="Edit path" title="Type a path">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M13.5 3.5l5 5L7 20l-5.5 1.5L3 16z"/></svg>
          </button>
        </div>
        <div class="drive-toolbar-actions">
          <button id="driveHiddenToggleBtn" class="btn-icon btn-icon-outline btn-icon-32" aria-label="Show hidden files" title="Show hidden files" aria-pressed="false">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="18" height="18">
              <path d="M2 11s3.5-6.5 9-6.5S20 11 20 11s-3.5 6.5-9 6.5S2 11 2 11z" />
              <circle cx="11" cy="11" r="2.5" />
            </svg>
          </button>
          <button id="driveViewToggleBtn" class="btn-icon btn-icon-outline btn-icon-32" aria-label="Toggle grid view" title="Grid view" aria-pressed="false">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="18" height="18">
              <rect x="3" y="3" width="6.5" height="6.5" rx="1" />
              <rect x="12.5" y="3" width="6.5" height="6.5" rx="1" />
              <rect x="3" y="12.5" width="6.5" height="6.5" rx="1" />
              <rect x="12.5" y="12.5" width="6.5" height="6.5" rx="1" />
            </svg>
          </button>
          <div class="divider-vertical"></div>
          <button id="driveNewFolderBtn" class="btn-icon btn-icon-outline btn-icon-32" aria-label="New folder" title="New folder">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="18" height="18">
              <path d="M2.5 6a2 2 0 0 1 2-2h4.5l1.6 2H17.5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
              <line x1="11" y1="10.5" x2="11" y2="14.5" />
              <line x1="9" y1="12.5" x2="13" y2="12.5" />
            </svg>
          </button>
          <button id="driveUploadBtn" class="btn-icon btn-icon-outline btn-icon-32" aria-label="Upload files" title="Upload">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="18" height="18">
              <path d="M11 14V4" />
              <polyline points="6.5 8.5 11 4 15.5 8.5" />
              <path d="M4 14v3a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 18 17v-3" />
            </svg>
          </button>
          <button id="drivePasteBtn" class="btn-icon btn-icon-outline btn-icon-32" aria-label="Paste" title="Paste" disabled>
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="18" height="18">
              <path d="M8 3.5h6a1 1 0 0 1 1 1V6H7V4.5a1 1 0 0 1 1-1z" />
              <path d="M6 6h10a1.5 1.5 0 0 1 1.5 1.5V17a1.5 1.5 0 0 1-1.5 1.5H6A1.5 1.5 0 0 1 4.5 17V7.5A1.5 1.5 0 0 1 6 6z" />
            </svg>
          </button>
        </div>
      </div>
      <div id="driveClipboardBar" class="drive-clipboard-bar" hidden>
        <span id="driveClipboardLabel"></span>
        <button id="driveClipboardCancel" class="qa-input-cancel" aria-label="Clear clipboard">✕</button>
      </div>
      <input id="driveUploadInput" type="file" multiple hidden>
      <div id="driveNewFolderRow" class="drive-new-folder-row" hidden>
        <input id="driveNewFolderInput" class="input" type="text" placeholder="Folder name" autocomplete="off" />
        <button id="driveNewFolderGo" class="qa-input-go">Create</button>
        <button id="driveNewFolderCancel" class="qa-input-cancel" aria-label="Cancel">✕</button>
      </div>
      <div id="driveStatus" class="status"></div>
      <div id="driveGrid" class="drive-list"></div>
    </div>

    <div id="fileViewerModal" class="file-viewer-modal" hidden>
      <div class="file-viewer-modal-card">
        <div class="file-viewer-modal-header">
          <span id="fileViewerModalIcon" class="file-viewer-modal-icon"></span>
          <span id="fileViewerModalName" class="file-viewer-modal-name"></span>
          <button id="fileViewerModalDownload" class="btn-icon btn-icon-30" aria-label="Download" title="Download">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M11 3v12"/><polyline points="6 10 11 15 16 10"/><path d="M4 18h14"/></svg>
          </button>
          <button id="fileViewerModalClose" class="btn-icon btn-icon-30" aria-label="Close" title="Close">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><line x1="4" y1="4" x2="18" y2="18"/><line x1="18" y1="4" x2="4" y2="18"/></svg>
          </button>
        </div>
        <div id="fileViewerModalBody" class="file-viewer-modal-body scroll-area"></div>
      </div>
    </div>

    <div id="quickActionsPanel" class="dropdown-panel scroll-area" hidden>
      <!-- Sticky Feedback & Result container at top -->
      <div id="qaResult" class="qa-result"></div>

      <div id="qaDrawer" hidden>
        <div class="qa-drawer-header" id="qaDrawerHeader">
          <span class="qa-drawer-title">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" width="15" height="15">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="13" y2="17" />
            </svg>
            <span>Output</span>
          </span>
          <span id="qaDrawerCount" class="qa-drawer-count" data-count="0"></span>
          <span class="qa-drawer-spacer"></span>
          <button id="qaDrawerClear" class="qa-drawer-clear" title="Clear all results" aria-label="Clear all results">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
              stroke-linejoin="round" width="14" height="14">
              <path d="M3 6h18" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          </button>
          <span class="qa-drawer-chevron">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" width="14" height="14">
              <polyline points="5 8 11 14 17 8" />
            </svg>
          </span>
        </div>
        <div id="qaDrawerBody" class="qa-drawer-body">
          <div class="qa-drawer-empty">No results yet — run a command to see its output here.</div>
        </div>
      </div>

      <div id="qaInputRow" class="qa-input-row" hidden>
        <input id="qaInputField" class="input input-sunken" type="text" placeholder="" autocomplete="off" />
        <button id="qaInputGo" class="qa-input-go">Go</button>
        <button id="qaInputCancel" class="qa-input-cancel" aria-label="Cancel">✕</button>
      </div>

      <div class="qa-container">
        <!-- Section: Media & Audio -->
        <div class="qa-section">
          <div class="qa-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" width="13" height="13">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" />
            </svg>
            <span>Media &amp; Audio</span>
          </div>
          <div class="qa-grid">
            <button class="qa-btn" data-qa="prev_track" title="Previous Track">
              <span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <polygon points="19 20 9 12 19 4 19 20" />
                  <line x1="5" y1="19" x2="5" y2="5" />
                </svg></span>
              <span class="qa-label">Prev</span>
            </button>
            <button class="qa-btn" data-qa="play_pause" title="Play / Pause">
              <span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <rect x="6" y="4" width="4" height="16" rx="1" />
                  <rect x="14" y="4" width="4" height="16" rx="1" />
                </svg></span>
              <span class="qa-label">Play / Pause</span>
            </button>
            <button class="qa-btn" data-qa="next_track" title="Next Track">
              <span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <polygon points="5 4 15 12 5 20 5 4" />
                  <line x1="19" y1="5" x2="19" y2="19" />
                </svg></span>
              <span class="qa-label">Next</span>
            </button>
            <button class="qa-btn" data-qa="mute" title="Mute Speaker">
              <span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />

        <div class="divider-vertical"></div>
        <button class="btn-icon btn-icon-34" id="editorReset" aria-label="Reset image" title="Reset">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <polyline points="3 3 3 8 8 8" />
          </svg>
        </button>
      </div>

      <!-- Top-right: close -->
      <div class="editor-float editor-close-float">
        <button class="btn-icon btn-icon-34" id="editorClose" aria-label="Close editor" title="Close">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="15" height="15">
            <line x1="4" y1="4" x2="18" y2="18" />
            <line x1="18" y1="4" x2="4" y2="18" />
          </svg>
        </button>
      </div>

      <!-- Bottom-left: zoom -->
      <div class="editor-float editor-zoom-float">
        <button class="btn-icon btn-icon-34" id="zoomOut" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="10" cy="10" r="7" />
            <line x1="15.2" y1="15.2" x2="20" y2="20" />
            <line x1="7" y1="10" x2="13" y2="10" />
          </svg>
        </button>
        <span class="editor-zoom-label" id="zoomLabel">100%</span>
        <button class="btn-icon btn-icon-34" id="zoomIn" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="10" cy="10" r="7" />
            <line x1="15.2" y1="15.2" x2="20" y2="20" />
            <line x1="10" y1="7" x2="10" y2="13" />
            <line x1="7" y1="10" x2="13" y2="10" />
          </svg>
        </button>
        <div class="divider-vertical"></div>
        <button class="btn-icon btn-icon-34" id="zoomReset" aria-label="Reset zoom" title="Fit to screen">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" width="15" height="15">
            <path d="M3 8V4h4" />
            <path d="M19 8V4h-4" />
            <path d="M3 14v4h4" />
            <path d="M19 14v4h-4" />
          </svg>
        </button>
      </div>

      <!-- Bottom-center: contextual controls for the active mode -->
      <div class="editor-float editor-context-float" id="penOptionsRow">
        <div class="img-editor-colors" id="penColors">
          <button class="color-swatch active" data-color="#e94f4f" style="background:#e94f4f"></button>
          <button class="color-swatch" data-color="#f2c94c" style="background:#f2c94c"></button>
          <button class="color-swatch" data-color="#6fcf97" style="background:#6fcf97"></button>
          <button class="color-swatch" data-color="#56ccf2" style="background:#56ccf2"></button>
          <button class="color-swatch" data-color="#c97b8d" style="background:#c97b8d"></button>
          <button class="color-swatch" data-color="#f2f2f2" style="background:#f2f2f2"></button>
          <button class="color-swatch" data-color="#17131a" style="background:#17131a"></button>
        </div>
        <div class="divider-vertical"></div>
        <div class="img-editor-size">
          <input type="range" id="penWidth" min="2" max="24" value="6">
          <span class="img-editor-size-label" id="penWidthLabel">6px</span>
        </div>
      </div>
      <div class="editor-float editor-context-float bare" id="cropOptionsRow" hidden>
        <button class="editor-pill-btn primary" id="applyCrop">Apply crop</button>
      </div>

      <!-- Bottom-right: save -->
      <div class="editor-float editor-save-float bare">
        <button class="editor-pill-btn primary" id="editorSave">Save</button>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <div class="lightbox-canvas-wrap" id="lightboxWrap">
      <div class="lightbox-canvas-inner" id="lightboxInner">
        <img id="lightboxImage" alt="">
      </div>

      <div class="editor-float editor-close-float">
        <button class="btn-icon btn-icon-34" id="lightboxClose" aria-label="Close image" title="Close">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="15" height="15">
            <line x1="4" y1="4" x2="18" y2="18" />
            <line x1="18" y1="4" x2="4" y2="18" />
          </svg>
        </button>
      </div>

      <div class="editor-float editor-zoom-float">
        <button class="btn-icon btn-icon-34" id="lightboxZoomOut" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="10" cy="10" r="7" />
            <line x1="15.2" y1="15.2" x2="20" y2="20" />
            <line x1="7" y1="10" x2="13" y2="10" />
          </svg>
        </button>
        <span class="editor-zoom-label" id="lightboxZoomLabel">100%</span>
        <button class="btn-icon btn-icon-34" id="lightboxZoomIn" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="10" cy="10" r="7" />
            <line x1="15.2" y1="15.2" x2="20" y2="20" />
            <line x1="10" y1="7" x2="10" y2="13" />
            <line x1="7" y1="10" x2="13" y2="10" />
          </svg>
        </button>
        <div class="divider-vertical"></div>
        <button class="btn-icon btn-icon-34" id="lightboxZoomReset" aria-label="Reset zoom" title="Fit to screen">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" width="15" height="15">
            <path d="M3 8V4h4" />
            <path d="M19 8V4h-4" />
            <path d="M3 14v4h4" />
            <path d="M19 14v4h-4" />
          </svg>
        </button>
      </div>

      <div class="editor-float editor-save-float bare">
        <button class="btn-icon btn-icon-34" id="lightboxDownload" aria-label="Download image" title="Download">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" width="17" height="17">
            <path d="M11 3v12" />
            <polyline points="6 10 11 15 16 10" />
            <path d="M4 18h14" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="fileViewer" class="file-viewer" hidden>
    <div class="file-viewer-panel">
      <div class="file-viewer-header">
        <span class="file-viewer-icon"></span>
        <span class="file-viewer-name" id="fileViewerName"></span>
        <div class="file-viewer-header-actions">
          <button class="btn-icon btn-icon-34" id="fileViewerMdToggle" aria-label="Toggle rendered markdown"
            title="Toggle rendered markdown" hidden>
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" width="16" height="16">
              <path d="M3 5h16v12H3z" />
              <path d="M6 9l2.5 2.5L6 14" />
              <path d="M11 14h5" />
            </svg>
          </button>
          <button class="btn-icon btn-icon-34" id="fileViewerCopy" aria-label="Copy file contents" title="Copy contents">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
              stroke-linejoin="round" width="16" height="16">
              <rect x="8" y="8" width="11" height="11" rx="2" />
              <path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3" />
            </svg>
          </button>
          <button class="btn-icon btn-icon-34" id="fileViewerDownload" aria-label="Download file" title="Download">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" width="16" height="16">
              <path d="M11 3v12" />
              <polyline points="6 10 11 15 16 10" />
              <path d="M4 18h14" />
            </svg>
          </button>
          <div class="divider-vertical"></div>
          <button class="btn-icon btn-icon-34" id="fileViewerClose" aria-label="Close file" title="Close">
            <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" width="15" height="15">
              <line x1="4" y1="4" x2="18" y2="18" />
              <line x1="18" y1="4" x2="4" y2="18" />
            </svg>
          </button>
        </div>
      </div>
      <div class="file-viewer-body scroll-area" id="fileViewerBody"></div>
    </div>
  </div>
