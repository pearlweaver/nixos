<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Perla</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
<style>
  :root{
    --bg: #17131a;
    --bg-panel: #201a23;
    --bg-panel-2: #29212c;
    --rule: #453a49;
    --rule-faint: #322a36;
    --ink: #e9dfc7;
    --ink-dim: #a3906c;
    --ink-faint: #6e5f45;
    --brass: #c97b8d;
    --brass-bright: #e4a2b2;
    --brass-dim: #8c4f5c;
    --wax: #8a3226;
    --wax-bright: #b8452f;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
  }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,123,141,0.07), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; }
  input { font-family: inherit; }

  /* ---------- Password Gate ---------- */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    background: var(--bg);
  }

  .gate-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 40px 32px 32px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .gate-mark {
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
  }

  .gate-card h1 {
    margin: 0 0 32px;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .gate-card input[type="password"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-size: 16px;
    text-align: center;
    padding: 10px 4px;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .gate-card input[type="password"]:focus {
    border-bottom-color: var(--brass);
  }

  .gate-card button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.14), rgba(201,123,141,0.04));
    color: var(--brass-bright);
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .gate-card button:hover { background: rgba(201,123,141,0.2); }
  .gate-card button:active { transform: scale(0.98); }

  .gate-error {
    margin: 14px 0 0;
    color: var(--wax-bright);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ---------- App shell ---------- */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    border-left: 1px solid var(--rule-faint);
    border-right: 1px solid var(--rule-faint);
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule);
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--brass-bright);
  }

  .brand-name {
    font-size: 19px;
    letter-spacing: 0.03em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    margin-left: 6px;
    flex-shrink: 0;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .status-dot.ok { background: #7fae6a; box-shadow: 0 0 8px rgba(127,174,106,0.6); }
  .status-dot.err { background: var(--wax-bright); box-shadow: 0 0 8px rgba(184,69,47,0.6); }

  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
  }

  .output {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .entry { max-width: 92%; }
  .entry-user { align-self: flex-end; margin-left: auto; text-align: right; }
  .entry-perla { align-self: flex-start; }
  .entry-system { align-self: center; text-align: center; max-width: 100%; }

  .entry-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }

  .entry-user .entry-label { color: var(--brass-dim); }
  .entry-perla .entry-label { color: var(--ink-dim); }

  .entry p {
    margin: 0;
    font-size: 16px;
    line-height: 1.55;
  }

  .entry-user p { color: var(--ink); }
  .entry-perla p { color: var(--ink); }
  .entry-system p {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
  }

  .entry-time {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 5px;
    opacity: 0.7;
  }

  .replay-btn {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-serif);
  }
  .replay-btn:hover { border-color: var(--brass-dim); color: var(--brass); }

  /* ---------- Composer ---------- */
  .composer {
    border-top: 1px solid var(--rule);
    padding: 14px 20px calc(16px + var(--safe-bottom));
    background: var(--bg-panel);
  }

  .composer-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  #textInput {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 10px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    padding: 11px 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s ease;
  }
  #textInput:focus { border-color: var(--brass-dim); }
  #textInput::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.05));
    color: var(--brass-bright);
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .send-btn:hover { background: rgba(201,123,141,0.22); }
  .send-btn:active { transform: scale(0.94); }

  .mic-btn {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--wax);
    background: radial-gradient(circle at 35% 30%, rgba(138,50,38,0.35), rgba(138,50,38,0.08));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mic-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--wax-bright);
    transition: transform 0.2s ease;
  }

  .mic-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--wax-bright);
    opacity: 0;
  }

  .mic-btn.recording .mic-dot {
    border-radius: 3px;
    transform: scale(0.6);
  }

  .mic-btn.recording .ring-1 { animation: pulse-ring 1.8s ease-out infinite; }
  .mic-btn.recording .ring-2 { animation: pulse-ring 1.8s ease-out infinite 0.6s; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .mic-timer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-top: 8px;
    min-height: 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    .mic-btn.recording .ring-1,
    .mic-btn.recording .ring-2 { animation: none; }
    .shake { animation: none; }
  }

  @media (min-width: 641px) {
    body { padding: 28px 0; }
    .app {
      height: calc(100dvh - 56px);
      border-radius: 16px;
      border: 1px solid var(--rule-faint);
      box-shadow: 0 40px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }
  }

  .tier-badge {
    background: linear-gradient(180deg, var(--wax-bright), var(--wax));
    color: var(--bg);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 20px;
    margin-right: 6px;
    box-shadow: 0 0 10px rgba(184,69,47,0.45);
  }

  .elevate-submit {
    background: linear-gradient(180deg, rgba(184,69,47,0.22), rgba(184,69,47,0.08));
    color: var(--wax-bright);
    border: 1px solid var(--wax);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .elevate-submit:hover { background: rgba(184,69,47,0.32); }
  .elevate-submit:active { transform: scale(0.96); }
  .panel-status {
    display: block;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-style: italic;
  }
  .panel-status:empty { display: none; }

  /* ---------- Header icon buttons (shared: history, elevate) ---------- */
  .icon-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--brass-dim); color: var(--brass-bright); }
  .icon-btn.active {
    border-color: var(--brass);
    color: var(--brass-bright);
    background: rgba(201,123,141,0.14);
  }

  /* ---------- Hamburger menu button ---------- */
  .menu-btn { position: relative; }

  .hamburger-lines {
    width: 15px;
    height: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hamburger-lines span {
    display: block;
    width: 100%;
    height: 1.5px;
    background: currentColor;
    border-radius: 1px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .menu-btn.active .hamburger-lines span:nth-child(1) {
    transform: translateY(4.5px) rotate(45deg);
  }
  .menu-btn.active .hamburger-lines span:nth-child(2) { opacity: 0; }
  .menu-btn.active .hamburger-lines span:nth-child(3) {
    transform: translateY(-4.5px) rotate(-45deg);
  }

  /* ---------- App menu (hamburger dropdown) ---------- */
  .app-menu {
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border-bottom: 1px solid var(--rule);
    animation: panel-drop 0.18s ease;
  }
  .app-menu[hidden] { display: none; }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    text-align: left;
    padding: 12px 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .menu-item:hover { background: rgba(201,123,141,0.08); }
  .menu-item.active {
    background: rgba(201,123,141,0.14);
    color: var(--brass-bright);
  }
  .menu-item-icon {
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-size: 15px;
  }
  .menu-item-label { flex: 1; }
  .menu-item-badge {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }

  /* ---------- Dropdown panels (history day picker, elevate token) ---------- */
  .dropdown-panel {
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border-bottom: 1px solid var(--rule);
    animation: panel-drop 0.18s ease;
  }

  @keyframes panel-drop {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dropdown-row input,
  .dropdown-row select {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink);
    padding: 9px 11px;
    font-size: 0.85rem;
    font-family: var(--font-serif);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .dropdown-row input::placeholder { color: var(--ink-faint); }
  .dropdown-row input:focus,
  .dropdown-row select:focus { border-color: var(--brass-dim); }

  .entry-tier0 .entry-label { color: var(--ink-faint); }
  .entry-tier0 p { color: var(--ink-dim); font-style: italic; }

  /* ---------- Reminders ---------- */
  .reminder-section-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .reminder-section-title.missed { color: var(--wax-bright); }
  .reminder-section-title.pending { color: var(--brass-bright); }

  .reminder-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-faint);
  }
  .reminder-row:last-child { border-bottom: none; }

  .reminder-glyph {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-top: 1px;
  }
  .reminder-glyph.pending { color: var(--brass-bright); }
  .reminder-glyph.overdue { color: var(--wax-bright); }
  .reminder-glyph.missed { color: var(--wax-bright); }
  .reminder-glyph.delivered { color: #7fae6a; }

  .reminder-body { flex: 1; min-width: 0; }
  .reminder-text {
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }
  .reminder-meta {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  .reminder-empty {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
    padding: 4px 0 18px;
  }

  .reminder-collapsible summary {
    cursor: pointer;
    list-style: none;
  }
  .reminder-collapsible summary::-webkit-details-marker { display: none; }
  .reminder-collapsible summary .reminder-section-title { margin-bottom: 10px; }
  .reminder-collapsible summary .disclosure-arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    margin-left: auto;
    color: var(--ink-faint);
  }
  .reminder-collapsible[open] summary .disclosure-arrow { transform: rotate(90deg); }

  .reminder-section {
    margin-bottom: 22px;
  }
  .reminder-section:last-child { margin-bottom: 0; }
</style>
</head>
<body>

  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-mark">P</div>
      <h1>Perla</h1>
      <input id="gatePassword" type="password" placeholder="password" autocomplete="off" inputmode="text" />
      <button id="gateSubmit">Unlock</button>
      <p id="gateError" class="gate-error" hidden>Wrong password.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">P</span>
        <span class="brand-name">Perla</span>
      </div>
      <div class="status">
        <span id="tierBadge" class="tier-badge" hidden>T2</span>
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" title="Menu">
          <span class="hamburger-lines"><span></span><span></span><span></span></span>
        </button>
        <span class="status-dot" id="statusDot"></span>
      </div>
    </header>

    <nav id="appMenu" class="app-menu" hidden>
      <button id="elevateBtn" class="menu-item">
        <span class="menu-item-icon">⚡</span>
        <span class="menu-item-label">Full Mode</span>
      </button>
      <button id="remindersBtn" class="menu-item">
        <span class="menu-item-icon">⏰</span>
        <span class="menu-item-label">Reminders</span>
      </button>
      <button id="historyBtn" class="menu-item">
        <span class="menu-item-icon">🕘</span>
        <span class="menu-item-label">History</span>
      </button>
    </nav>

    <div id="historyPanel" class="dropdown-panel" hidden>
      <div class="dropdown-row">
        <select id="historyDaySelect">
          <option value="">Select a day…</option>
        </select>
      </div>
      <span id="historyStatus" class="panel-status"></span>
    </div>

    <div id="elevatePanel" class="dropdown-panel" hidden>
      <div class="dropdown-row">
        <input id="elevateInput" type="password" placeholder="Elevation token" autocomplete="off" />
        <button id="elevateSubmit" class="elevate-submit">Activate</button>
      </div>
      <span id="elevateStatus" class="panel-status"></span>
    </div>

    <div id="remindersBar" class="dropdown-panel" hidden>
      <span id="remindersStatus" class="panel-status"></span>
    </div>

    <main class="page">
      <div id="output" class="output" aria-live="polite"></div>
    </main>

    <footer class="composer">
      <div class="composer-row">
        <textarea id="textInput" rows="1" placeholder="Write to Perla…"></textarea>
        <button id="micBtn" class="mic-btn" aria-label="Record">
          <span class="mic-ring ring-1"></span>
          <span class="mic-ring ring-2"></span>
          <span class="mic-dot"></span>
        </button>
        <button id="sendText" class="send-btn" aria-label="Send">&gt;</button>
      </div>
      <span id="micTimer" class="mic-timer"></span>
    </footer>
  </div>

  <audio id="responseAudio" hidden></audio>

<script>

  const CONFIG = {
    ENDPOINT: "https://nixos.fish-glyptodon.ts.net",           // Tailscale HTTPS address
    TEXT_PATH: "/api/text",
    VOICE_PATH: "/api/voice",
    HEALTH_PATH: "/api/health",
    GATE_PATH: "/api/gate",
    HISTORY_DAYS_PATH: "/api/history/days",
    HISTORY_DAY_PATH: "/api/history/day",
    REMINDERS_PATH: "/api/reminders",
  };

  const GATE_PASSWORD = "goharumer"; // UX gate only — short, human-typeable

  let authToken = sessionStorage.getItem("perla_session_token") || null;

  // ---------- Gate ----------
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const gatePassword = document.getElementById("gatePassword");
  const gateSubmit = document.getElementById("gateSubmit");
  const gateError = document.getElementById("gateError");
  const gateCard = document.querySelector(".gate-card");

  // If we already have a session token, skip the gate
  if (authToken) {
    gate.style.display = "none";
    app.hidden = false;
    checkConnection();
  }

  async function tryUnlock() {
    const value = gatePassword.value;
    if (value.length === 0) return;

    // Client-side UX check first (fast fail, no network)
    if (value !== GATE_PASSWORD) {
      gateError.textContent = "Wrong password.";
      gateError.hidden = false;
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
      return;
    }

    // Exchange gate password for a server-issued session token
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.GATE_PATH, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: value }),
      });
      if (!res.ok) throw new Error("gate rejected");
      const data = await res.json();
      authToken = data.token;
      sessionStorage.setItem("perla_session_token", authToken);
      gate.style.display = "none";
      app.hidden = false;
      checkConnection();
    } catch (e) {
      gateError.hidden = false;
      gateError.textContent = "Server rejected the password.";
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
    }
  }

  gateSubmit.addEventListener("click", tryUnlock);
  gatePassword.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  // ---------- Status ----------
  const statusDot = document.getElementById("statusDot");
  function setStatusText(text) {
    statusDot.title = text;
  }

  async function checkConnection() {
    if (!CONFIG.ENDPOINT) {
      statusDot.className = "status-dot";
      setStatusText("not linked");
      return;
    }
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.HEALTH_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (res.ok) {
        statusDot.className = "status-dot ok";
        setStatusText("connected");
      } else {
        throw new Error("bad status");
      }
    } catch (e) {
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    }
  }

  // ---------- Hamburger menu ----------
  const menuBtn = document.getElementById("menuBtn");
  const appMenu = document.getElementById("appMenu");

  function closeAppMenu() {
    appMenu.hidden = true;
    menuBtn.classList.remove("active");
    menuBtn.setAttribute("aria-expanded", "false");
  }

  function toggleAppMenu() {
    const opening = appMenu.hidden;
    appMenu.hidden = !opening;
    menuBtn.classList.toggle("active", opening);
    menuBtn.setAttribute("aria-expanded", String(opening));
  }

  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleAppMenu();
  });

  document.addEventListener("click", (e) => {
    if (!appMenu.hidden && !appMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeAppMenu();
    }
  });

  // ---------- Elevation (Tier 2) ----------
  const elevateBtn = document.getElementById("elevateBtn");
  const elevatePanel = document.getElementById("elevatePanel");
  const elevateInput = document.getElementById("elevateInput");
  const elevateSubmit = document.getElementById("elevateSubmit");
  const elevateStatus = document.getElementById("elevateStatus");
  const tierBadge = document.getElementById("tierBadge");

  elevateBtn.addEventListener("click", () => {
    closeAppMenu();
    closeHistoryPanel();
    closeRemindersPanel();
    const opening = elevatePanel.hidden;
    elevatePanel.hidden = !opening;
    elevateBtn.classList.toggle("active", opening);
    if (opening) elevateInput.focus();
  });

  elevateSubmit.addEventListener("click", async () => {
    const token = elevateInput.value.trim();
    if (!token) return;
    elevateStatus.textContent = "Activating…";
    try {
      const res = await fetch(CONFIG.ENDPOINT + "/api/elevate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (res.ok && data.tier === 2) {
        elevateStatus.textContent = "";
        tierBadge.hidden = false;
        elevateInput.value = "";
        elevatePanel.hidden = true;
        elevateBtn.classList.remove("active");
        addEntry("system", "", "Full Mode activated for 5 minutes.");

        clearTimeout(window._elevateExpiryTimer);
        window._elevateExpiryTimer = setTimeout(() => {
          tierBadge.hidden = true;
          addEntry("system", "", "Full Mode expired — back to Tier 1.");
        }, (data.expires_in || 0) * 1000);
      } else {
        elevateStatus.textContent = data.error || "Failed";
      }
    } catch (e) {
      elevateStatus.textContent = "Connection error";
    }
  });

  elevateInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") elevateSubmit.click();
  });

  // ---------- Output ----------
  const output = document.getElementById("output");

  function addEntry(kind, label, text) {
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind;
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    entry.innerHTML =
      (label ? `<div class="entry-label">${label}</div>` : "") +
      `<p></p>` +
      (kind !== "system" ? `<div class="entry-time">${time}</div>` : "");
    entry.querySelector("p").textContent = text;
    output.appendChild(entry);
    output.scrollIntoView({ block: "end" });
    entry.scrollIntoView({ behavior: "smooth", block: "end" });
    return entry;
  }

  function addReplayButton(entry, audioValue) {
    const btn = document.createElement("button");
    btn.className = "replay-btn";
    btn.textContent = "Play";
    btn.addEventListener("click", () => playAudio(audioValue));
    entry.appendChild(btn);
  }

  // ---------- Audio playback ----------
  const responseAudio = document.getElementById("responseAudio");

  function playAudio(value) {
    if (!value) return;
    if (value.startsWith("http") || value.startsWith("/")) {
      // Fetch with auth headers since audio GET requires authentication
      const url = value.startsWith("http") ? value : CONFIG.ENDPOINT + value;
      fetch(url, { headers: { Authorization: "Bearer " + authToken } })
        .then(r => r.blob())
        .then(blob => {
          responseAudio.src = URL.createObjectURL(blob);
          responseAudio.play().catch(() => {});
        })
        .catch(() => {});
    } else {
      responseAudio.src = "data:audio/mp3;base64," + value;
      responseAudio.play().catch(() => {});
    }
  }

  // ---------- Text send ----------
  const textInput = document.getElementById("textInput");
  const sendText = document.getElementById("sendText");

  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + "px";
  });

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitText();
    }
  });

  sendText.addEventListener("click", submitText);

  async function submitText() {
    const message = textInput.value.trim();
    if (!message) return;
    addEntry("user", "You", message);
    textInput.value = "";
    textInput.style.height = "auto";

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }

    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.TEXT_PATH, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify({ message }),
      });
      if (!res.ok) throw new Error("request failed");
      const data = await res.json();
      const entry = addEntry("perla", "Perla", data.text || "(no response)");
      if (data.audio) {
        playAudio(data.audio);
        addReplayButton(entry, data.audio);
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    }
  }

  // ---------- Voice recording ----------
  const micBtn = document.getElementById("micBtn");
  const micTimer = document.getElementById("micTimer");

  let mediaRecorder = null;
  let audioChunks = [];
  let recording = false;
  let recordStart = 0;
  let timerInterval = null;

  micBtn.addEventListener("click", async () => {
    if (!recording) {
      await startRecording();
    } else {
      stopRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        handleRecordingComplete();
      };
      mediaRecorder.start();
      recording = true;
      recordStart = Date.now();
      micBtn.classList.add("recording");
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    } catch (e) {
      micTimer.textContent = "Microphone access denied";
    }
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
      recording = false;
      micBtn.classList.remove("recording");
      clearInterval(timerInterval);
      micTimer.textContent = "Sending…";
    }
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - recordStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const ss = String(elapsed % 60).padStart(2, "0");
    micTimer.textContent = `${mm}:${ss} — tap to stop`;
  }

  async function handleRecordingComplete() {
    const blob = new Blob(audioChunks, { type: "audio/webm" });

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      micTimer.textContent = "";
      return;
    }

    try {
      const form = new FormData();
      form.append("audio", blob, "input.webm");

      const res = await fetch(CONFIG.ENDPOINT + CONFIG.VOICE_PATH, {
        method: "POST",
        headers: { Authorization: "Bearer " + authToken },
        body: form,
      });
      if (!res.ok) throw new Error("request failed");
      const data = await res.json();

      if (data.transcript) addEntry("user", "You", data.transcript);
      const entry = addEntry("perla", "Perla", data.text || "(no response)");
      if (data.audio) {
        playAudio(data.audio);
        addReplayButton(entry, data.audio);
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    } finally {
      micTimer.textContent = "";
    }
  }

  // ---------- Overlay view management (history / reminders share the
  // main output area as a read-only overlay on top of live chat) ----------
  let liveOutputHTML = null; // stash of live chat while an overlay is open
  let activeOverlay = null;  // "history" | "reminders" | null

  // ---------- History (view-only past conversations) ----------
  const historyBtn = document.getElementById("historyBtn");
  const historyPanel = document.getElementById("historyPanel");
  const historyDaySelect = document.getElementById("historyDaySelect");
  const historyStatus = document.getElementById("historyStatus");
  const composer = document.querySelector(".composer");

  let daysLoaded = false;

  function formatDayLabel(dateStr) {
    // dateStr is YYYY-MM-DD
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const isYesterday = dt.toDateString() === yesterday.toDateString();
    const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    if (isToday) return `Today — ${label}`;
    if (isYesterday) return `Yesterday — ${label}`;
    return label;
  }

  function closeHistoryPanel() {
    if (activeOverlay !== "history") return;
    activeOverlay = null;
    historyBtn.classList.remove("active");
    historyPanel.hidden = true;
    composer.hidden = false;
    historyDaySelect.value = "";
    historyStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openHistoryPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeRemindersPanel();

    activeOverlay = "history";
    historyBtn.classList.add("active");
    historyPanel.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    addEntry("system", "", "Viewing past conversations — read only.");

    if (!daysLoaded) {
      historyStatus.textContent = "Loading days…";
      try {
        const res = await fetch(CONFIG.ENDPOINT + CONFIG.HISTORY_DAYS_PATH, {
          headers: { Authorization: "Bearer " + authToken },
        });
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        historyDaySelect.innerHTML = '<option value="">Select a day…</option>';
        (data.days || []).forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = formatDayLabel(d);
          historyDaySelect.appendChild(opt);
        });
        daysLoaded = true;
        historyStatus.textContent = (data.days || []).length
          ? ""
          : "No past conversations found.";
      } catch (e) {
        historyStatus.textContent = "Couldn't load days.";
      }
    }
  }

  historyBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "history") {
      closeHistoryPanel();
    } else {
      openHistoryPanel();
    }
  });

  historyDaySelect.addEventListener("change", async () => {
    const date = historyDaySelect.value;
    output.innerHTML = "";
    if (!date) return;

    historyStatus.textContent = "Loading…";
    try {
      const res = await fetch(
        CONFIG.ENDPOINT + CONFIG.HISTORY_DAY_PATH + "?date=" + encodeURIComponent(date),
        { headers: { Authorization: "Bearer " + authToken } }
      );
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      const entries = data.entries || [];

      if (entries.length === 0) {
        addEntry("system", "", "No conversations logged that day.");
        historyStatus.textContent = "";
        return;
      }

      entries.forEach((e) => {
        renderHistoryEntry(e);
      });
      historyStatus.textContent = `${entries.length} exchange${entries.length === 1 ? "" : "s"}`;
    } catch (e) {
      addEntry("system", "", "Couldn't load that day's conversation.");
      historyStatus.textContent = "";
    }
  });

  function renderHistoryEntry(e) {
    // Same visual shape as live chat: user bubble, then Perla's reply.
    // Tier 0 (direct system dispatch, no LLM) gets a subtler treatment
    // since it's a command echo rather than a conversational reply.
    const isTier0 = e.tier === 0;

    if (e.input) {
      addHistoryEntry("user", "You", e.input, e.time);
    }
    if (e.response) {
      const kind = isTier0 ? "perla entry-tier0" : "perla";
      addHistoryEntry(kind, "Perla", e.response, e.time);
    }
  }

  function addHistoryEntry(kind, label, text, timeStr) {
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind.split(" ")[0];
    if (kind.includes("entry-tier0")) entry.classList.add("entry-tier0");
    entry.innerHTML =
      (label ? `<div class="entry-label">${label}</div>` : "") +
      `<p></p>` +
      `<div class="entry-time">${timeStr || ""}</div>`;
    entry.querySelector("p").textContent = text;
    output.appendChild(entry);
    return entry;
  }

  // ---------- Reminders (view-only, status-grouped) ----------
  const remindersBtn = document.getElementById("remindersBtn");
  const remindersBar = document.getElementById("remindersBar");
  const remindersStatus = document.getElementById("remindersStatus");

  function closeRemindersPanel() {
    if (activeOverlay !== "reminders") return;
    activeOverlay = null;
    remindersBtn.classList.remove("active");
    remindersBar.hidden = true;
    composer.hidden = false;
    remindersStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openRemindersPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeHistoryPanel();

    activeOverlay = "reminders";
    remindersBtn.classList.add("active");
    remindersBar.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    remindersStatus.textContent = "Loading…";

    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.REMINDERS_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      renderReminders(data);
      remindersStatus.textContent = "";
    } catch (e) {
      output.innerHTML = "";
      addEntry("system", "", "Couldn't load reminders.");
      remindersStatus.textContent = "";
    }
  }

  remindersBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "reminders") {
      closeRemindersPanel();
    } else {
      openRemindersPanel();
    }
  });

  function formatReminderTime(iso) {
    // iso like 2026-08-26T18:00 -> "Tue, Aug 26 · 6:00 PM"; if it's today,
    // just the time.
    if (!iso) return "";
    const dt = new Date(iso);
    if (isNaN(dt.getTime())) return iso;
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const timeStr = dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    if (isToday) return `Today · ${timeStr}`;
    const dateStr = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `${dateStr} · ${timeStr}`;
  }

  function renderReminders(data) {
    output.innerHTML = "";

    const pending = data.pending || [];
    const missed = data.missed || [];
    const delivered = data.delivered || [];

    if (pending.length === 0 && missed.length === 0 && delivered.length === 0) {
      const wrap = document.createElement("div");
      wrap.className = "reminder-empty";
      wrap.textContent = "No reminders set.";
      output.appendChild(wrap);
      return;
    }

    if (missed.length > 0) {
      output.appendChild(buildReminderSection(
        "missed", `⚠ Missed (${missed.length})`, missed,
        (r) => `Was due ${formatReminderTime(r.due)} — caught at ${formatReminderTime(r.delivered)}`
      ));
    }

    // Upcoming always shows, even when empty, so it's clear there's
    // nothing pending rather than looking like the section didn't load.
    const upcomingSection = buildReminderSection(
      "pending", `Upcoming (${pending.length})`, pending,
      (r) => r.overdue ? `Due ${formatReminderTime(r.due)} — waiting to fire` : `Due ${formatReminderTime(r.due)}`,
      "Nothing on the books."
    );
    output.appendChild(upcomingSection);

    if (delivered.length > 0) {
      const details = document.createElement("details");
      details.className = "reminder-collapsible reminder-section";
      const summary = document.createElement("summary");
      summary.innerHTML = `<div class="reminder-section-title">Delivered (${delivered.length})<span class="disclosure-arrow">›</span></div>`;
      details.appendChild(summary);
      const list = buildReminderList(delivered, "delivered",
        (r) => `Delivered ${formatReminderTime(r.delivered)}`
      );
      details.appendChild(list);
      output.appendChild(details);
    }
  }

  function buildReminderSection(statusClass, title, items, metaFn, emptyText) {
    const section = document.createElement("div");
    section.className = "reminder-section";
    const heading = document.createElement("div");
    heading.className = "reminder-section-title " + statusClass;
    heading.textContent = title;
    section.appendChild(heading);

    if (items.length === 0 && emptyText) {
      const empty = document.createElement("div");
      empty.className = "reminder-empty";
      empty.textContent = emptyText;
      section.appendChild(empty);
      return section;
    }

    section.appendChild(buildReminderList(items, statusClass, metaFn));
    return section;
  }

  function buildReminderList(items, statusClass, metaFn) {
    const list = document.createElement("div");
    const glyphs = { pending: "⏰", missed: "⚠", delivered: "✓" };

    items.forEach((r) => {
      const row = document.createElement("div");
      row.className = "reminder-row";

      const glyphClass = statusClass === "pending" && r.overdue ? "overdue" : statusClass;
      const glyph = document.createElement("div");
      glyph.className = "reminder-glyph " + glyphClass;
      glyph.textContent = statusClass === "pending" ? glyphs.pending : glyphs[statusClass];

      const body = document.createElement("div");
      body.className = "reminder-body";
      const text = document.createElement("div");
      text.className = "reminder-text";
      text.textContent = r.text;
      const meta = document.createElement("div");
      meta.className = "reminder-meta";
      meta.textContent = metaFn(r);
      body.appendChild(text);
      body.appendChild(meta);

      row.appendChild(glyph);
      row.appendChild(body);
      list.appendChild(row);
    });

    return list;
  }
</script>

</body>
</html>
