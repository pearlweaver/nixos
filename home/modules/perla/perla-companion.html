<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Perla</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
<style>
  :root{
    --bg: #17131a;
    --bg-panel: #201a23;
    --bg-panel-2: #29212c;
    --rule: #453a49;
    --rule-faint: #322a36;
    --ink: #e9dfc7;
    --ink-dim: #a3906c;
    --ink-faint: #6e5f45;
    --brass: #c97b8d;
    --brass-bright: #e4a2b2;
    --brass-dim: #8c4f5c;
    --wax: #8a3226;
    --wax-bright: #b8452f;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
  }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,123,141,0.07), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; }
  input { font-family: inherit; }

  /* ---------- Password Gate ---------- */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    background: var(--bg);
  }

  .gate-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 40px 32px 32px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .gate-mark {
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
    overflow: hidden;
  }
  .gate-mark img,
  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .gate-card h1 {
    margin: 0 0 32px;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .gate-card input[type="password"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-size: 16px;
    text-align: center;
    padding: 10px 4px;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .gate-card input[type="password"]:focus {
    border-bottom-color: var(--brass);
  }

  .gate-card button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.14), rgba(201,123,141,0.04));
    color: var(--brass-bright);
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .gate-card button:hover { background: rgba(201,123,141,0.2); }
  .gate-card button:active { transform: scale(0.98); }

  .gate-error {
    margin: 14px 0 0;
    color: var(--wax-bright);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ---------- App shell ---------- */
  .app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 640px;
    margin: 0 auto;
    border-left: 1px solid var(--rule-faint);
    border-right: 1px solid var(--rule-faint);
  }

  .content-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    will-change: transform;
    transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--rule);
    position: relative;
    z-index: 2;
    background: var(--bg-panel);
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--brass-bright);
    overflow: hidden;
  }

  .brand-name {
    font-size: 19px;
    letter-spacing: 0.03em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    margin-left: 6px;
    flex-shrink: 0;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .status-dot.ok { background: #7fae6a; box-shadow: 0 0 8px rgba(127,174,106,0.6); }
  .status-dot.err { background: var(--wax-bright); box-shadow: 0 0 8px rgba(184,69,47,0.6); }

  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
  }

  .output {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .entry { max-width: 92%; }
  .entry-user {
    align-self: flex-end;
    margin-left: auto;
    text-align: left;
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.07));
    border: 1px solid rgba(201,123,141,0.28);
    border-radius: 16px 16px 4px 16px;
    padding: 10px 14px;
  }
  .entry-perla {
    align-self: flex-start;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
    padding: 10px 14px;
  }
  .entry-system {
    align-self: center;
    text-align: center;
    max-width: 100%;
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--rule-faint);
    border-radius: 20px;
    padding: 6px 14px;
  }

  .entry-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }

  .entry-user .entry-label { color: var(--brass-dim); }
  .entry-perla .entry-label { color: var(--ink-dim); }

  .entry p {
    margin: 0;
    font-size: 16px;
    line-height: 1.55;
  }

  .entry-user p { color: var(--ink); }
  .entry-perla p { color: var(--ink); }
  .entry-system p {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
  }

  .entry-time {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 5px;
    opacity: 0.7;
  }

  .entry-image-wrap {
    margin-top: 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--bg);
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-image {
    display: block;
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    cursor: zoom-in;
    background: var(--bg);
    border-radius: 10px;
  }

  .entry-image-loading,
  .entry-image-error {
    display: block;
    padding: 20px 14px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
    text-align: center;
  }
  .entry-image-error { color: var(--wax-bright); }

  .replay-btn {
    margin-top: 6px;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: var(--font-serif);
  }
  .replay-btn:hover { border-color: var(--brass-dim); color: var(--brass); }

  /* ---------- Composer ---------- */
  .composer {
    border-top: 1px solid var(--rule);
    padding: 10px 14px calc(10px + var(--safe-bottom));
    background: var(--bg-panel);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .attach-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-faint);
    font-size: 20px;
    cursor: pointer;
  }
  .attach-btn:hover { border-color: var(--brass-dim); color: var(--brass-bright); }

  .attach-preview {
    position: relative;
    align-self: flex-start;
    max-width: 120px;
    border: 1px solid var(--brass-dim);
    border-radius: 8px;
    padding: 3px;
    background: rgba(201,123,141,0.06);
  }
  .attach-preview img {
    display: block;
    max-width: 110px;
    max-height: 90px;
    border-radius: 5px;
  }
  .attach-clear {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 22px;
    height: 22px;
    line-height: 1;
    border-radius: 50%;
    border: 1px solid var(--wax);
    background: var(--bg-panel);
    color: var(--wax-bright);
    font-size: 12px;
    cursor: pointer;
  }

  .composer-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  #textInput {
    flex: 1;
    resize: none;
    max-height: 120px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 10px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    padding: 11px 14px;
    line-height: 1.4;
    outline: none;
    transition: border-color 0.2s ease;
  }
  #textInput:focus { border-color: var(--brass-dim); }
  #textInput::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.05));
    color: var(--brass-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .send-btn svg { width: 19px; height: 19px; }
  .send-btn:hover { background: rgba(201,123,141,0.22); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled {
    opacity: 0.32;
    cursor: default;
    transform: none;
    background: linear-gradient(180deg, rgba(201,123,141,0.08), rgba(201,123,141,0.02));
  }

  .mic-btn {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--wax);
    background: radial-gradient(circle at 35% 30%, rgba(138,50,38,0.35), rgba(138,50,38,0.08));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, transform 0.15s ease;
  }
  .mic-btn.typing-hidden { display: none; }

  .mic-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--wax-bright);
    transition: transform 0.2s ease;
  }

  .mic-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--wax-bright);
    opacity: 0;
  }

  .mic-btn.recording .mic-dot {
    border-radius: 3px;
    transform: scale(0.6);
  }

  .mic-btn.recording .ring-1 { animation: pulse-ring 1.8s ease-out infinite; }
  .mic-btn.recording .ring-2 { animation: pulse-ring 1.8s ease-out infinite 0.6s; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .mic-timer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .mic-timer:empty { display: none; }

  /* ---------- Thinking indicator ---------- */
  .thinking {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
  }
  .think-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brass-bright);
    animation: think-bounce 1.1s ease-in-out infinite;
  }
  .think-dot:nth-child(2) { animation-delay: 0.15s; }
  .think-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes think-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- Welcome empty state ---------- */
  .welcome {
    margin: 14vh auto 0;
    text-align: center;
    color: var(--ink-dim);
    max-width: 320px;
  }
  .welcome-mark {
    width: 62px;
    height: 62px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
    overflow: hidden;
  }
  .welcome-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .welcome h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .welcome p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  /* ---------- Image lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(12,10,14,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fade-in 0.18s ease;
  }
  .lightbox[hidden] { display: none; }
  .lightbox img {
    max-width: 94vw;
    max-height: 92vh;
    border-radius: 10px;
    border: 1px solid var(--rule);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  .lightbox-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: rgba(23,19,26,0.6);
    color: var(--ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lightbox-close:hover { border-color: var(--brass-dim); color: var(--brass-bright); }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .mic-btn.recording .ring-1,
    .mic-btn.recording .ring-2 { animation: none; }
    .think-dot { animation: none; }
    .lightbox { animation: none; }
    .shake { animation: none; }
  }

  @media (min-width: 641px) {
    body { padding: 28px 0; }
    .app {
      height: calc(100dvh - 56px);
      border-radius: 16px;
      border: 1px solid var(--rule-faint);
      box-shadow: 0 40px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }
  }

  .tier-badge {
    background: linear-gradient(180deg, var(--wax-bright), var(--wax));
    color: var(--bg);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 20px;
    margin-right: 6px;
    box-shadow: 0 0 10px rgba(184,69,47,0.45);
  }

  .tier-timer {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--brass-bright);
    border: 1px solid var(--brass-dim);
    background: rgba(201,123,141,0.08);
    padding: 2px 8px;
    border-radius: 20px;
    margin-right: 6px;
    font-variant-numeric: tabular-nums;
  }
  .tier-timer[hidden] { display: none; }

  .elevate-submit {
    background: linear-gradient(180deg, rgba(184,69,47,0.22), rgba(184,69,47,0.08));
    color: var(--wax-bright);
    border: 1px solid var(--wax);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .elevate-submit:hover { background: rgba(184,69,47,0.32); }
  .elevate-submit:active { transform: scale(0.96); }
  .panel-status {
    display: block;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-style: italic;
  }
  .panel-status:empty { display: none; }

  /* ---------- Header icon buttons (shared: history, elevate) ---------- */
  .icon-btn {
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-dim);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--brass-dim); color: var(--brass-bright); }
  .icon-btn.active {
    border-color: var(--brass);
    color: var(--brass-bright);
    background: rgba(201,123,141,0.14);
  }

  /* ---------- Hamburger menu button ---------- */
  .menu-btn { position: relative; }

  .hamburger-lines {
    width: 15px;
    height: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hamburger-lines span {
    display: block;
    width: 100%;
    height: 1.5px;
    background: currentColor;
    border-radius: 1px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .menu-btn.active .hamburger-lines span:nth-child(1) {
    transform: translateY(4.5px) rotate(45deg);
  }
  .menu-btn.active .hamburger-lines span:nth-child(2) { opacity: 0; }
  .menu-btn.active .hamburger-lines span:nth-child(3) {
    transform: translateY(-4.5px) rotate(-45deg);
  }

  /* ---------- App menu (hamburger dropdown) ---------- */
  .app-menu {
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border-bottom: 1px solid var(--rule);
    animation: panel-drop 0.18s ease;
  }
  .app-menu[hidden] { display: none; }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    text-align: left;
    padding: 12px 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .menu-item:hover { background: rgba(201,123,141,0.08); }
  .menu-item.active {
    background: rgba(201,123,141,0.14);
    color: var(--brass-bright);
  }
  .menu-item-icon {
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-size: 15px;
  }
  .menu-item-label { flex: 1; }
  .menu-item-badge {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .menu-item-badge.locked { color: var(--wax-bright); }
  .menu-item-badge.unread {
    color: var(--brass-bright);
    font-weight: 600;
  }

  .menu-divider {
    height: 1px;
    background: var(--rule);
    margin: 6px 4px;
  }

  /* ---------- Dropdown panels (history day picker, elevate token) ---------- */
  .dropdown-panel {
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border-bottom: 1px solid var(--rule);
    animation: panel-drop 0.18s ease;
  }

  @keyframes panel-drop {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dropdown-row input,
  .dropdown-row select {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink);
    padding: 9px 11px;
    font-size: 0.85rem;
    font-family: var(--font-serif);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .dropdown-row input::placeholder { color: var(--ink-faint); }
  .dropdown-row input:focus,
  .dropdown-row select:focus { border-color: var(--brass-dim); }

  .entry-tier0 .entry-label { color: var(--ink-faint); }
  .entry-tier0 p { color: var(--ink-dim); font-style: italic; }

  /* ---------- Reminders ---------- */
  .reminder-section-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .reminder-section-title.missed { color: var(--wax-bright); }
  .reminder-section-title.pending { color: var(--brass-bright); }

  .reminder-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-faint);
  }
  .reminder-row:last-child { border-bottom: none; }

  .reminder-glyph {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-top: 1px;
  }
  .reminder-glyph.pending { color: var(--brass-bright); }
  .reminder-glyph.overdue { color: var(--wax-bright); }
  .reminder-glyph.missed { color: var(--wax-bright); }
  .reminder-glyph.delivered { color: #7fae6a; }

  .reminder-body { flex: 1; min-width: 0; }
  .reminder-text {
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }
  .reminder-meta {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  .reminder-empty {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
    padding: 4px 0 18px;
  }

  .reminder-collapsible summary {
    cursor: pointer;
    list-style: none;
  }
  .reminder-collapsible summary::-webkit-details-marker { display: none; }
  .reminder-collapsible summary .reminder-section-title { margin-bottom: 10px; }
  .reminder-collapsible summary .disclosure-arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    margin-left: auto;
    color: var(--ink-faint);
  }
  .reminder-collapsible[open] summary .disclosure-arrow { transform: rotate(90deg); }

  .reminder-section {
    margin-bottom: 22px;
  }
  .reminder-section:last-child { margin-bottom: 0; }
</style>
</head>
<body>

  <div id="gate" class="gate">
    <div class="gate-card">
      <div id="gateMark" class="gate-mark">P</div>
      <h1>Perla</h1>
      <input id="gatePassword" type="password" placeholder="password" autocomplete="off" inputmode="text" />
      <button id="gateSubmit">Unlock</button>
      <p id="gateError" class="gate-error" hidden>Wrong password.</p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <header class="app-header">
      <div class="brand">
        <span id="brandMark" class="brand-mark">P</span>
        <span class="brand-name">Perla</span>
      </div>
      <div class="status">
        <span id="tierBadge" class="tier-badge">T1</span>
        <span id="tierTimer" class="tier-timer" hidden></span>
        <button id="menuBtn" class="icon-btn menu-btn" aria-label="Menu" aria-expanded="false" title="Menu">
          <span class="hamburger-lines"><span></span><span></span><span></span></span>
        </button>
        <span class="status-dot" id="statusDot"></span>
      </div>
    </header>

    <nav id="appMenu" class="app-menu" hidden>
      <button id="tier1Btn" class="menu-item tier-item active">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="menu-item-label">Tier 1 chat</span>
        <span class="menu-item-badge" id="tier1Badge"></span>
      </button>
      <button id="tier2Btn" class="menu-item tier-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg></span>
        <span class="menu-item-label">Tier 2 chat</span>
        <span class="menu-item-badge" id="tier2Badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="4" y="11" width="16" height="11" rx="2" ry="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
      </button>
      <div class="menu-divider"></div>
      <button id="elevateBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>
        <span class="menu-item-label">Full Mode</span>
      </button>
      <button id="remindersBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></span>
        <span class="menu-item-label">Reminders</span>
      </button>
      <button id="historyBtn" class="menu-item">
        <span class="menu-item-icon"><svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="19" height="19"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
        <span class="menu-item-label">History</span>
      </button>
    </nav>

    <div id="historyPanel" class="dropdown-panel" hidden>
      <div class="dropdown-row">
        <select id="historyDaySelect">
          <option value="">Select a day…</option>
        </select>
      </div>
      <span id="historyStatus" class="panel-status"></span>
    </div>

    <div id="elevatePanel" class="dropdown-panel" hidden>
      <div class="dropdown-row">
        <input id="elevateInput" type="password" placeholder="Elevation token" autocomplete="off" />
        <button id="elevateSubmit" class="elevate-submit">Activate</button>
      </div>
      <span id="elevateStatus" class="panel-status"></span>
    </div>

    <div id="remindersBar" class="dropdown-panel" hidden>
      <span id="remindersStatus" class="panel-status"></span>
    </div>

    <div class="content-wrap">
    <main class="page">
      <div id="output" class="output" aria-live="polite"></div>
    </main>

    <footer class="composer">
      <div id="attachPreview" class="attach-preview" hidden>
        <img id="attachPreviewImg" alt="">
        <button id="attachClear" class="attach-clear" aria-label="Remove image" title="Remove image">✕</button>
      </div>
      <div class="composer-row">
        <label id="attachLabel" class="attach-btn" aria-label="Attach image" title="Attach an image">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <input id="attachInput" type="file" accept="image/*" hidden>
        </label>
        <textarea id="textInput" rows="1" placeholder="Write to Perla…"></textarea>
        <button id="micBtn" class="mic-btn" aria-label="Record">
          <span class="mic-ring ring-1"></span>
          <span class="mic-ring ring-2"></span>
          <span class="mic-dot"></span>
        </button>
        <button id="sendText" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
      </div>
      <span id="micTimer" class="mic-timer"></span>
    </footer>
  </div>
  </div>

  <audio id="responseAudio" hidden></audio>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightboxClose" class="lightbox-close" aria-label="Close image" title="Close">✕</button>
    <img id="lightboxImage" alt="">
  </div>

<script>

  const CONFIG = {
    ENDPOINT: "https://nixos.fish-glyptodon.ts.net",           // Tailscale HTTPS address
    TEXT_PATH: "/api/text",
    VOICE_PATH: "/api/voice",
    HEALTH_PATH: "/api/health",
    GATE_PATH: "/api/gate",
    HISTORY_DAYS_PATH: "/api/history/days",
    HISTORY_DAY_PATH: "/api/history/day",
    REMINDERS_PATH: "/api/reminders",
    AVATAR_PATH: "/api/avatar",
  };

  const GATE_PASSWORD = "goharumer"; // UX gate only — short, human-typeable

  let authToken = sessionStorage.getItem("perla_session_token") || null;

  let customAvatarUrl = null;

  // ---------- Custom avatar (profile.jpg) ----------
  // Unauthenticated probe — the server serves this without auth since a
  // profile picture isn't sensitive, and the browser's own favicon fetch
  // can't carry an Authorization header anyway. Falls back to the "P"
  // mark (already in the markup) if the file isn't there.
  (function loadAvatar() {
    if (!CONFIG.ENDPOINT) return;
    const avatarUrl = CONFIG.ENDPOINT + CONFIG.AVATAR_PATH;
    const probe = new Image();
    probe.onload = () => {
      customAvatarUrl = avatarUrl;
      document.querySelectorAll("#gateMark, #brandMark").forEach((mark) => {
        mark.textContent = "";
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = "Perla";
        mark.appendChild(img);
      });
      let favicon = document.querySelector('link[rel="icon"]');
      if (favicon) favicon.href = avatarUrl;
    };
    probe.onerror = () => {
      // No profile.jpg deployed yet — keep the default "P" mark and SVG
      // favicon already in the markup, no action needed.
    };
    probe.src = avatarUrl;
  })();

  // ---------- Tier state (separate Tier 1 / Tier 2 chats) ----------
  // Each tier keeps its own chat transcript. Stored in sessionStorage so a
  // reload within the same gate-unlock doesn't lose either conversation,
  // but a fresh gate unlock always starts clean at Tier 1 per spec.
  let activeTier = parseInt(sessionStorage.getItem("perla_active_tier") || "1", 10);
  let isElevated = sessionStorage.getItem("perla_elevated") === "1";
  let tier2Unread = sessionStorage.getItem("perla_tier2_unread") === "1";

  function getChatLog(tier) {
    return sessionStorage.getItem("perla_chat_t" + tier) || "";
  }

  function setChatLog(tier, html) {
    try {
      sessionStorage.setItem("perla_chat_t" + tier, html);
    } catch (e) {
      // sessionStorage quota exceeded or unavailable — chat still works
      // in-memory for this page view, just won't survive a reload.
    }
  }

  // Overlay view state (history / reminders share the main output area
  // as a read-only overlay on top of whichever tier's chat is active).
  // Declared here (not where first used) so addEntry, defined below, can
  // reference activeOverlay without relying on hoisting/call-order luck.
  let liveOutputHTML = null;
  let activeOverlay = null;  // "history" | "reminders" | null

  // ---------- Gate ----------
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const gatePassword = document.getElementById("gatePassword");
  const gateSubmit = document.getElementById("gateSubmit");
  const gateError = document.getElementById("gateError");
  const gateCard = document.querySelector(".gate-card");

  // If we already have a session token, skip the gate — this is a reload
  // within the same gate-unlock, so restore whatever tier/chat state was
  // saved rather than resetting to Tier 1. The actual initAppState() call
  // happens at the end of the script, once all DOM refs below exist.
  if (authToken) {
    gate.style.display = "none";
    app.hidden = false;
    checkConnection();
  }

  function initAppState(freshUnlock) {
    if (freshUnlock) {
      // New gate session: always start at Tier 1, drop any elevation and
      // chat transcripts left over from a previous session.
      sessionStorage.removeItem("perla_chat_t1");
      sessionStorage.removeItem("perla_chat_t2");
      sessionStorage.removeItem("perla_elevate_until");
      sessionStorage.setItem("perla_active_tier", "1");
      sessionStorage.setItem("perla_elevated", "0");
      sessionStorage.setItem("perla_tier2_unread", "0");
      activeTier = 1;
      isElevated = false;
      tier2Unread = false;
    }
    setElevated(isElevated);
    tierBadge.textContent = "T" + activeTier;
    tier1Btn.classList.toggle("active", activeTier === 1);
    tier2Btn.classList.toggle("active", activeTier === 2);
    updateTier2UnreadBadge();
    const savedLog = getChatLog(activeTier);
    if (savedLog) {
      output.innerHTML = savedLog;
      // blob: URLs from a previous page load don't survive a reload —
      // swap any stale screenshot image for a plain notice instead of
      // showing a broken-image icon.
      output.querySelectorAll("img.entry-image").forEach((img) => {
        if (img.src.startsWith("blob:")) {
          const wrap = img.closest(".entry-image-wrap");
          if (wrap) wrap.innerHTML = '<span class="entry-image-error">Screenshot no longer available after reload.</span>';
        }
      });
      output.scrollIntoView({ block: "end" });
    } else {
      showWelcome(activeTier);
    }
  }

  async function tryUnlock() {
    const value = gatePassword.value;
    if (value.length === 0) return;

    // Client-side UX check first (fast fail, no network)
    if (value !== GATE_PASSWORD) {
      gateError.textContent = "Wrong password.";
      gateError.hidden = false;
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
      return;
    }

    // Exchange gate password for a server-issued session token
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.GATE_PATH, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: value }),
      });
      if (!res.ok) throw new Error("gate rejected");
      const data = await res.json();
      authToken = data.token;
      sessionStorage.setItem("perla_session_token", authToken);
      gate.style.display = "none";
      app.hidden = false;
      checkConnection();
      initAppState(true);
    } catch (e) {
      gateError.hidden = false;
      gateError.textContent = "Server rejected the password.";
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
    }
  }

  gateSubmit.addEventListener("click", tryUnlock);
  gatePassword.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  // ---------- Status ----------
  const statusDot = document.getElementById("statusDot");
  function setStatusText(text) {
    statusDot.title = text;
  }

  async function checkConnection() {
    if (!CONFIG.ENDPOINT) {
      statusDot.className = "status-dot";
      setStatusText("not linked");
      return;
    }
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.HEALTH_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (res.ok) {
        statusDot.className = "status-dot ok";
        setStatusText("connected");
      } else {
        throw new Error("bad status");
      }
    } catch (e) {
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    }
  }

  // ---------- Hamburger menu ----------
  const menuBtn = document.getElementById("menuBtn");
  const appMenu = document.getElementById("appMenu");

  function closeAppMenu() {
    appMenu.hidden = true;
    menuBtn.classList.remove("active");
    menuBtn.setAttribute("aria-expanded", "false");
  }

  function toggleAppMenu() {
    const opening = appMenu.hidden;
    appMenu.hidden = !opening;
    menuBtn.classList.toggle("active", opening);
    menuBtn.setAttribute("aria-expanded", String(opening));
  }

  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleAppMenu();
  });

  document.addEventListener("click", (e) => {
    if (!appMenu.hidden && !appMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeAppMenu();
    }
  });

  // ---------- Elevation (Tier 2) ----------
  const elevateBtn = document.getElementById("elevateBtn");
  const elevatePanel = document.getElementById("elevatePanel");
  const elevateInput = document.getElementById("elevateInput");
  const elevateSubmit = document.getElementById("elevateSubmit");
  const elevateStatus = document.getElementById("elevateStatus");
  const tierBadge = document.getElementById("tierBadge");

  elevateBtn.addEventListener("click", () => {
    closeAppMenu();
    closeHistoryPanel();
    closeRemindersPanel();
    const opening = elevatePanel.hidden;
    elevatePanel.hidden = !opening;
    elevateBtn.classList.toggle("active", opening);
    if (opening) elevateInput.focus();
  });

  elevateSubmit.addEventListener("click", async () => {
    const token = elevateInput.value.trim();
    if (!token) return;
    elevateStatus.textContent = "Activating…";
    try {
      const res = await fetch(CONFIG.ENDPOINT + "/api/elevate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (res.ok && data.tier === 2) {
        elevateStatus.textContent = "";
        elevateInput.value = "";
        elevatePanel.hidden = true;
        elevateBtn.classList.remove("active");
        setElevated(true);
        addEntry("system", "", "Full Mode activated for 5 minutes.");

        const until = Date.now() + (data.expires_in || 0) * 1000;
        sessionStorage.setItem("perla_elevate_until", String(until));
        startTierTimer(until);

        clearTimeout(window._elevateExpiryTimer);
        window._elevateExpiryTimer = setTimeout(() => {
          sessionStorage.removeItem("perla_elevate_until");
          stopTierTimer();
          setElevated(false);
          if (activeTier === 2) {
            switchTier(1);
            addEntry("system", "", "Full Mode expired — back to Tier 1.");
          } else {
            addEntry("system", "", "Full Mode expired.");
          }
        }, (data.expires_in || 0) * 1000);
      } else {
        elevateStatus.textContent = data.error || "Failed";
      }
    } catch (e) {
      elevateStatus.textContent = "Connection error";
    }
  });

  elevateInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") elevateSubmit.click();
  });

  // ---------- Output ----------
  const output = document.getElementById("output");

  function addEntry(kind, label, text) {
    // A real exchange replaces the welcome card.
    if (kind !== "system") {
      output.querySelectorAll(".welcome").forEach((w) => w.remove());
    }
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind;
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    entry.innerHTML =
      (label ? `<div class="entry-label">${label}</div>` : "") +
      `<p></p>` +
      (kind !== "system" ? `<div class="entry-time">${time}</div>` : "");
    entry.querySelector("p").textContent = text;
    output.appendChild(entry);
    output.scrollIntoView({ block: "end" });
    entry.scrollIntoView({ behavior: "smooth", block: "end" });
    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);
    return entry;
  }

  // Screenshot images require an authenticated fetch (same as audio) since
  // the endpoint is gated — a bare <img src> can't carry the bearer token.
  // Renders as its own bubble under the Perla label, with the caption text
  // (if any) shown above it.
  async function addImageEntry(label, imageUrl, captionText) {
    const entry = document.createElement("div");
    entry.className = "entry entry-perla";
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    entry.innerHTML =
      (label ? `<div class="entry-label">${label}</div>` : "") +
      (captionText ? `<p></p>` : "") +
      `<div class="entry-image-wrap"><span class="entry-image-loading">Loading screenshot…</span></div>` +
      `<div class="entry-time">${time}</div>`;
    if (captionText) entry.querySelector("p").textContent = captionText;
    output.appendChild(entry);
    output.scrollIntoView({ block: "end" });
    entry.scrollIntoView({ behavior: "smooth", block: "end" });

    const wrap = entry.querySelector(".entry-image-wrap");
    try {
      const url = imageUrl.startsWith("http") ? imageUrl : CONFIG.ENDPOINT + imageUrl;
      const res = await fetch(url, { headers: { Authorization: "Bearer " + authToken } });
      if (!res.ok) throw new Error("image fetch failed");
      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      wrap.innerHTML = "";
      const img = document.createElement("img");
      img.className = "entry-image";
      img.src = objectUrl;
      img.alt = "Screenshot";
      img.addEventListener("click", () => openLightbox(objectUrl));
      wrap.appendChild(img);
    } catch (e) {
      wrap.innerHTML = `<span class="entry-image-error">Couldn't load the screenshot.</span>`;
    }

    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);
    return entry;
  }

  // ---------- Image lightbox ----------
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");
  const lightboxClose = document.getElementById("lightboxClose");

  function openLightbox(src) {
    lightboxImage.src = src;
    lightbox.hidden = false;
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImage.removeAttribute("src");
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
  });

  // ---------- Welcome empty state ----------
  function showWelcome(tier) {
    const active = tier !== undefined ? tier : activeTier;
    output.innerHTML = "";
    const card = document.createElement("div");
    card.className = "welcome";
    const mark = document.createElement("div");
    mark.className = "welcome-mark";
    if (customAvatarUrl) {
      const img = document.createElement("img");
      img.src = customAvatarUrl;
      img.alt = "Perla";
      mark.appendChild(img);
    } else {
      mark.textContent = "P";
    }
    const title = document.createElement("h2");
    title.textContent = active === 2 ? "Full Mode" : "Perla";
    const sub = document.createElement("p");
    sub.textContent = active === 2
      ? "Shell, files, and everything else are in play."
      : "Ask, talk, or attach an image.";
    card.appendChild(mark);
    card.appendChild(title);
    card.appendChild(sub);
    output.appendChild(card);
    output.scrollIntoView({ block: "end" });
  }

  // ---------- Thinking indicator ----------
  function showThinking() {
    hideThinking();
    const el = document.createElement("div");
    el.className = "thinking";
    el.id = "thinkingIndicator";
    el.innerHTML = '<span class="think-dot"></span><span class="think-dot"></span><span class="think-dot"></span>';
    output.appendChild(el);
    output.scrollIntoView({ block: "end" });
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }
  function hideThinking() {
    const el = document.getElementById("thinkingIndicator");
    if (el) el.remove();
  }

  // ---------- Tier switching (Tier 1 / Tier 2 as separate chats) ----------
  const tier1Btn = document.getElementById("tier1Btn");
  const tier2Btn = document.getElementById("tier2Btn");
  const tier1Badge = document.getElementById("tier1Badge");
  const tier2Badge = document.getElementById("tier2Badge");

  const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="4" y="11" width="16" height="11" rx="2" ry="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function renderTier2Badge() {
    tier2Badge.classList.remove("locked", "unread");
    if (activeTier === 1 && tier2Unread) {
      tier2Badge.textContent = "new";
      tier2Badge.classList.add("unread");
    } else if (isElevated) {
      tier2Badge.innerHTML = "";
    } else {
      tier2Badge.innerHTML = LOCK_ICON;
      tier2Badge.classList.add("locked");
    }
  }

  function setElevated(value) {
    isElevated = value;
    sessionStorage.setItem("perla_elevated", value ? "1" : "0");
    renderTier2Badge();
  }

  function updateTier2UnreadBadge() {
    renderTier2Badge();
  }

  // ---------- Full Mode live countdown ----------
  const tierTimerEl = document.getElementById("tierTimer");
  let tierTimerInterval = null;
  let tierTimerUntil = 0;

  function stopTierTimer() {
    if (tierTimerInterval) {
      clearInterval(tierTimerInterval);
      tierTimerInterval = null;
    }
    tierTimerEl.hidden = true;
  }

  function tickTierTimer() {
    const remain = Math.max(0, Math.round((tierTimerUntil - Date.now()) / 1000));
    if (remain <= 0) {
      stopTierTimer();
      return;
    }
    const m = Math.floor(remain / 60);
    const s = remain % 60;
    tierTimerEl.textContent = m + ":" + String(s).padStart(2, "0");
    tierTimerEl.hidden = false;
  }

  function startTierTimer(until) {
    tierTimerUntil = until;
    stopTierTimer();
    tickTierTimer();
    tierTimerInterval = setInterval(tickTierTimer, 500);
  }

  function switchTier(tier) {
    if (tier === activeTier) return;
    if (tier === 2 && !isElevated) {
      // Route to elevation instead of silently failing — one tap gets
      // you to the thing you actually need to do.
      closeAppMenu();
      elevateBtn.click();
      return;
    }

    // Persist current tier's transcript before swapping.
    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);

    activeTier = tier;
    sessionStorage.setItem("perla_active_tier", String(tier));
    tierBadge.textContent = "T" + tier;

    tier1Btn.classList.toggle("active", tier === 1);
    tier2Btn.classList.toggle("active", tier === 2);

    if (tier === 2) {
      tier2Unread = false;
      sessionStorage.setItem("perla_tier2_unread", "0");
    }
    updateTier2UnreadBadge();

    if (activeOverlay === null) {
      output.innerHTML = getChatLog(tier);
      if (!output.innerHTML) {
        showWelcome(tier);
      }
      output.scrollIntoView({ block: "end" });
    }
  }

  tier1Btn.addEventListener("click", () => { closeAppMenu(); switchTier(1); });
  tier2Btn.addEventListener("click", () => { closeAppMenu(); switchTier(2); });

  function addReplayButton(entry, audioValue) {    const btn = document.createElement("button");
    btn.className = "replay-btn";
    btn.textContent = "Play";
    btn.addEventListener("click", () => playAudio(audioValue));
    entry.appendChild(btn);
  }

  // ---------- Audio playback ----------
  const responseAudio = document.getElementById("responseAudio");

  function playAudio(value) {
    if (!value) return;
    if (value.startsWith("http") || value.startsWith("/")) {
      // Fetch with auth headers since audio GET requires authentication
      const url = value.startsWith("http") ? value : CONFIG.ENDPOINT + value;
      fetch(url, { headers: { Authorization: "Bearer " + authToken } })
        .then(r => r.blob())
        .then(blob => {
          responseAudio.src = URL.createObjectURL(blob);
          responseAudio.play().catch(() => {});
        })
        .catch(() => {});
    } else {
      responseAudio.src = "data:audio/mp3;base64," + value;
      responseAudio.play().catch(() => {});
    }
  }

  // ---------- Text send ----------
  const textInput = document.getElementById("textInput");
  const sendText = document.getElementById("sendText");
  const attachInput = document.getElementById("attachInput");
  const attachPreview = document.getElementById("attachPreview");
  const attachPreviewImg = document.getElementById("attachPreviewImg");
  const attachClear = document.getElementById("attachClear");

  let attachDataUrl = null;
  let attachFilename = null;

  attachInput.addEventListener("change", () => {
    const file = attachInput.files && attachInput.files[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) {
      addEntry("system", "", "Please pick an image file.");
      attachInput.value = "";
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      addEntry("system", "", "Image too large — max 10MB.");
      attachInput.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      attachDataUrl = reader.result;
      attachFilename = file.name;
      attachPreviewImg.src = attachDataUrl;
      attachPreview.hidden = false;
      updateComposerState();
    };
    reader.onerror = () => addEntry("system", "", "Couldn't read that image.");
    reader.readAsDataURL(file);
    attachInput.value = "";
  });

  attachClear.addEventListener("click", () => {
    attachDataUrl = null;
    attachFilename = null;
    attachPreview.hidden = true;
    attachPreviewImg.removeAttribute("src");
    updateComposerState();
  });

  // Send button enablement + mic visibility follow what's being composed:
  // typing hides the voice button (voice becomes irrelevant while you're
  // writing), and the send button stays inert until there's text or an image.
  function updateComposerState() {
    const hasText = !!textInput.value.trim();
    const hasImage = !!attachDataUrl;
    sendText.disabled = !(hasText || hasImage);
    if (micBtn) {
      micBtn.classList.toggle("typing-hidden", hasText && !recording);
    }
  }

  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + "px";
    updateComposerState();
  });

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitText();
    }
  });

  sendText.addEventListener("click", submitText);

  async function submitText() {
    const message = textInput.value.trim();
    const image = attachDataUrl;
    if (!message && !image) return;
    if (message) addEntry("user", "You", message);
    if (image) {
      const userEntry = document.createElement("div");
      userEntry.className = "entry entry-user";
      const preview = document.createElement("img");
      preview.className = "entry-image";
      preview.src = image;
      preview.alt = "Attached image";
      preview.addEventListener("click", () => openLightbox(image));
      userEntry.appendChild(preview);
      output.appendChild(userEntry);
      output.scrollIntoView({ block: "end" });
      userEntry.scrollIntoView({ behavior: "smooth", block: "end" });
    }
    textInput.value = "";
    textInput.style.height = "auto";
    attachDataUrl = null;
    attachFilename = null;
    attachPreview.hidden = true;
    attachPreviewImg.removeAttribute("src");
    updateComposerState();

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }

    showThinking();
    try {
      const body = { message, tier: activeTier };
      if (image) {
        body.image = image;
        if (attachFilename) body.filename = attachFilename;
      }
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.TEXT_PATH, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 403 && data.error) {
          addEntry("system", "", data.error);
        } else {
          throw new Error("request failed");
        }
        return;
      }
      if (data.image) {
        await addImageEntry("Perla", data.image, data.text || "");
      } else {
        const entry = addEntry("perla", "Perla", data.text || "(no response)");
        if (data.audio) {
          playAudio(data.audio);
          addReplayButton(entry, data.audio);
        }
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    } finally {
      hideThinking();
    }
  }

  // ---------- Voice recording ----------
  const micBtn = document.getElementById("micBtn");
  const micTimer = document.getElementById("micTimer");

  let mediaRecorder = null;
  let audioChunks = [];
  let recording = false;
  let recordStart = 0;
  let timerInterval = null;

  micBtn.addEventListener("click", async () => {
    if (!recording) {
      await startRecording();
    } else {
      stopRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        handleRecordingComplete();
      };
      mediaRecorder.start();
      recording = true;
      recordStart = Date.now();
      micBtn.classList.add("recording");
      updateComposerState();
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    } catch (e) {
      micTimer.textContent = "Microphone access denied";
    }
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
      recording = false;
      micBtn.classList.remove("recording");
      clearInterval(timerInterval);
      micTimer.textContent = "Sending…";
      updateComposerState();
    }
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - recordStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const ss = String(elapsed % 60).padStart(2, "0");
    micTimer.textContent = `${mm}:${ss} — tap to stop`;
  }

  async function handleRecordingComplete() {
    const blob = new Blob(audioChunks, { type: "audio/webm" });

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      micTimer.textContent = "";
      return;
    }

    showThinking();
    try {
      const form = new FormData();
      form.append("audio", blob, "input.webm");
      form.append("tier", String(activeTier));

      const res = await fetch(CONFIG.ENDPOINT + CONFIG.VOICE_PATH, {
        method: "POST",
        headers: { Authorization: "Bearer " + authToken },
        body: form,
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 403 && data.error) {
          if (data.transcript) addEntry("user", "You", data.transcript);
          addEntry("system", "", data.error);
        } else {
          throw new Error("request failed");
        }
        return;
      }

      if (data.transcript) addEntry("user", "You", data.transcript);
      if (data.image) {
        await addImageEntry("Perla", data.image, data.text || "");
      } else {
        const entry = addEntry("perla", "Perla", data.text || "(no response)");
        if (data.audio) {
          playAudio(data.audio);
          addReplayButton(entry, data.audio);
        }
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    } finally {
      hideThinking();
      micTimer.textContent = "";
    }
  }

  // ---------- History (view-only past conversations) ----------
  const historyBtn = document.getElementById("historyBtn");
  const historyPanel = document.getElementById("historyPanel");
  const historyDaySelect = document.getElementById("historyDaySelect");
  const historyStatus = document.getElementById("historyStatus");
  const composer = document.querySelector(".composer");

  let daysLoaded = false;

  function formatDayLabel(dateStr) {
    // dateStr is YYYY-MM-DD
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const isYesterday = dt.toDateString() === yesterday.toDateString();
    const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    if (isToday) return `Today — ${label}`;
    if (isYesterday) return `Yesterday — ${label}`;
    return label;
  }

  function closeHistoryPanel() {
    if (activeOverlay !== "history") return;
    activeOverlay = null;
    historyBtn.classList.remove("active");
    historyPanel.hidden = true;
    composer.hidden = false;
    historyDaySelect.value = "";
    historyStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openHistoryPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeRemindersPanel();

    activeOverlay = "history";
    historyBtn.classList.add("active");
    historyPanel.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    addEntry("system", "", "Viewing past conversations — read only.");

    if (!daysLoaded) {
      historyStatus.textContent = "Loading days…";
      try {
        const res = await fetch(CONFIG.ENDPOINT + CONFIG.HISTORY_DAYS_PATH, {
          headers: { Authorization: "Bearer " + authToken },
        });
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        historyDaySelect.innerHTML = '<option value="">Select a day…</option>';
        (data.days || []).forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = formatDayLabel(d);
          historyDaySelect.appendChild(opt);
        });
        daysLoaded = true;
        historyStatus.textContent = (data.days || []).length
          ? ""
          : "No past conversations found.";
      } catch (e) {
        historyStatus.textContent = "Couldn't load days.";
      }
    }
  }

  historyBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "history") {
      closeHistoryPanel();
    } else {
      openHistoryPanel();
    }
  });

  historyDaySelect.addEventListener("change", async () => {
    const date = historyDaySelect.value;
    output.innerHTML = "";
    if (!date) return;

    historyStatus.textContent = "Loading…";
    try {
      const res = await fetch(
        CONFIG.ENDPOINT + CONFIG.HISTORY_DAY_PATH + "?date=" + encodeURIComponent(date),
        { headers: { Authorization: "Bearer " + authToken } }
      );
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      const entries = data.entries || [];

      if (entries.length === 0) {
        addEntry("system", "", "No conversations logged that day.");
        historyStatus.textContent = "";
        return;
      }

      entries.forEach((e) => {
        renderHistoryEntry(e);
      });
      historyStatus.textContent = `${entries.length} exchange${entries.length === 1 ? "" : "s"}`;
    } catch (e) {
      addEntry("system", "", "Couldn't load that day's conversation.");
      historyStatus.textContent = "";
    }
  });

  function renderHistoryEntry(e) {
    // Same visual shape as live chat: user bubble, then Perla's reply.
    // Tier 0 (direct system dispatch, no LLM) gets a subtler treatment
    // since it's a command echo rather than a conversational reply.
    const isTier0 = e.tier === 0;

    if (e.input) {
      addHistoryEntry("user", "You", e.input, e.time);
    }
    if (e.response) {
      const kind = isTier0 ? "perla entry-tier0" : "perla";
      addHistoryEntry(kind, "Perla", e.response, e.time);
    }
  }

  function addHistoryEntry(kind, label, text, timeStr) {
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind.split(" ")[0];
    if (kind.includes("entry-tier0")) entry.classList.add("entry-tier0");
    entry.innerHTML =
      (label ? `<div class="entry-label">${label}</div>` : "") +
      `<p></p>` +
      `<div class="entry-time">${timeStr || ""}</div>`;
    entry.querySelector("p").textContent = text;
    output.appendChild(entry);
    return entry;
  }

  // ---------- Reminders (view-only, status-grouped) ----------
  const remindersBtn = document.getElementById("remindersBtn");
  const remindersBar = document.getElementById("remindersBar");
  const remindersStatus = document.getElementById("remindersStatus");

  function closeRemindersPanel() {
    if (activeOverlay !== "reminders") return;
    activeOverlay = null;
    remindersBtn.classList.remove("active");
    remindersBar.hidden = true;
    composer.hidden = false;
    remindersStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openRemindersPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeHistoryPanel();

    activeOverlay = "reminders";
    remindersBtn.classList.add("active");
    remindersBar.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    remindersStatus.textContent = "Loading…";

    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.REMINDERS_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      renderReminders(data);
      remindersStatus.textContent = "";
    } catch (e) {
      output.innerHTML = "";
      addEntry("system", "", "Couldn't load reminders.");
      remindersStatus.textContent = "";
    }
  }

  remindersBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "reminders") {
      closeRemindersPanel();
    } else {
      openRemindersPanel();
    }
  });

  function formatReminderTime(iso) {
    // iso like 2026-08-26T18:00 -> "Tue, Aug 26 · 6:00 PM"; if it's today,
    // just the time.
    if (!iso) return "";
    const dt = new Date(iso);
    if (isNaN(dt.getTime())) return iso;
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const timeStr = dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    if (isToday) return `Today · ${timeStr}`;
    const dateStr = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `${dateStr} · ${timeStr}`;
  }

  function renderReminders(data) {
    output.innerHTML = "";

    const pending = data.pending || [];
    const missed = data.missed || [];
    const delivered = data.delivered || [];

    if (pending.length === 0 && missed.length === 0 && delivered.length === 0) {
      const wrap = document.createElement("div");
      wrap.className = "reminder-empty";
      wrap.textContent = "No reminders set.";
      output.appendChild(wrap);
      return;
    }

    if (missed.length > 0) {
      output.appendChild(buildReminderSection(
        "missed", `Missed (${missed.length})`, missed,
        (r) => `Was due ${formatReminderTime(r.due)} — caught at ${formatReminderTime(r.delivered)}`
      ));
    }

    // Upcoming always shows, even when empty, so it's clear there's
    // nothing pending rather than looking like the section didn't load.
    const upcomingSection = buildReminderSection(
      "pending", `Upcoming (${pending.length})`, pending,
      (r) => r.overdue ? `Due ${formatReminderTime(r.due)} — waiting to fire` : `Due ${formatReminderTime(r.due)}`,
      "Nothing on the books."
    );
    output.appendChild(upcomingSection);

    if (delivered.length > 0) {
      const details = document.createElement("details");
      details.className = "reminder-collapsible reminder-section";
      const summary = document.createElement("summary");
      summary.innerHTML = `<div class="reminder-section-title">Delivered (${delivered.length})<span class="disclosure-arrow">›</span></div>`;
      details.appendChild(summary);
      const list = buildReminderList(delivered, "delivered",
        (r) => `Delivered ${formatReminderTime(r.delivered)}`
      );
      details.appendChild(list);
      output.appendChild(details);
    }
  }

  function buildReminderSection(statusClass, title, items, metaFn, emptyText) {
    const section = document.createElement("div");
    section.className = "reminder-section";
    const heading = document.createElement("div");
    heading.className = "reminder-section-title " + statusClass;
    heading.textContent = title;
    section.appendChild(heading);

    if (items.length === 0 && emptyText) {
      const empty = document.createElement("div");
      empty.className = "reminder-empty";
      empty.textContent = emptyText;
      section.appendChild(empty);
      return section;
    }

    section.appendChild(buildReminderList(items, statusClass, metaFn));
    return section;
  }

  function buildReminderList(items, statusClass, metaFn) {
    const list = document.createElement("div");
    const glyphSVGs = {
      pending: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
      missed: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      delivered: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><polyline points="20 6 9 17 4 12"/></svg>',
    };

    items.forEach((r) => {
      const row = document.createElement("div");
      row.className = "reminder-row";

      const glyphClass = statusClass === "pending" && r.overdue ? "overdue" : statusClass;
      const glyph = document.createElement("div");
      glyph.className = "reminder-glyph " + glyphClass;
      glyph.innerHTML = glyphSVGs[statusClass] || "";

      const body = document.createElement("div");
      body.className = "reminder-body";
      const text = document.createElement("div");
      text.className = "reminder-text";
      text.textContent = r.text;
      const meta = document.createElement("div");
      meta.className = "reminder-meta";
      meta.textContent = metaFn(r);
      body.appendChild(text);
      body.appendChild(meta);

      row.appendChild(glyph);
      row.appendChild(body);
      list.appendChild(row);
    });

    return list;
  }

  // ---------- Mobile keyboard slide-up ----------
  // When the on-screen keyboard opens on a phone, slide the message list and
  // composer up by the keyboard's height with a smooth transition, instead of
  // letting the browser pan/scroll the page behind the keyboard. Only the
  // .content-wrap moves — the header stays pinned at the top. visualViewport
  // shrinks when the keyboard shows; the delta becomes the translate offset.
  (function keyboardSlide() {
    const wrap = document.querySelector(".content-wrap");
    if (!window.visualViewport || !wrap) return;
    const applyKeyboardOffset = () => {
      const vv = window.visualViewport;
      // Ignore pinch-zoom: only a shrunk viewport at scale 1 means the
      // on-screen keyboard is up.
      if (vv.scale > 1.01) {
        wrap.style.transform = "";
        return;
      }
      // Bottom of the visible viewport in layout px; anything below it is
      // covered by the keyboard, the composer must clear it.
      const visualBottom = vv.height + vv.offsetTop;
      const covered = Math.max(0, (window.innerHeight || vv.height) - visualBottom);
      wrap.style.transform = covered > 40 ? `translateY(${-covered}px)` : "";
    };
    window.visualViewport.addEventListener("resize", applyKeyboardOffset);
    window.visualViewport.addEventListener("scroll", applyKeyboardOffset);
  })();

  // ---------- Deferred init ----------
  // Runs after every const/function above is declared. Handles the
  // "already had a session token" auto-unlock path from earlier in this
  // script, restoring saved tier/chat state for that case.
  updateComposerState();
  if (authToken) {
    initAppState(false);
    // Resume the Full Mode countdown across a reload, if it's still running.
    const existingUntil = parseInt(sessionStorage.getItem("perla_elevate_until") || "0", 10);
    if (isElevated && existingUntil > Date.now()) {
      startTierTimer(existingUntil);
    } else if (isElevated && existingUntil <= Date.now()) {
      sessionStorage.removeItem("perla_elevate_until");
      setElevated(false);
    }
  }
</script>
