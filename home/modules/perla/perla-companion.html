<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17131a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Perla" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/api/avatar" />
<title>Perla</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
<style>
  :root{
    --bg: #17131a;
    --bg-panel: #201a23;
    --bg-panel-2: #29212c;
    --rule: #453a49;
    --rule-faint: #322a36;
    --ink: #e9dfc7;
    --ink-dim: #a3906c;
    --ink-faint: #6e5f45;
    --brass: #c97b8d;
    --brass-bright: #e4a2b2;
    --brass-dim: #8c4f5c;
    --wax: #8a3226;
    --wax-bright: #b8452f;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    /* overflow hidden here (not just on .app) is what stops the desktop
       card's extra 28px top/bottom padding from creating a page-level
       scrollbar — .app itself scrolls internally via .page, the shell
       never needs to. */
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,123,141,0.07), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; }
  input { font-family: inherit; }

  /* ---------- Password Gate ---------- */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    background: var(--bg);
  }

  .gate-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 40px 32px 32px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .gate-mark {
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
    overflow: hidden;
  }
  .gate-mark img,
  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .gate-card h1 {
    margin: 0 0 32px;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .gate-card input[type="password"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-size: 16px;
    text-align: center;
    padding: 10px 4px;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .gate-card input[type="password"]:focus {
    border-bottom-color: var(--brass);
  }

  .gate-card button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.14), rgba(201,123,141,0.04));
    color: var(--brass-bright);
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .gate-card button:hover { background: rgba(201,123,141,0.2); }
  .gate-card button:active { transform: scale(0.98); }

  .gate-error {
    margin: 14px 0 0;
    color: var(--wax-bright);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ---------- App shell ---------- */
  .app {
    height: 100dvh;
    /* JS overrides height (and top) to track the live visualViewport
       while the on-screen keyboard is open, so the whole shell (header
       included) shrinks to the visible area instead of the header
       getting pushed off-screen or the composer floating above the
       keyboard. position:fixed is what makes the JS-set `top` do
       anything — see the @media(max-width) override below. */
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    /* No side borders — the chat blends straight into the page
       background instead of sitting in a bounded card. */
  }

  /* Below this, the app is full-bleed and fixed to track the visual
     viewport (keyboard handling). Kept distinct from the 641px desktop
     breakpoint below so there's no width where both could apply. */
  @media (max-width: 640px) {
    .app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: none;
    }
  }

  .content-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    z-index: 20;
    /* Blends into the page background instead of sitting in its own
       panel — no border-bottom, no distinct background fill. */
    background: transparent;
    /* Full-bleed: .app (the chat column) is capped at max-width and
       centered within a flex-centered body, so a margin-based breakout
       (calc(50% - 50vw)) resolves against .app's width, not the real
       viewport — it doesn't actually reach the browser edges. Using
       position:fixed anchored to the true viewport corners is what
       makes this a real top bar spanning the whole window, independent
       of how .app itself is sized/centered. Unlike the chat body, the
       header's own buttons intentionally use the full window width
       (hamburger/logo at the true left edge, status at the true right
       edge) rather than being re-capped to the chat column's width. */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    box-sizing: border-box;
  }

  /* The header is fixed now, so it no longer takes up space in normal
     flow — reserve that height at the top of .app so the app-menu,
     dropdown panels, and content-wrap (all its siblings) sit below the
     header instead of underneath it. */
  .app {
    padding-top: 58px;
  }

  .app-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--brass-bright);
    overflow: hidden;
  }

  .brand-name {
    font-size: 19px;
    letter-spacing: 0.03em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    margin-left: 6px;
    flex-shrink: 0;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .status-dot.ok { background: #7fae6a; box-shadow: 0 0 8px rgba(127,174,106,0.6); }
  .status-dot.err { background: var(--wax-bright); box-shadow: 0 0 8px rgba(184,69,47,0.6); }

  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
  }

  .output {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .entry {
    max-width: 92%;
    display: flex;
    flex-direction: column;
  }
  .entry-user { align-self: flex-end; }
  .entry-perla { align-self: flex-start; }
  .entry-system { align-self: center; max-width: 100%; }

  .entry-bubble {
    padding: 10px 14px;
  }

  .entry-user .entry-bubble {
    text-align: left;
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.07));
    border: 1px solid rgba(201,123,141,0.28);
    border-radius: 16px 16px 4px 16px;
  }
  .entry-perla .entry-bubble {
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
  }
  .entry-system .entry-bubble {
    text-align: center;
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--rule-faint);
    border-radius: 20px;
    padding: 6px 14px;
  }

  .entry p {
    margin: 0;
    font-size: 17px;
    line-height: 1.55;
  }

  .entry-user p { color: var(--ink); }
  .entry-perla p { color: var(--ink); }
  .entry-system p {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
  }

  /* Markdown container — used for Perla's bubbles (live chat + history
     replay). Everything is HTML-escaped before this renders, so these
     rules only ever see tags the renderer itself emits. */
  .entry .md {
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
  }
  .entry .md p { margin: 0 0 10px; font-size: inherit; line-height: inherit; }
  .entry .md p:last-child { margin-bottom: 0; }
  .entry .md h1, .entry .md h2, .entry .md h3, .entry .md h4 {
    margin: 12px 0 6px;
    line-height: 1.3;
    font-weight: 600;
  }
  .entry .md h1 { font-size: 1.3em; }
  .entry .md h2 { font-size: 1.2em; }
  .entry .md h3, .entry .md h4 { font-size: 1.1em; }
  .entry .md pre {
    margin: 8px 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--rule-faint);
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre;
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .entry .md code {
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--rule-faint);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .entry .md pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
  }
  .entry .md ul, .entry .md ol { margin: 6px 0; padding-left: 22px; }
  .entry .md li { margin: 2px 0; }
  .entry .md a {
    color: var(--brass-bright);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .entry .md blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--brass-dim);
    color: var(--ink-dim);
  }
  .entry .md hr {
    border: none;
    border-top: 1px solid var(--rule-faint);
    margin: 10px 0;
  }

  /* Meta row (timestamp + optional play button) sits below the bubble
     and stays hidden until the message is hovered, focused (keyboard
     nav), or tapped — tap support is via the .meta-visible class, which
     JS toggles on mobile where :hover doesn't apply. */
  .entry-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 0 4px;
    height: 18px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }
  .entry-user .entry-meta { align-self: flex-end; }
  .entry-perla .entry-meta { align-self: flex-start; }

  .entry:hover .entry-meta,
  .entry:focus-within .entry-meta,
  .entry.meta-visible .entry-meta {
    opacity: 1;
    visibility: visible;
  }

  .entry-time {
    font-size: 11px;
    color: var(--ink-faint);
  }

  .entry-image-wrap {
    margin-top: 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--bg);
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-image {
    display: block;
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    cursor: zoom-in;
    background: var(--bg);
    border-radius: 10px;
  }

  .entry-image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .entry-image-grid .entry-image {
    width: 100%;
    height: 140px;
    max-height: none;
    object-fit: cover;
  }
  .entry-image-grid:has(.entry-image:only-child) {
    grid-template-columns: 1fr;
  }
  .entry-image-grid:has(.entry-image:only-child) .entry-image {
    height: auto;
    max-height: 360px;
    object-fit: contain;
  }

  .entry-image-loading,
  .entry-image-error {
    display: block;
    padding: 20px 14px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
    text-align: center;
  }
  .entry-image-error { color: var(--wax-bright); }

  .replay-btn,
  .copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--ink-dim);
    padding: 0;
    cursor: pointer;
  }
  .replay-btn:hover,
  .copy-btn:hover { color: var(--brass-bright); }
  .copy-btn.copied { color: #7fae6a; }

  /* ---------- Composer ---------- */
  .composer {
    padding: 10px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    /* Lifted off the bottom edge instead of resting flush against it,
       and inset from the sides so it reads as a floating docked bar. */
    margin: 0 14px calc(14px + var(--safe-bottom));
  }
  .composer[hidden] { display: none; }

  /* Replaces .composer in the exact same footer slot whenever Tier 2's
     chat is on screen but not yet elevated — same floating-bar shell so
     the transition to/from the real composer doesn't jump the layout. */
  .elevate-composer {
    padding: 12px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--wax);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 0 14px calc(14px + var(--safe-bottom));
  }
  /* Without this, the [hidden] attribute set from JS is silently beaten
     by the `display: flex` rule above (same specificity, and this class
     rule wins), so the bar stayed visible on every tier — this is the fix. */
  .elevate-composer[hidden] { display: none; }
  .elevate-composer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .elevate-composer-icon {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--wax-bright);
    background: rgba(184,69,47,0.14);
  }
  .elevate-composer input[type="password"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    padding: 8px 2px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .elevate-composer input[type="password"]::placeholder { color: var(--ink-faint); }
  .elevate-composer input[type="password"]:focus { border-bottom-color: var(--wax); }

  .attach-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 20px;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attach-btn:hover { color: var(--brass-bright); background: rgba(201,123,141,0.08); }
  .attach-btn.active {
    color: var(--brass-bright);
    background: rgba(201,123,141,0.14);
  }

  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 2px 4px;
  }
  .attach-thumb {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border: 1px solid var(--brass-dim);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(201,123,141,0.06);
  }
  .attach-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .attach-thumb-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    line-height: 1;
    border-radius: 50%;
    border: 1px solid var(--wax);
    background: rgba(23,19,26,0.85);
    color: var(--wax-bright);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .composer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .composer-row-spacer {
    flex: 1;
  }

  #textInput {
    width: 100%;
    resize: none;
    max-height: 120px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 17px;
    padding: 6px 4px 10px;
    line-height: 1.4;
    outline: none;
  }
  #textInput::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.05));
    color: var(--brass-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .send-btn svg { display: block; width: 19px; height: 19px; }
  .send-btn:hover { background: rgba(201,123,141,0.22); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled {
    opacity: 0.32;
    cursor: default;
    transform: none;
    background: linear-gradient(180deg, rgba(201,123,141,0.08), rgba(201,123,141,0.02));
  }

  .mic-btn {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .mic-btn:hover { color: var(--brass-bright); background: rgba(201,123,141,0.08); }
  .mic-btn.typing-hidden { display: none; }

  .mic-icon {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .mic-stop-square {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: var(--wax-bright);
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .mic-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--wax-bright);
    opacity: 0;
  }

  .mic-btn.recording {
    color: var(--wax-bright);
  }
  .mic-btn.recording .mic-icon {
    opacity: 0;
    transform: scale(0.5);
  }
  .mic-btn.recording .mic-stop-square {
    opacity: 1;
    transform: scale(1);
  }

  .mic-btn.recording .ring-1 { animation: pulse-ring 1.8s ease-out infinite; }
  .mic-btn.recording .ring-2 { animation: pulse-ring 1.8s ease-out infinite 0.6s; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .mic-timer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .mic-timer:empty { display: none; }

  /* ---------- Thinking indicator ---------- */
  .thinking {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
  }
  .think-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brass-bright);
    animation: think-bounce 1.1s ease-in-out infinite;
  }
  .think-dot:nth-child(2) { animation-delay: 0.15s; }
  .think-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes think-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ---------- Welcome empty state ---------- */
  .welcome {
    margin: 14vh auto 0;
    text-align: center;
    color: var(--ink-dim);
    max-width: 320px;
  }
  .welcome-mark {
    width: 62px;
    height: 62px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
    overflow: hidden;
  }
  .welcome-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .welcome h2 {
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink);
  }
  .welcome p {
    margin: 0;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-faint);
  }

  /* ---------- Image lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(12,10,14,0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    animation: fade-in 0.18s ease;
  }
  .lightbox[hidden] { display: none; }

  /* Positioned wrap/inner pair, same pattern as the image editor's
     editorCanvasWrap/editorCanvasInner: --fit-w/--fit-h set the base
     "fits the screen" size in JS once the image loads, and zoom/pan on
     top of that apply as a CSS transform on the inner element — which
     keeps getBoundingClientRect() correct for any pointer math at any
     zoom level without the editor's code needing to know about zoom. */
  .lightbox-canvas-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  .lightbox-canvas-inner {
    position: relative;
    line-height: 0;
    width: var(--fit-w, auto);
    height: var(--fit-h, auto);
    transform: translate(var(--lightbox-pan-x, 0px), var(--lightbox-pan-y, 0px)) scale(var(--lightbox-zoom, 1));
    transform-origin: center center;
  }
  .lightbox img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 10px;
    border: 1px solid var(--rule);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    cursor: grab;
  }
  .lightbox img:active { cursor: grabbing; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Image editor (crop + pen) ---------- */
  .img-editor {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: rgba(12,10,14,0.92);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    flex-direction: column;
    animation: fade-in 0.18s ease;
  }
  .img-editor[hidden] { display: none; }

  /* Canvas fills the whole editor — every control floats above it. */
  .img-editor-canvas-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    position: relative;
    touch-action: none;
    overflow: hidden;
  }

  .img-editor-canvas-inner {
    position: relative;
    line-height: 0;
    /* Base fit-to-screen size is set inline via JS (--fit-w/--fit-h) once
       the image loads; zoom then scales on top of that via --editor-zoom,
       and pan offsets via --editor-pan-x/--editor-pan-y. Transform-based
       zoom (rather than resizing the canvas element) keeps
       getBoundingClientRect() — and therefore all pointer-to-canvas
       coordinate mapping — correct at any zoom level for free. */
    width: var(--fit-w, auto);
    height: var(--fit-h, auto);
    max-width: none;
    max-height: none;
    transform: translate(var(--editor-pan-x, 0px), var(--editor-pan-y, 0px)) scale(var(--editor-zoom, 1));
    transform-origin: center center;
  }

  #editorCanvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    touch-action: none;
    cursor: crosshair;
  }

  .crop-box {
    position: absolute;
    border: 1.5px dashed var(--brass-bright);
    background: rgba(201,123,141,0.08);
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events: none;
  }
  .crop-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--brass-bright);
    border: 1.5px solid var(--bg);
    pointer-events: auto;
  }
  .crop-handle.nw { top: -7px; left: -7px; cursor: nwse-resize; }
  .crop-handle.ne { top: -7px; right: -7px; cursor: nesw-resize; }
  .crop-handle.sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
  .crop-handle.se { bottom: -7px; right: -7px; cursor: nwse-resize; }

  /* Shared floating-pill shell used by every editor control cluster. */
  .editor-float {
    position: absolute;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px;
    border-radius: 22px;
    background: rgba(23,19,26,0.82);
    border: 1px solid var(--rule);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .editor-float[hidden] { display: none; }

  /* Top-center: Crop / Pen mode switch — the only always-visible control. */
  .editor-mode-switch {
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Top-right: close button, on its own so it never competes with modes. */
  .editor-close-float {
    top: 12px;
    right: 12px;
    padding: 0;
  }

  /* Top-left: undo/reset, small and out of the way. */
  .editor-history-float {
    top: 12px;
    left: 12px;
  }

  /* Bottom-center: whatever the active mode needs (pen options, or apply-crop). */
  .editor-context-float {
    bottom: calc(12px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100vw - 24px);
  }

  /* Bottom-right: Save. Kept apart from context controls so it's always reachable. */
  .editor-save-float {
    bottom: calc(12px + var(--safe-bottom));
    right: 12px;
  }

  /* Bottom-left: zoom controls */
  .editor-zoom-float {
    bottom: calc(12px + var(--safe-bottom));
    left: 12px;
  }
  .editor-zoom-label {
    font-size: 11px;
    color: var(--ink-faint);
    width: 34px;
    text-align: center;
    flex-shrink: 0;
    user-select: none;
  }

  .editor-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .editor-icon-btn:hover { color: var(--ink); background: rgba(255,255,255,0.06); }
  .editor-icon-btn.active {
    color: var(--brass-bright);
    background: rgba(201,123,141,0.18);
  }
  .editor-icon-btn svg { flex-shrink: 0; }

  .editor-pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 14px;
    border-radius: 18px;
    border: none;
    background: transparent;
    color: var(--brass-bright);
    font-family: var(--font-serif);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
  }
  .editor-pill-btn:hover { background: rgba(201,123,141,0.14); }
  .editor-pill-btn.primary {
    background: linear-gradient(180deg, rgba(201,123,141,0.28), rgba(201,123,141,0.12));
  }
  .editor-pill-btn.primary:hover { background: rgba(201,123,141,0.34); }

  .editor-divider {
    width: 1px;
    height: 20px;
    background: var(--rule);
    flex-shrink: 0;
    margin: 0 1px;
  }

  .img-editor-colors {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .color-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .color-swatch.active {
    border-color: var(--ink);
    box-shadow: 0 0 0 2px rgba(23,19,26,0.8);
  }

  .img-editor-size {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 90px;
  }
  .img-editor-size input[type="range"] {
    width: 70px;
    accent-color: var(--brass-bright);
  }
  .img-editor-size-label {
    font-size: 10px;
    color: var(--ink-faint);
    width: 26px;
    flex-shrink: 0;
    text-align: right;
  }

  .attach-thumb-edit {
    position: absolute;
    bottom: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    background: rgba(23,19,26,0.85);
    color: var(--brass-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .attach-thumb-edit:hover { background: rgba(201,123,141,0.2); }

  @media (prefers-reduced-motion: reduce) {
    .mic-btn.recording .ring-1,
    .mic-btn.recording .ring-2 { animation: none; }
    .think-dot { animation: none; }
    .lightbox { animation: none; }
    .shake { animation: none; }
  }

  @media (min-width: 641px) {
    body {
      padding: 28px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app {
      height: calc(100dvh - 56px);
      /* No card chrome (border/shadow/radius) — the chat blends into
         the page background instead of floating in a bounded card. */
    }
  }

  .tier-badge {
    background: linear-gradient(180deg, var(--wax-bright), var(--wax));
    color: var(--bg);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 20px;
    margin-right: 6px;
    box-shadow: 0 0 10px rgba(184,69,47,0.45);
  }

  .tier-timer {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--brass-bright);
    border: 1px solid var(--brass-dim);
    background: rgba(201,123,141,0.08);
    padding: 2px 8px;
    border-radius: 20px;
    margin-right: 6px;
    font-variant-numeric: tabular-nums;
  }
  .tier-timer[hidden] { display: none; }

  .elevate-submit {
    background: linear-gradient(180deg, rgba(184,69,47,0.22), rgba(184,69,47,0.08));
    color: var(--wax-bright);
    border: 1px solid var(--wax);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
    flex-shrink: 0;
  }
  .elevate-submit:hover { background: rgba(184,69,47,0.32); }
  .elevate-submit:active { transform: scale(0.96); }
  .panel-status {
    display: block;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--ink-dim);
    font-style: italic;
  }
  .panel-status:empty { display: none; }

  /* ---------- Header icon buttons (shared: history, elevate) ---------- */
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s ease, background 0.2s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--brass-bright); background: rgba(201,123,141,0.08); }
  .icon-btn.active {
    color: var(--brass-bright);
    background: rgba(201,123,141,0.14);
  }

  /* ---------- Hamburger menu button ---------- */
  .menu-btn { position: relative; }

  .hamburger-lines {
    width: 15px;
    height: 11px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .hamburger-lines span {
    display: block;
    width: 100%;
    height: 1.5px;
    background: currentColor;
    border-radius: 1px;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .menu-btn.active .hamburger-lines span:nth-child(1) {
    transform: translateY(4.5px) rotate(45deg);
  }
  .menu-btn.active .hamburger-lines span:nth-child(2) { opacity: 0; }
  .menu-btn.active .hamburger-lines span:nth-child(3) {
    transform: translateY(-4.5px) rotate(-45deg);
  }

  /* ---------- App menu (hamburger dropdown) ---------- */
  .floating-menu {
    display: flex;
    flex-direction: column;
    padding: 8px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    position: fixed;
    width: 200px;
    max-width: calc(100vw - 40px);
    z-index: 25;
    transition: opacity 0.16s ease, transform 0.16s ease;
    opacity: 0;
    pointer-events: none;
  }
  .floating-menu.open {
    opacity: 1;
    pointer-events: auto;
  }

  .app-menu {
    /* Floats over the content near the hamburger button instead of
       pushing the page down — anchored to the header's fixed left
       padding (20px) since the button always sits there. */
    top: 58px;
    left: 20px;
    width: 240px;
    transform-origin: top left;
    transform: scale(0.94) translateY(-6px);
  }
  .app-menu.open {
    transform: scale(1) translateY(0);
  }

  .attach-menu {
    /* Anchored above the composer's attach button (opens upward instead
       of down since the button sits near the bottom of the screen).
       left/top are set dynamically in JS from the button's actual
       position, since the composer is a centered, max-width column —
       not flush against the viewport edge like the header — so a fixed
       left offset would only be correct at one particular screen width. */
    transform-origin: bottom left;
    transform: scale(0.94) translateY(6px);
  }
  .attach-menu.open {
    transform: scale(1) translateY(0);
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: transparent;
    border: none;
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 15px;
    text-align: left;
    padding: 12px 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .menu-item:hover { background: rgba(201,123,141,0.08); }
  .menu-item.active {
    background: rgba(201,123,141,0.14);
    color: var(--brass-bright);
  }
  .menu-item-icon {
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    font-size: 15px;
  }
  .menu-item-label { flex: 1; }
  .menu-item-badge {
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
  }
  .menu-item-badge.locked { color: var(--wax-bright); }
  .menu-item-badge.unread {
    color: var(--brass-bright);
    font-weight: 600;
  }

  .menu-divider {
    height: 1px;
    background: var(--rule);
    margin: 6px 4px;
  }

  /* ---------- Dropdown panels (history day picker, elevate token) ---------- */
  .dropdown-panel {
    padding: 12px 20px 16px;
    background: transparent;
    animation: panel-drop 0.18s ease;
  }

  @keyframes panel-drop {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .dropdown-panel:has(> .panel-status:empty:only-child) {
    padding: 0;
  }

  .dropdown-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dropdown-row input,
  .dropdown-row select {
    flex: 1;
    min-width: 0;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    border-radius: 10px;
    color: var(--ink);
    padding: 10px 12px;
    font-size: 0.9rem;
    font-family: var(--font-serif);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .dropdown-row input::placeholder { color: var(--ink-faint); }
  .dropdown-row input:focus,
  .dropdown-row select:focus { border-color: var(--brass-dim); }

  .entry-tier0 p { color: var(--ink-dim); font-style: italic; }

  /* ---------- Reminders ---------- */
  .reminder-section-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .reminder-section-title.missed { color: var(--wax-bright); }
  .reminder-section-title.pending { color: var(--brass-bright); }

  .reminder-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule-faint);
  }
  .reminder-row:last-child { border-bottom: none; }

  .reminder-glyph {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    margin-top: 1px;
  }
  .reminder-glyph.pending { color: var(--brass-bright); }
  .reminder-glyph.overdue { color: var(--wax-bright); }
  .reminder-glyph.missed { color: var(--wax-bright); }
  .reminder-glyph.delivered { color: #7fae6a; }

  .reminder-body { flex: 1; min-width: 0; }
  .reminder-text {
    font-size: 15px;
    line-height: 1.4;
    color: var(--ink);
  }
  .reminder-meta {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 3px;
  }

  .reminder-cadence {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--brass-dim);
  }
  .reminder-cadence svg { flex-shrink: 0; }

  .reminder-empty {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
    padding: 4px 0 18px;
  }

  .reminder-collapsible summary {
    cursor: pointer;
    list-style: none;
  }
  .reminder-collapsible summary::-webkit-details-marker { display: none; }
  .reminder-collapsible summary .reminder-section-title { margin-bottom: 10px; }
  .reminder-collapsible summary .disclosure-arrow {
    display: inline-block;
    transition: transform 0.15s ease;
    margin-left: auto;
    color: var(--ink-faint);
  }
  .reminder-collapsible[open] summary .disclosure-arrow { transform: rotate(90deg); }

  .reminder-section {
    margin-bottom: 22px;
  }
  .reminder-section:last-child { margin-bottom: 0; }

  /* ---------- Quick Actions ---------- */
  #quickActionsPanel {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 10px 18px calc(48px + var(--safe-bottom));
  }

  #quickActionsPanel::-webkit-scrollbar {
    width: 5px;
  }
  #quickActionsPanel::-webkit-scrollbar-track {
    background: transparent;
  }
  #quickActionsPanel::-webkit-scrollbar-thumb {
    background: var(--rule);
    border-radius: 4px;
  }
  #quickActionsPanel::-webkit-scrollbar-thumb:hover {
    background: var(--brass-dim);
  }

  .qa-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .qa-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .qa-section-title {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--rule-faint);
  }
  .qa-section-title svg {
    color: var(--brass-dim);
    flex-shrink: 0;
  }

  .qa-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
    gap: 10px;
  }

  .qa-btn {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 6px;
    min-height: 88px;
    border-radius: 14px;
    border: 1px solid var(--rule);
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
                background 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  }

  .qa-btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: radial-gradient(circle at 50% 0%, rgba(201,123,141,0.18), transparent 70%);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }

  .qa-btn:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: var(--brass);
    background: linear-gradient(180deg, rgba(201,123,141,0.12) 0%, var(--bg-panel-2) 100%);
    box-shadow: 0 6px 18px rgba(201,123,141,0.22), 0 2px 6px rgba(0, 0, 0, 0.4);
  }
  .qa-btn:hover::before {
    opacity: 1;
  }

  .qa-btn:active {
    transform: translateY(1px) scale(0.96);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    border-color: var(--brass-bright);
    transition-duration: 0.06s;
  }

  .qa-btn:disabled {
    opacity: 0.4;
    cursor: default;
    transform: none !important;
    box-shadow: none !important;
  }

  /* Button dynamic states */
  .qa-btn.is-loading {
    border-color: var(--brass-bright) !important;
    box-shadow: 0 0 0 2px rgba(201,123,141,0.4) !important;
    pointer-events: none;
  }
  .qa-btn.is-loading .qa-icon {
    animation: qa-spin 0.8s linear infinite;
  }
  .qa-btn.is-success {
    border-color: #7fae6a !important;
    box-shadow: 0 0 0 2px rgba(127,174,106,0.45) !important;
  }
  .qa-btn.is-error {
    border-color: var(--wax-bright) !important;
    box-shadow: 0 0 0 2px rgba(184,69,47,0.45) !important;
  }

  @keyframes qa-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .qa-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(201, 123, 141, 0.08);
    color: var(--brass-bright);
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
  }

  .qa-btn:hover .qa-icon {
    transform: scale(1.12);
    background: rgba(201, 123, 141, 0.16);
    color: #ffd6e0;
  }

  .qa-btn:active .qa-icon {
    transform: scale(0.94);
  }

  .qa-label {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.25;
    font-weight: 500;
    max-width: 100%;
    padding: 0 2px;
  }

  /* Danger styling */
  .qa-btn-danger {
    border-color: rgba(184, 69, 47, 0.35);
  }
  .qa-btn-danger .qa-icon {
    color: var(--wax-bright);
    background: rgba(184, 69, 47, 0.1);
  }
  .qa-btn-danger::before {
    background: radial-gradient(circle at 50% 0%, rgba(184,69,47,0.25), transparent 70%);
  }
  .qa-btn-danger:hover {
    border-color: var(--wax-bright);
    background: linear-gradient(180deg, rgba(184,69,47,0.16) 0%, var(--bg-panel-2) 100%);
    box-shadow: 0 6px 18px rgba(184,69,47,0.28), 0 2px 6px rgba(0, 0, 0, 0.4);
  }
  .qa-btn-danger:hover .qa-icon {
    background: rgba(184, 69, 47, 0.22);
    color: #ff8b73;
  }

  /* Active input row toggle button */
  .qa-btn-input.active {
    background: linear-gradient(180deg, rgba(201,123,141,0.22) 0%, var(--bg-panel-2) 100%);
    border-color: var(--brass-bright);
    box-shadow: 0 0 0 2px rgba(201,123,141,0.3);
  }

  .qa-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    padding: 10px 12px;
    background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
    border: 1px solid var(--brass-dim);
    border-radius: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    animation: qa-feedback-in 0.18s ease;
  }
  .qa-input-row[hidden] { display: none; }
  .qa-input-row input {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 8px;
    color: var(--ink);
    padding: 9px 12px;
    font-size: 0.9rem;
    font-family: var(--font-serif);
    outline: none;
    transition: border-color 0.2s ease;
  }
  .qa-input-row input:focus { border-color: var(--brass); }
  .qa-input-go,
  .qa-input-cancel {
    flex-shrink: 0;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.18), rgba(201,123,141,0.06));
    color: var(--brass-bright);
    font-family: var(--font-serif);
    font-size: 0.85rem;
    padding: 8px 13px;
    cursor: pointer;
    font-weight: 500;
  }
  .qa-input-cancel {
    padding: 8px 11px;
    color: var(--ink-faint);
    border-color: var(--rule);
    background: transparent;
  }

  /* ---------- QA Output / Feedback Banner ---------- */
  .qa-feedback-container {
    position: absolute;
    top: 10px;
    left: 18px;
    right: 18px;
    z-index: 12;
    pointer-events: none;
  }
  .qa-feedback-container:empty { display: none; }
  .qa-feedback-container > * { pointer-events: auto; }

  .qa-feedback-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(32, 26, 35, 0.96), rgba(41, 33, 44, 0.96));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--rule);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 1px 3px rgba(0,0,0,0.3);
    animation: qa-feedback-in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .qa-feedback-card.closing {
    opacity: 0;
    transform: translateY(-6px) scale(0.98);
  }

  @keyframes qa-feedback-in {
    from { opacity: 0; transform: translateY(-8px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .qa-feedback-card.loading {
    border-color: var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.14), rgba(32, 26, 35, 0.97));
  }
  .qa-feedback-card.success {
    border-color: rgba(127, 174, 106, 0.5);
    background: linear-gradient(180deg, rgba(127, 174, 106, 0.14), rgba(32, 26, 35, 0.97));
  }
  .qa-feedback-card.error {
    border-color: rgba(184, 69, 47, 0.55);
    background: linear-gradient(180deg, rgba(184, 69, 47, 0.16), rgba(32, 26, 35, 0.97));
  }

  .qa-feedback-icon {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
  }
  .qa-feedback-card.loading .qa-feedback-icon {
    color: var(--brass-bright);
    background: rgba(201, 123, 141, 0.14);
    animation: qa-spin 1s linear infinite;
  }
  .qa-feedback-card.success .qa-feedback-icon {
    color: #7fae6a;
    background: rgba(127, 174, 106, 0.18);
  }
  .qa-feedback-card.error .qa-feedback-icon {
    color: var(--wax-bright);
    background: rgba(184, 69, 47, 0.18);
  }

  .qa-feedback-content {
    flex: 1;
    min-width: 0;
  }
  .qa-feedback-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
  }
  .qa-feedback-meta {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .qa-feedback-close {
    flex-shrink: 0;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    font-size: 14px;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .qa-feedback-close:hover {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
  }

  /* Screenshot Card */
  .qa-result {
    margin-bottom: 14px;
  }
  .qa-result:empty { display: none; }

  .qa-screenshot-card {
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--bg-panel);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    animation: qa-feedback-in 0.22s ease;
  }
  .qa-screenshot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg-panel-2);
    border-bottom: 1px solid var(--rule-faint);
    font-size: 11.5px;
    color: var(--ink-dim);
  }
  .qa-screenshot-body {
    position: relative;
    cursor: pointer;
    background: #000;
    max-height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qa-screenshot-body img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    display: block;
  }
  .qa-screenshot-hint {
    position: absolute;
    bottom: 8px;
    right: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,0.7);
    color: var(--ink);
    font-size: 10.5px;
    backdrop-filter: blur(4px);
  }

  /* Mobile responsiveness */
  @media (max-width: 520px) {
    #quickActionsPanel {
      padding: 8px 12px calc(42px + var(--safe-bottom));
    }
    .qa-container {
      gap: 14px;
    }
    .qa-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .qa-btn {
      min-height: 78px;
      padding: 10px 4px 8px;
      border-radius: 12px;
      gap: 6px;
    }
    .qa-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .qa-icon svg {
      width: 17px;
      height: 17px;
    }
    .qa-label {
      font-size: 10.5px;
    }
  }

  @media (max-width: 340px) {
    .qa-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>
<body>

  <div id="gate" class="gate">

              <span class="qa-label">Mute Mic</span>

            <button class="qa-btn" data-qa="unmute_mic" title="Unmute Microphone">
              <span class="qa-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>

        <!-- Section: Shortcuts & Apps -->
        <div class="qa-section">
