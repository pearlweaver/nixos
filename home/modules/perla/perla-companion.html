<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#17131a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Perla" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/api/avatar" />
<title>Perla</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
<style>
  :root{
    --bg: #17131a;
    --bg-panel: #201a23;
    --bg-panel-2: #29212c;
    --rule: #453a49;
    --rule-faint: #322a36;
    --ink: #e9dfc7;
    --ink-dim: #a3906c;
    --ink-faint: #6e5f45;
    --brass: #c97b8d;
    --brass-bright: #e4a2b2;
    --brass-dim: #8c4f5c;
    --wax: #8a3226;
    --wax-bright: #b8452f;
    --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-serif);
    /* overflow hidden here (not just on .app) is what stops the desktop
       card's extra 28px top/bottom padding from creating a page-level
       scrollbar — .app itself scrolls internally via .page, the shell
       never needs to. */
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201,123,141,0.07), transparent 60%),
      var(--bg);
  }

  button { font-family: inherit; }
  input { font-family: inherit; }

  /* ---------- Password Gate ---------- */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
    background: var(--bg);
  }

  .gate-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    padding: 40px 32px 32px;
    border: 1px solid var(--rule);
    border-radius: 14px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }

  .gate-mark {
    width: 54px;
    height: 54px;
    margin: 0 auto 18px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--brass-bright);
    background: radial-gradient(circle at 35% 30%, rgba(201,123,141,0.18), transparent 70%);
    overflow: hidden;
  }
  .gate-mark img,
  .brand-mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .gate-card h1 {
    margin: 0 0 32px;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .gate-card input[type="password"] {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    color: var(--ink);
    font-size: 16px;
    text-align: center;
    padding: 10px 4px;
    letter-spacing: 0.15em;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .gate-card input[type="password"]:focus {
    border-bottom-color: var(--brass);
  }

  .gate-card button {
    margin-top: 22px;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.14), rgba(201,123,141,0.04));
    color: var(--brass-bright);
    font-size: 15px;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .gate-card button:hover { background: rgba(201,123,141,0.2); }
  .gate-card button:active { transform: scale(0.98); }

  .gate-error {
    margin: 14px 0 0;
    color: var(--wax-bright);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .shake { animation: shake 0.4s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  /* ---------- App shell ---------- */
  .app {
    height: 100dvh;
    /* JS overrides height (and top) to track the live visualViewport
       while the on-screen keyboard is open, so the whole shell (header
       included) shrinks to the visible area instead of the header
       getting pushed off-screen or the composer floating above the
       keyboard. position:fixed is what makes the JS-set `top` do
       anything — see the @media(max-width) override below. */
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    /* No side borders — the chat blends straight into the page
       background instead of sitting in a bounded card. */
  }

  /* Below this, the app is full-bleed and fixed to track the visual
     viewport (keyboard handling). Kept distinct from the 641px desktop
     breakpoint below so there's no width where both could apply. */
  @media (max-width: 640px) {
    .app {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-width: none;
    }
  }

  .content-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .app-header {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    z-index: 20;
    /* Blends into the page background instead of sitting in its own
       panel — no border-bottom, no distinct background fill. */
    background: transparent;
    /* Full-bleed: .app (the chat column) is capped at max-width and
       centered within a flex-centered body, so a margin-based breakout
       (calc(50% - 50vw)) resolves against .app's width, not the real
       viewport — it doesn't actually reach the browser edges. Using
       position:fixed anchored to the true viewport corners is what
       makes this a real top bar spanning the whole window, independent
       of how .app itself is sized/centered. Unlike the chat body, the
       header's own buttons intentionally use the full window width
       (hamburger/logo at the true left edge, status at the true right
       edge) rather than being re-capped to the chat column's width. */
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    box-sizing: border-box;
  }

  /* The header is fixed now, so it no longer takes up space in normal
     flow — reserve that height at the top of .app so the app-menu,
     dropdown panels, and content-wrap (all its siblings) sit below the
     header instead of underneath it. */
  .app {
    padding-top: 58px;
  }

  .app-header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand { display: flex; align-items: center; gap: 10px; }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--brass-bright);
    overflow: hidden;
  }

  .brand-name {
    font-size: 19px;
    letter-spacing: 0.03em;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ink-faint);
    margin-left: 6px;
    flex-shrink: 0;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .status-dot.ok { background: #7fae6a; box-shadow: 0 0 8px rgba(127,174,106,0.6); }
  .status-dot.err { background: var(--wax-bright); box-shadow: 0 0 8px rgba(184,69,47,0.6); }

  .page {
    flex: 1;
    overflow-y: auto;
    padding: 22px 20px;
  }

  .output {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .entry {
    max-width: 92%;
    display: flex;
    flex-direction: column;
  }
  .entry-user { align-self: flex-end; }
  .entry-perla { align-self: flex-start; }
  .entry-system { align-self: center; max-width: 100%; }

  .entry-bubble {
    padding: 10px 14px;
  }

  .entry-user .entry-bubble {
    text-align: left;
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.07));
    border: 1px solid rgba(201,123,141,0.28);
    border-radius: 16px 16px 4px 16px;
  }
  .entry-perla .entry-bubble {
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
  }
  .entry-system .entry-bubble {
    text-align: center;
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--rule-faint);
    border-radius: 20px;
    padding: 6px 14px;
  }

  .entry p {
    margin: 0;
    font-size: 17px;
    line-height: 1.55;
  }

  .entry-user p { color: var(--ink); }
  .entry-perla p { color: var(--ink); }
  .entry-system p {
    color: var(--ink-faint);
    font-style: italic;
    font-size: 14px;
  }

  /* Markdown container — used for Perla's bubbles (live chat + history
     replay). Everything is HTML-escaped before this renders, so these
     rules only ever see tags the renderer itself emits. */
  .entry .md {
    font-size: 17px;
    line-height: 1.55;
    color: var(--ink);
  }
  .entry .md p { margin: 0 0 10px; font-size: inherit; line-height: inherit; }
  .entry .md p:last-child { margin-bottom: 0; }
  .entry .md h1, .entry .md h2, .entry .md h3, .entry .md h4 {
    margin: 12px 0 6px;
    line-height: 1.3;
    font-weight: 600;
  }
  .entry .md h1 { font-size: 1.3em; }
  .entry .md h2 { font-size: 1.2em; }
  .entry .md h3, .entry .md h4 { font-size: 1.1em; }
  .entry .md pre {
    margin: 8px 0;
    padding: 10px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--rule-faint);
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre;
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.5;
  }
  .entry .md code {
    font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.9em;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--rule-faint);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .entry .md pre code {
    background: none;
    border: none;
    padding: 0;
    font-size: inherit;
  }
  .entry .md ul, .entry .md ol { margin: 6px 0; padding-left: 22px; }
  .entry .md li { margin: 2px 0; }
  .entry .md a {
    color: var(--brass-bright);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .entry .md blockquote {
    margin: 8px 0;
    padding: 2px 0 2px 12px;
    border-left: 3px solid var(--brass-dim);
    color: var(--ink-dim);
  }
  .entry .md hr {
    border: none;
    border-top: 1px solid var(--rule-faint);
    margin: 10px 0;
  }

  /* Meta row (timestamp + optional play button) sits below the bubble
     and stays hidden until the message is hovered, focused (keyboard
     nav), or tapped — tap support is via the .meta-visible class, which
     JS toggles on mobile where :hover doesn't apply. */
  .entry-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
    padding: 0 4px;
    height: 18px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }
  .entry-user .entry-meta { align-self: flex-end; }
  .entry-perla .entry-meta { align-self: flex-start; }

  .entry:hover .entry-meta,
  .entry:focus-within .entry-meta,
  .entry.meta-visible .entry-meta {
    opacity: 1;
    visibility: visible;
  }

  .entry-time {
    font-size: 11px;
    color: var(--ink-faint);
  }

  .entry-image-wrap {
    margin-top: 6px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--rule);
    background: var(--bg);
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .entry-image {
    display: block;
    width: 100%;
    max-height: 360px;
    object-fit: contain;
    cursor: zoom-in;
    background: var(--bg);
    border-radius: 10px;
  }

  .entry-image-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .entry-image-grid .entry-image {
    width: 100%;
    height: 140px;
    max-height: none;
    object-fit: cover;
  }
  .entry-image-grid:has(.entry-image:only-child) {
    grid-template-columns: 1fr;
  }
  .entry-image-grid:has(.entry-image:only-child) .entry-image {
    height: auto;
    max-height: 360px;
    object-fit: contain;
  }

  .entry-image-loading,
  .entry-image-error {
    display: block;
    padding: 20px 14px;
    font-size: 13px;
    color: var(--ink-faint);
    font-style: italic;
    text-align: center;
  }
  .entry-image-error { color: var(--wax-bright); }

  .replay-btn,
  .copy-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    background: transparent;
    border: none;
    border-radius: 50%;
    color: var(--ink-dim);
    padding: 0;
    cursor: pointer;
  }
  .replay-btn:hover,
  .copy-btn:hover { color: var(--brass-bright); }
  .copy-btn.copied { color: #7fae6a; }

  /* ---------- Composer ---------- */
  .composer {
    padding: 10px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--rule);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    /* Lifted off the bottom edge instead of resting flush against it,
       and inset from the sides so it reads as a floating docked bar. */
    margin: 0 14px calc(14px + var(--safe-bottom));
  }

  .attach-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    font-size: 20px;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }
  .attach-btn:hover { color: var(--brass-bright); background: rgba(201,123,141,0.08); }
  .attach-btn.active {
    color: var(--brass-bright);
    background: rgba(201,123,141,0.14);
  }

  .attach-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 2px 4px;
  }
  .attach-thumb {
    position: relative;
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border: 1px solid var(--brass-dim);
    border-radius: 8px;
    overflow: hidden;
    background: rgba(201,123,141,0.06);
  }
  .attach-thumb img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .attach-thumb-remove {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 18px;
    height: 18px;
    line-height: 1;
    border-radius: 50%;
    border: 1px solid var(--wax);
    background: rgba(23,19,26,0.85);
    color: var(--wax-bright);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .composer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .composer-row-spacer {
    flex: 1;
  }

  #textInput {
    width: 100%;
    resize: none;
    max-height: 120px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 17px;
    padding: 6px 4px 10px;
    line-height: 1.4;
    outline: none;
  }
  #textInput::placeholder { color: var(--ink-faint); }

  .send-btn {
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--brass-dim);
    background: linear-gradient(180deg, rgba(201,123,141,0.16), rgba(201,123,141,0.05));
    color: var(--brass-bright);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
  }
  .send-btn svg { display: block; width: 19px; height: 19px; }
  .send-btn:hover { background: rgba(201,123,141,0.22); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled {
    opacity: 0.32;
    cursor: default;
    transform: none;
    background: linear-gradient(180deg, rgba(201,123,141,0.08), rgba(201,123,141,0.02));
  }

  .mic-btn {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
  }
  .mic-btn:hover { color: var(--brass-bright); background: rgba(201,123,141,0.08); }
  .mic-btn.typing-hidden { display: none; }

  .mic-icon {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .mic-stop-square {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 3px;
    background: var(--wax-bright);
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .mic-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--wax-bright);
    opacity: 0;
  }

  .mic-btn.recording {
    color: var(--wax-bright);
  }
  .mic-btn.recording .mic-icon {
    opacity: 0;
    transform: scale(0.5);
  }
  .mic-btn.recording .mic-stop-square {
    opacity: 1;
    transform: scale(1);
  }

  .mic-btn.recording .ring-1 { animation: pulse-ring 1.8s ease-out infinite; }
  .mic-btn.recording .ring-2 { animation: pulse-ring 1.8s ease-out infinite 0.6s; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .mic-timer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .mic-timer:empty { display: none; }

  /* ---------- Thinking indicator ---------- */
  .thinking {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--rule-faint);
    border-radius: 16px 16px 16px 4px;
  }
  .think-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--brass-bright);
    animation: think-bounce 1.1s ease-in-out infinite;
  }
  .think-dot:nth-child(2) { animation-delay: 0.15s; }
  .think-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes think-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }

<script>

  const CONFIG = {
    ENDPOINT: "https://nixos.fish-glyptodon.ts.net",           // Tailscale HTTPS address
    TEXT_PATH: "/api/text",
    VOICE_PATH: "/api/voice",
    HEALTH_PATH: "/api/health",
    GATE_PATH: "/api/gate",
    HISTORY_DAYS_PATH: "/api/history/days",
    HISTORY_DAY_PATH: "/api/history/day",
    REMINDERS_PATH: "/api/reminders",
    AVATAR_PATH: "/api/avatar",
  };

  const GATE_PASSWORD = "goharumer"; // UX gate only — short, human-typeable

  let authToken = sessionStorage.getItem("perla_session_token") || null;

  // ---------- Custom avatar (profile.jpg) ----------
  // Unauthenticated probe — the server serves this without auth since a
  // profile picture isn't sensitive, and the browser's own favicon fetch
  // can't carry an Authorization header anyway. Falls back to the "P"
  // mark (already in the markup) if the file isn't there.
  (function loadAvatar() {
    if (!CONFIG.ENDPOINT) return;
    const avatarUrl = CONFIG.ENDPOINT + CONFIG.AVATAR_PATH;
    const probe = new Image();
    probe.onload = () => {
      document.querySelectorAll("#gateMark, #brandMark").forEach((mark) => {
        mark.textContent = "";
        const img = document.createElement("img");
        img.src = avatarUrl;
        img.alt = "Perla";
        mark.appendChild(img);
      });
      let favicon = document.querySelector('link[rel="icon"]');
      if (favicon) favicon.href = avatarUrl;
    };
    probe.onerror = () => {
      // No profile.jpg deployed yet — keep the default "P" mark and SVG
      // favicon already in the markup, no action needed.
    };
    probe.src = avatarUrl;
  })();

  // ---------- Tier state (separate Tier 1 / Tier 2 chats) ----------
  // Each tier keeps its own chat transcript. Stored in sessionStorage so a
  // reload within the same gate-unlock doesn't lose either conversation,
  // but a fresh gate unlock always starts clean at Tier 1 per spec.
  let activeTier = parseInt(sessionStorage.getItem("perla_active_tier") || "1", 10);
  let isElevated = sessionStorage.getItem("perla_elevated") === "1";
  let tier2Unread = sessionStorage.getItem("perla_tier2_unread") === "1";

  function getChatLog(tier) {
    return sessionStorage.getItem("perla_chat_t" + tier) || "";
  }

  function setChatLog(tier, html) {
    try {
      sessionStorage.setItem("perla_chat_t" + tier, html);
    } catch (e) {
      // sessionStorage quota exceeded or unavailable — chat still works
      // in-memory for this page view, just won't survive a reload.
    }
  }

  // Overlay view state (history / reminders share the main output area
  // as a read-only overlay on top of whichever tier's chat is active).
  // Declared here (not where first used) so addEntry, defined below, can
  // reference activeOverlay without relying on hoisting/call-order luck.
  let liveOutputHTML = null;
  let activeOverlay = null;  // "history" | "reminders" | null

  // ---------- Gate ----------
  const gate = document.getElementById("gate");
  const app = document.getElementById("app");
  const gatePassword = document.getElementById("gatePassword");
  const gateSubmit = document.getElementById("gateSubmit");
  const gateError = document.getElementById("gateError");
  const gateCard = document.querySelector(".gate-card");

  // If we already have a session token, skip the gate — this is a reload
  // within the same gate-unlock, so restore whatever tier/chat state was
  // saved rather than resetting to Tier 1. The actual initAppState() call
  // happens at the end of the script, once all DOM refs below exist.
  if (authToken) {
    gate.style.display = "none";
    app.hidden = false;
    checkConnection();
  }

  function initAppState(freshUnlock) {
    if (freshUnlock) {
      // New gate session: always start at Tier 1, drop any elevation and
      // chat transcripts left over from a previous session.
      sessionStorage.removeItem("perla_chat_t1");
      sessionStorage.removeItem("perla_chat_t2");
      sessionStorage.removeItem("perla_elevate_until");
      sessionStorage.setItem("perla_active_tier", "1");
      sessionStorage.setItem("perla_elevated", "0");
      sessionStorage.setItem("perla_tier2_unread", "0");
      activeTier = 1;
      isElevated = false;
      tier2Unread = false;
    }
    setElevated(isElevated);
    tierBadge.textContent = "T" + activeTier;
    tier1Btn.classList.toggle("active", activeTier === 1);
    tier2Btn.classList.toggle("active", activeTier === 2);
    updateTier2UnreadBadge();
    const savedLog = getChatLog(activeTier);
    if (savedLog) {
      output.innerHTML = savedLog;
      // A reload that happens while a request is in flight can leave the
      // thinking indicator's markup as the last thing painted before the
      // tab closed — strip any stray copy so it doesn't reappear frozen
      // on the next load with no request actually pending.
      const staleThinking = output.querySelector("#thinkingIndicator");
      if (staleThinking) staleThinking.remove();
      output.querySelectorAll(".entry.meta-visible").forEach((el) => el.classList.remove("meta-visible"));
      // blob: URLs from a previous page load don't survive a reload —
      // swap any stale screenshot image for a plain notice instead of
      // showing a broken-image icon.
      output.querySelectorAll("img.entry-image").forEach((img) => {
        if (img.src.startsWith("blob:")) {
          const wrap = img.closest(".entry-image-wrap");
          if (wrap) wrap.innerHTML = '<span class="entry-image-error">Screenshot no longer available after reload.</span>';
        }
      });
      output.scrollIntoView({ block: "end" });
    } else {
      showWelcome(activeTier);
    }
  }

  async function tryUnlock() {
    const value = gatePassword.value;
    if (value.length === 0) return;

    // Client-side UX check first (fast fail, no network)
    if (value !== GATE_PASSWORD) {
      gateError.textContent = "Wrong password.";
      gateError.hidden = false;
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
      return;
    }

    // Exchange gate password for a server-issued session token
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.GATE_PATH, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: value }),
      });
      if (!res.ok) throw new Error("gate rejected");
      const data = await res.json();
      authToken = data.token;
      sessionStorage.setItem("perla_session_token", authToken);
      gate.style.display = "none";
      app.hidden = false;
      checkConnection();
      initAppState(true);
    } catch (e) {
      gateError.hidden = false;
      gateError.textContent = "Server rejected the password.";
      gateCard.classList.remove("shake");
      void gateCard.offsetWidth;
      gateCard.classList.add("shake");
      gatePassword.value = "";
      gatePassword.focus();
    }
  }

  gateSubmit.addEventListener("click", tryUnlock);
  gatePassword.addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  // ---------- Status ----------
  const statusDot = document.getElementById("statusDot");
  function setStatusText(text) {
    statusDot.title = text;
  }

  async function checkConnection() {
    if (!CONFIG.ENDPOINT) {
      statusDot.className = "status-dot";
      setStatusText("not linked");
      return;
    }
    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.HEALTH_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (res.ok) {
        statusDot.className = "status-dot ok";
        setStatusText("connected");
      } else {
        throw new Error("bad status");
      }
    } catch (e) {
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    }
  }

  // ---------- Hamburger menu ----------
  const menuBtn = document.getElementById("menuBtn");
  const appMenu = document.getElementById("appMenu");

  function closeAppMenu() {
    appMenu.classList.remove("open");
    appMenu.setAttribute("aria-hidden", "true");
    menuBtn.classList.remove("active");
    menuBtn.setAttribute("aria-expanded", "false");
  }

  function toggleAppMenu() {
    const opening = !appMenu.classList.contains("open");
    if (opening) closeAttachMenu();
    appMenu.classList.toggle("open", opening);
    appMenu.setAttribute("aria-hidden", String(!opening));
    menuBtn.classList.toggle("active", opening);
    menuBtn.setAttribute("aria-expanded", String(opening));
  }

  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleAppMenu();
  });

  document.addEventListener("click", (e) => {
    if (appMenu.classList.contains("open") && !appMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
      closeAppMenu();
    }
  });

  // ---------- Elevation (Tier 2) ----------
  const elevateBtn = document.getElementById("elevateBtn");
  const elevatePanel = document.getElementById("elevatePanel");
  const elevateInput = document.getElementById("elevateInput");
  const elevateSubmit = document.getElementById("elevateSubmit");
  const elevateStatus = document.getElementById("elevateStatus");
  const tierBadge = document.getElementById("tierBadge");

  elevateBtn.addEventListener("click", () => {
    closeAppMenu();
    closeHistoryPanel();
    closeRemindersPanel();
    const opening = elevatePanel.hidden;
    elevatePanel.hidden = !opening;
    elevateBtn.classList.toggle("active", opening);
    if (opening) elevateInput.focus();
  });

  elevateSubmit.addEventListener("click", async () => {
    const token = elevateInput.value.trim();
    if (!token) return;
    elevateStatus.textContent = "Activating…";
    try {
      const res = await fetch(CONFIG.ENDPOINT + "/api/elevate", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (res.ok && data.tier === 2) {
        elevateStatus.textContent = "";
        elevateInput.value = "";
        elevatePanel.hidden = true;
        elevateBtn.classList.remove("active");
        setElevated(true);
        addEntry("system", "", "Full Mode activated for 5 minutes.");

        const until = Date.now() + (data.expires_in || 0) * 1000;
        sessionStorage.setItem("perla_elevate_until", String(until));
        startTierTimer(until);

        clearTimeout(window._elevateExpiryTimer);
        window._elevateExpiryTimer = setTimeout(() => {
          sessionStorage.removeItem("perla_elevate_until");
          stopTierTimer();
          setElevated(false);
          if (activeTier === 2) {
            switchTier(1);
            addEntry("system", "", "Full Mode expired — back to Tier 1.");
          } else {
            addEntry("system", "", "Full Mode expired.");
          }
        }, (data.expires_in || 0) * 1000);
      } else {
        if (res.status === 401) {
          relockSession();
          return;
        }
        elevateStatus.textContent = data.error || "Failed";
      }
    } catch (e) {
      elevateStatus.textContent = "Connection error";
    }
  });

  elevateInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") elevateSubmit.click();
  });

  // ---------- Output ----------
  const output = document.getElementById("output");

  // Touch devices have no :hover, so tapping a message toggles its meta
  // row (timestamp + play button) instead. Delegated on `output` so it
  // covers every entry, including ones restored from session storage or
  // history, without attaching a listener per bubble. A tap on the play
  // button itself shouldn't also toggle the row it just revealed.
  output.addEventListener("click", (e) => {
    if (e.target.closest(".replay-btn") || e.target.closest(".copy-btn") || e.target.closest(".entry-image")) return;
    const entry = e.target.closest(".entry");
    if (!entry || !output.contains(entry)) return;
    const wasVisible = entry.classList.contains("meta-visible");
    output.querySelectorAll(".entry.meta-visible").forEach((el) => {
      if (el !== entry) el.classList.remove("meta-visible");
    });
    entry.classList.toggle("meta-visible", !wasVisible);
  });

  // ---------- Markdown rendering ----------
  // Pure-function mini renderer for Perla's bubbles. Everything begins as
  // HTML-escaped text, so the only tags that can reach the DOM are the ones
  // these transforms emit — safe by construction, no sanitizer needed.
  // Fenced code blocks are hoisted first so inline rules never touch them.
  function renderMarkdown(text) {
    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Inline transforms, applied only on already-escaped source text.
    function inline(s) {
      s = s.replace(/`([^`]+)`/g, (m, code) => "<code>" + code + "</code>");
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
      s = s.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, "$1<em>$2</em>");
      s = s.replace(/~~([^~]+)~~/g, "<del>$1</del>");
      s = s.replace(/\[([^\]]+)\]\(((?:[^()]|\([^()]*\))*)\)/g, (m, label, url) => {
        if (/^[a-z][a-z0-9+.-]*:/i.test(url) && !/^(https?|mailto|tel):/i.test(url)) {
          return m; // render the raw text — never emit javascript:/data:/vbscript:/file: etc.
        }
        return '<a href="' + url + '" target="_blank" rel="noopener">' + label + "</a>";
      });
      return s;
    }

    const lines = String(text).replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let i = 0;

    while (i < lines.length) {
      const line = lines[i];

      const fence = line.match(/^```([\w+-]*)\s*$/);
      if (fence) {
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) {
          buf.push(lines[i]);
          i++;
        }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        out.push("<h" + level + ">" + inline(esc(heading[2])) + "</h" + level + ">");
        i++;
        continue;
      }

      const quote = line.match(/^>\s?/);
      if (quote) {
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          buf.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        out.push("<blockquote>" + inline(esc(buf.join(" "))) + "</blockquote>");
        continue;
      }

      const ordered = /^\d+[.)]\s/.test(line);
      if (ordered || /^[-*+]\s/.test(line)) {
        const items = [];
        while (i < lines.length && (/^\d+[.)]\s/.test(lines[i]) || /^[-*+]\s/.test(lines[i]))) {
          const item = lines[i].replace(/^(?:[-*+]|\d+[.)])\s/, "");
          items.push("<li>" + inline(esc(item)) + "</li>");
          i++;
        }
        out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>"));
        continue;
      }

      if (/^-{3,}$/.test(line) || /^\*{3,}$/.test(line)) {
        out.push("<hr>");
        i++;
        continue;
      }

      if (line.trim() === "") {
        i++;
        continue;
      }

      const buf = [];
      while (
        i < lines.length &&
        lines[i].trim() !== "" &&
        !/^```/.test(lines[i]) &&
        !/^(#{1,4})\s/.test(lines[i]) &&
        !/^>\s?/.test(lines[i]) &&
        !/^\d+[.)]\s/.test(lines[i]) &&
        !/^[-*+]\s/.test(lines[i]) &&
        !/^-{3,}$/.test(lines[i])
      ) {
        buf.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(esc(buf.join(" "))) + "</p>");
    }

    return out.join("");
  }

  function addEntry(kind, label, text) {
    // A real exchange replaces the welcome card.
    if (kind !== "system") {
      output.querySelectorAll(".welcome").forEach((w) => w.remove());
    }
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind;
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    const useMd = kind.startsWith("perla");
    entry.innerHTML =
      `<div class="entry-bubble">` + (useMd ? `<div class="md"></div>` : `<p></p>`) + `</div>` +
      (kind !== "system" ? `<div class="entry-meta"><span class="entry-time">${time}</span></div>` : "");
    if (useMd) entry.querySelector(".md").innerHTML = renderMarkdown(text);
    else entry.querySelector("p").textContent = text;
    if (kind === "perla") addCopyButton(entry, text);
    output.appendChild(entry);
    output.scrollIntoView({ block: "end" });
    entry.scrollIntoView({ behavior: "smooth", block: "end" });
    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);
    return entry;
  }

  // Screenshot images require an authenticated fetch (same as audio) since
  // the endpoint is gated — a bare <img src> can't carry the bearer token.
  // Renders as its own bubble, with the caption text (if any) above it.
  async function addImageEntry(label, imageUrl, captionText) {
    const entry = document.createElement("div");
    entry.className = "entry entry-perla";
    const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    entry.innerHTML =
      `<div class="entry-bubble">` +
      (captionText ? `<p></p>` : "") +
      `<div class="entry-image-wrap"><span class="entry-image-loading">Loading screenshot…</span></div>` +
      `</div>` +
      `<div class="entry-meta"><span class="entry-time">${time}</span></div>`;
    if (captionText) entry.querySelector("p").textContent = captionText;
    if (captionText) addCopyButton(entry, captionText);
    output.appendChild(entry);
    output.scrollIntoView({ block: "end" });
    entry.scrollIntoView({ behavior: "smooth", block: "end" });

    const wrap = entry.querySelector(".entry-image-wrap");
    try {
      const url = imageUrl.startsWith("http") ? imageUrl : CONFIG.ENDPOINT + imageUrl;
      const res = await fetch(url, { headers: { Authorization: "Bearer " + authToken } });
      if (!res.ok) throw new Error("image fetch failed");
      const blob = await res.blob();
      const objectUrl = URL.createObjectURL(blob);
      wrap.innerHTML = "";
      const img = document.createElement("img");
      img.className = "entry-image";
      img.src = objectUrl;
      img.alt = "Screenshot";
      img.addEventListener("click", () => openLightbox(objectUrl));
      wrap.appendChild(img);
    } catch (e) {
      wrap.innerHTML = `<span class="entry-image-error">Couldn't load the screenshot.</span>`;
    }

    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);
    return entry;
  }

  // ---------- Image lightbox ----------
  const lightbox = document.getElementById("lightbox");
  const lightboxImage = document.getElementById("lightboxImage");
  const lightboxClose = document.getElementById("lightboxClose");

  function openLightbox(src) {
    lightboxImage.src = src;
    lightbox.hidden = false;
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lightboxImage.removeAttribute("src");
  }
  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !lightbox.hidden) closeLightbox();
  });

  // ---------- Welcome empty state ----------
  function showWelcome(tier) {
    const active = tier !== undefined ? tier : activeTier;
    output.innerHTML = "";
    const card = document.createElement("div");
    card.className = "welcome";
    const mark = document.createElement("div");
    mark.className = "welcome-mark";
    if (!CONFIG.ENDPOINT) {
      mark.textContent = "P";
    } else {
      // Render the avatar immediately — no waiting on the async loadAvatar
      // probe, which used to leave a welcome card stuck on "P" when the
      // card was painted before the probe's onload fired. If the avatar
      // file genuinely isn't there, the img errors out and we fall back.
      const img = document.createElement("img");
      img.src = CONFIG.ENDPOINT + CONFIG.AVATAR_PATH;
      img.alt = "Perla";
      img.onerror = () => {
        if (mark.contains(img)) mark.textContent = "P";
      };
      mark.appendChild(img);
    }
    const title = document.createElement("h2");
    title.textContent = active === 2 ? "Full Mode" : "Perla";
    const sub = document.createElement("p");
    sub.textContent = active === 2
      ? "Shell, files, and everything else are in play."
      : "Ask, talk, or attach an image.";
    card.appendChild(mark);
    card.appendChild(title);
    card.appendChild(sub);
    output.appendChild(card);
    output.scrollIntoView({ block: "end" });
  }

  // ---------- Thinking indicator ----------
  function showThinking() {
    hideThinking();
    const el = document.createElement("div");
    el.className = "thinking";
    el.id = "thinkingIndicator";
    el.innerHTML = '<span class="think-dot"></span><span class="think-dot"></span><span class="think-dot"></span>';
    output.appendChild(el);
    output.scrollIntoView({ block: "end" });
    el.scrollIntoView({ behavior: "smooth", block: "end" });
  }
  function hideThinking() {
    const el = document.getElementById("thinkingIndicator");
    if (el) el.remove();
  }

  // ---------- Tier switching (Tier 1 / Tier 2 as separate chats) ----------
  const tier1Btn = document.getElementById("tier1Btn");
  const tier2Btn = document.getElementById("tier2Btn");
  const tier1Badge = document.getElementById("tier1Badge");
  const tier2Badge = document.getElementById("tier2Badge");

  const LOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="4" y="11" width="16" height="11" rx="2" ry="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

  function renderTier2Badge() {
    tier2Badge.classList.remove("locked", "unread");
    if (activeTier === 1 && tier2Unread) {
      tier2Badge.textContent = "new";
      tier2Badge.classList.add("unread");
    } else if (isElevated) {
      tier2Badge.innerHTML = "";
    } else {
      tier2Badge.innerHTML = LOCK_ICON;
      tier2Badge.classList.add("locked");
    }
  }

  function setElevated(value) {
    isElevated = value;
    sessionStorage.setItem("perla_elevated", value ? "1" : "0");
    renderTier2Badge();
  }

  function updateTier2UnreadBadge() {
    renderTier2Badge();
  }

  // ---------- Full Mode live countdown ----------
  const tierTimerEl = document.getElementById("tierTimer");
  let tierTimerInterval = null;
  let tierTimerUntil = 0;

  function stopTierTimer() {
    if (tierTimerInterval) {
      clearInterval(tierTimerInterval);
      tierTimerInterval = null;
    }
    tierTimerEl.hidden = true;
  }

  function tickTierTimer() {
    const remain = Math.max(0, Math.round((tierTimerUntil - Date.now()) / 1000));
    if (remain <= 0) {
      stopTierTimer();
      return;
    }
    const m = Math.floor(remain / 60);
    const s = remain % 60;
    tierTimerEl.textContent = m + ":" + String(s).padStart(2, "0");
    tierTimerEl.hidden = false;
  }

  function startTierTimer(until) {
    tierTimerUntil = until;
    stopTierTimer();
    tickTierTimer();
    tierTimerInterval = setInterval(tickTierTimer, 500);
  }

  function switchTier(tier) {
    if (tier === activeTier) return;
    if (tier === 2 && !isElevated) {
      // Route to elevation instead of silently failing — one tap gets
      // you to the thing you actually need to do.
      closeAppMenu();
      elevateBtn.click();
      return;
    }

    // Persist current tier's transcript before swapping.
    if (activeOverlay === null) setChatLog(activeTier, output.innerHTML);

    activeTier = tier;
    sessionStorage.setItem("perla_active_tier", String(tier));
    tierBadge.textContent = "T" + tier;

    tier1Btn.classList.toggle("active", tier === 1);
    tier2Btn.classList.toggle("active", tier === 2);

    if (tier === 2) {
      tier2Unread = false;
      sessionStorage.setItem("perla_tier2_unread", "0");
    }
    updateTier2UnreadBadge();

    if (activeOverlay === null) {
      output.innerHTML = getChatLog(tier);
      if (!output.innerHTML) {
        showWelcome(tier);
      }
      output.scrollIntoView({ block: "end" });
    }
  }

  tier1Btn.addEventListener("click", () => { closeAppMenu(); switchTier(1); });
  tier2Btn.addEventListener("click", () => { closeAppMenu(); switchTier(2); });

  function addCopyButton(entry, text) {
    const meta = entry.querySelector(".entry-meta");
    if (!meta) return;
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.setAttribute("aria-label", "Copy message");
    btn.title = "Copy";
    const copyIcon = '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg>';
    const checkIcon = '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><polyline points="4 12 9 17 18 6"/></svg>';
    btn.innerHTML = copyIcon;
    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // Clipboard API can fail without a secure context/permission —
        // fall back to a hidden textarea + execCommand so copy still
        // works rather than silently doing nothing.
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        } catch (e2) {
          return;
        }
      }
      btn.innerHTML = checkIcon;
      btn.classList.add("copied");
      setTimeout(() => {
        btn.innerHTML = copyIcon;
        btn.classList.remove("copied");
      }, 1500);
    });
    meta.appendChild(btn);
  }

  function addReplayButton(entry, audioValue) {
    const meta = entry.querySelector(".entry-meta");
    if (!meta) return;
    const btn = document.createElement("button");
    btn.className = "replay-btn";
    btn.setAttribute("aria-label", "Play voice reply");
    btn.title = "Play";
    btn.innerHTML = '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" width="14" height="14"><path d="M6.5 4.5v13l11-6.5-11-6.5z"/></svg>';
    btn.addEventListener("click", () => playAudio(audioValue));
    meta.appendChild(btn);
  }

  // ---------- Audio playback ----------
  const responseAudio = document.getElementById("responseAudio");

  function playAudio(value) {
    if (!value) return;
    if (value.startsWith("http") || value.startsWith("/")) {
      // Fetch with auth headers since audio GET requires authentication
      const url = value.startsWith("http") ? value : CONFIG.ENDPOINT + value;
      fetch(url, { headers: { Authorization: "Bearer " + authToken } })
        .then(r => r.blob())
        .then(blob => {
          responseAudio.src = URL.createObjectURL(blob);
          responseAudio.play().catch(() => {});
        })
        .catch(() => {});
    } else {
      responseAudio.src = "data:audio/mp3;base64," + value;
      responseAudio.play().catch(() => {});
    }
  }

  // ---------- Text send ----------
  const textInput = document.getElementById("textInput");
  const sendText = document.getElementById("sendText");
  const attachInput = document.getElementById("attachInput");
  const cameraInput = document.getElementById("cameraInput");
  const attachPreview = document.getElementById("attachPreview");

  const MAX_IMAGES_PER_MESSAGE = 6; // keep in sync with perla-companion.py

  // Queue of pending attachments: [{ dataUrl, filename }, ...]. Populated
  // from either the file picker (attachInput, multi-select) or the
  // camera capture input (cameraInput, one photo per tap — repeated taps
  // add more), so both paths feed the same queue and preview strip.
  let attachQueue = [];

  function renderAttachPreview() {
    attachPreview.innerHTML = "";
    attachPreview.hidden = attachQueue.length === 0;
    attachQueue.forEach((item, index) => {
      const thumb = document.createElement("div");
      thumb.className = "attach-thumb";
      const img = document.createElement("img");
      img.src = item.dataUrl;
      img.alt = item.filename || "Attached image";
      const removeBtn = document.createElement("button");
      removeBtn.className = "attach-thumb-remove";
      removeBtn.setAttribute("aria-label", "Remove image");
      removeBtn.title = "Remove";
      removeBtn.textContent = "✕";
      removeBtn.addEventListener("click", () => {
        attachQueue.splice(index, 1);
        renderAttachPreview();
        updateComposerState();
      });
      thumb.appendChild(img);
      thumb.appendChild(removeBtn);
      attachPreview.appendChild(thumb);
    });
  }

  function addFilesToQueue(fileList) {
    const files = Array.from(fileList || []);
    if (files.length === 0) return;

    const remaining = MAX_IMAGES_PER_MESSAGE - attachQueue.length;
    if (remaining <= 0) {
      addEntry("system", "", `You can attach up to ${MAX_IMAGES_PER_MESSAGE} images per message.`);
      return;
    }
    const accepted = files.slice(0, remaining);
    if (files.length > accepted.length) {
      addEntry("system", "", `Only added ${accepted.length} of ${files.length} images — max ${MAX_IMAGES_PER_MESSAGE} per message.`);
    }

    accepted.forEach((file) => {
      if (!file.type.startsWith("image/")) {
        addEntry("system", "", `${file.name || "That file"} isn't an image.`);
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        addEntry("system", "", `${file.name || "That image"} is too large — max 10MB.`);
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        attachQueue.push({ dataUrl: reader.result, filename: file.name });
        renderAttachPreview();
        updateComposerState();
      };
      reader.onerror = () => addEntry("system", "", `Couldn't read ${file.name || "that image"}.`);
      reader.readAsDataURL(file);
    });
  }

  attachInput.addEventListener("change", () => {
    addFilesToQueue(attachInput.files);
    attachInput.value = "";
  });

  cameraInput.addEventListener("change", () => {
    addFilesToQueue(cameraInput.files);
    cameraInput.value = "";
  });

  // ---------- Attach menu (paperclip → Camera / Image) ----------
  const attachBtn = document.getElementById("attachBtn");
  const attachMenu = document.getElementById("attachMenu");
  const attachCameraBtn = document.getElementById("attachCameraBtn");
  const attachImageBtn = document.getElementById("attachImageBtn");

  function closeAttachMenu() {
    attachMenu.classList.remove("open");
    attachMenu.setAttribute("aria-hidden", "true");
    attachBtn.classList.remove("active");
    attachBtn.setAttribute("aria-expanded", "false");
  }

  function positionAttachMenu() {
    const btnRect = attachBtn.getBoundingClientRect();
    // Menu's own width isn't known until it's laid out; read it after
    // toggling "open" (display is already flex via .floating-menu, only
    // opacity/transform change, so offsetWidth is reliable even before
    // the transition finishes).
    const menuWidth = attachMenu.offsetWidth || 200;
    let left = btnRect.left;
    // Keep it on-screen if the button is near the right edge.
    left = Math.min(left, window.innerWidth - menuWidth - 12);
    left = Math.max(left, 12);
    attachMenu.style.left = left + "px";
    attachMenu.style.bottom = (window.innerHeight - btnRect.top + 10) + "px";
  }

  function toggleAttachMenu() {
    const opening = !attachMenu.classList.contains("open");
    // Only one floating menu open at a time — the hamburger menu shares
    // the same visual language, so leaving both open at once looks like
    // a UI glitch rather than two independent controls.
    if (opening) closeAppMenu();
    if (opening) positionAttachMenu();
    attachMenu.classList.toggle("open", opening);
    attachMenu.setAttribute("aria-hidden", String(!opening));
    attachBtn.classList.toggle("active", opening);
    attachBtn.setAttribute("aria-expanded", String(opening));
  }

  attachBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    toggleAttachMenu();
  });

  attachCameraBtn.addEventListener("click", () => {
    closeAttachMenu();
    cameraInput.click();
  });

  attachImageBtn.addEventListener("click", () => {
    closeAttachMenu();
    attachInput.click();
  });

  document.addEventListener("click", (e) => {
    if (
      attachMenu.classList.contains("open") &&
      !attachMenu.contains(e.target) &&
      e.target !== attachBtn &&
      !attachBtn.contains(e.target)
    ) {
      closeAttachMenu();
    }
  });

  window.addEventListener("resize", () => {
    if (attachMenu.classList.contains("open")) positionAttachMenu();
  });

  // Send button enablement + mic visibility follow what's being composed:
  // typing hides the voice button (voice becomes irrelevant while you're
  // writing), and the send button stays inert until there's text or at
  // least one queued image.
  function updateComposerState() {
    const hasText = !!textInput.value.trim();
    const hasImages = attachQueue.length > 0;
    sendText.disabled = !(hasText || hasImages);
    if (micBtn) {
      micBtn.classList.toggle("typing-hidden", hasText && !recording);
    }
  }

  textInput.addEventListener("input", () => {
    textInput.style.height = "auto";
    textInput.style.height = Math.min(textInput.scrollHeight, 120) + "px";
    updateComposerState();
  });

  textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitText();
    }
  });

  sendText.addEventListener("click", submitText);

  async function submitText() {
    const message = textInput.value.trim();
    const images = attachQueue;
    if (!message && images.length === 0) return;
    if (message) addEntry("user", "You", message);
    if (images.length > 0) {
      const userEntry = document.createElement("div");
      userEntry.className = "entry entry-user";
      const grid = document.createElement("div");
      grid.className = "entry-image-grid";
      images.forEach((item) => {
        const preview = document.createElement("img");
        preview.className = "entry-image";
        preview.src = item.dataUrl;
        preview.alt = item.filename || "Attached image";
        preview.addEventListener("click", () => openLightbox(item.dataUrl));
        grid.appendChild(preview);
      });
      userEntry.appendChild(grid);
      output.appendChild(userEntry);
      output.scrollIntoView({ block: "end" });
      userEntry.scrollIntoView({ behavior: "smooth", block: "end" });
    }
    textInput.value = "";
    textInput.style.height = "auto";
    attachQueue = [];
    renderAttachPreview();
    updateComposerState();

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }

    showThinking();
    try {
      const body = { message, tier: activeTier };
      if (images.length > 0) {
        body.images = images.map((item) => item.dataUrl);
      }
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.TEXT_PATH, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + authToken,
        },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          relockSession();
          return;
        }
        if (res.status === 403 && data.error) {
          addEntry("system", "", data.error);
        } else {
          throw new Error("request failed");
        }
        return;
      }
      if (data.image) {
        await addImageEntry("Perla", data.image, data.text || "");
      } else {
        const entry = addEntry("perla", "Perla", data.text || "(no response)");
        if (data.audio) {
          playAudio(data.audio);
          addReplayButton(entry, data.audio);
        }
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    } finally {
      hideThinking();
    }
  }

  // ---------- Voice recording ----------
  const micBtn = document.getElementById("micBtn");
  const micTimer = document.getElementById("micTimer");

  let mediaRecorder = null;
  let audioChunks = [];
  let recording = false;
  let recordStart = 0;
  let timerInterval = null;

  micBtn.addEventListener("click", async () => {
    if (!recording) {
      await startRecording();
    } else {
      stopRecording();
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        handleRecordingComplete();
      };
      mediaRecorder.start();
      recording = true;
      recordStart = Date.now();
      micBtn.classList.add("recording");
      updateComposerState();
      timerInterval = setInterval(updateTimer, 250);
      updateTimer();
    } catch (e) {
      micTimer.textContent = "Microphone access denied";
    }
  }

  function stopRecording() {
    if (mediaRecorder && recording) {
      mediaRecorder.stop();
      recording = false;
      micBtn.classList.remove("recording");
      clearInterval(timerInterval);
      micTimer.textContent = "Sending…";
      updateComposerState();
    }
  }

  function updateTimer() {
    const elapsed = Math.floor((Date.now() - recordStart) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
    const ss = String(elapsed % 60).padStart(2, "0");
    micTimer.textContent = `${mm}:${ss} — tap to stop`;
  }

  async function handleRecordingComplete() {
    const blob = new Blob(audioChunks, { type: "audio/webm" });

    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      micTimer.textContent = "";
      return;
    }

    showThinking();
    try {
      const form = new FormData();
      form.append("audio", blob, "input.webm");
      form.append("tier", String(activeTier));

      const res = await fetch(CONFIG.ENDPOINT + CONFIG.VOICE_PATH, {
        method: "POST",
        headers: { Authorization: "Bearer " + authToken },
        body: form,
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          relockSession();
          return;
        }
        if (res.status === 403 && data.error) {
          if (data.transcript) addEntry("user", "You", data.transcript);
          addEntry("system", "", data.error);
        } else {
          throw new Error("request failed");
        }
        return;
      }

      if (data.transcript) addEntry("user", "You", data.transcript);
      if (data.image) {
        await addImageEntry("Perla", data.image, data.text || "");
      } else {
        const entry = addEntry("perla", "Perla", data.text || "(no response)");
        if (data.audio) {
          playAudio(data.audio);
          addReplayButton(entry, data.audio);
        }
      }
      statusDot.className = "status-dot ok";
      setStatusText("connected");
    } catch (e) {
      addEntry("system", "", "Couldn't reach Perla. Check the connection.");
      statusDot.className = "status-dot err";
      setStatusText("unreachable");
    } finally {
      hideThinking();
      micTimer.textContent = "";
    }
  }

  // ---------- History (view-only past conversations) ----------
  const historyBtn = document.getElementById("historyBtn");
  const historyPanel = document.getElementById("historyPanel");
  const historyDaySelect = document.getElementById("historyDaySelect");
  const historyStatus = document.getElementById("historyStatus");
  const composer = document.querySelector(".composer");

  let daysLoaded = false;

  function formatDayLabel(dateStr) {
    // dateStr is YYYY-MM-DD
    const [y, m, d] = dateStr.split("-").map(Number);
    const dt = new Date(y, m - 1, d);
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const isYesterday = dt.toDateString() === yesterday.toDateString();
    const label = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    if (isToday) return `Today — ${label}`;
    if (isYesterday) return `Yesterday — ${label}`;
    return label;
  }

  function closeHistoryPanel() {
    if (activeOverlay !== "history") return;
    activeOverlay = null;
    historyBtn.classList.remove("active");
    historyPanel.hidden = true;
    composer.hidden = false;
    historyDaySelect.value = "";
    historyStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openHistoryPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeRemindersPanel();

    activeOverlay = "history";
    historyBtn.classList.add("active");
    historyPanel.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    addEntry("system", "", "Viewing past conversations — read only.");

    if (!daysLoaded) {
      historyStatus.textContent = "Loading days…";
      try {
        const res = await fetch(CONFIG.ENDPOINT + CONFIG.HISTORY_DAYS_PATH, {
          headers: { Authorization: "Bearer " + authToken },
        });
        if (!res.ok) throw new Error("failed");
        const data = await res.json();
        historyDaySelect.innerHTML = '<option value="">Select a day…</option>';
        (data.days || []).forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = formatDayLabel(d);
          historyDaySelect.appendChild(opt);
        });
        daysLoaded = true;
        historyStatus.textContent = (data.days || []).length
          ? ""
          : "No past conversations found.";
      } catch (e) {
        historyStatus.textContent = "Couldn't load days.";
      }
    }
  }

  historyBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "history") {
      closeHistoryPanel();
    } else {
      openHistoryPanel();
    }
  });

  historyDaySelect.addEventListener("change", async () => {
    const date = historyDaySelect.value;
    output.innerHTML = "";
    if (!date) return;

    historyStatus.textContent = "Loading…";
    try {
      const res = await fetch(
        CONFIG.ENDPOINT + CONFIG.HISTORY_DAY_PATH + "?date=" + encodeURIComponent(date),
        { headers: { Authorization: "Bearer " + authToken } }
      );
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      const entries = data.entries || [];

      if (entries.length === 0) {
        addEntry("system", "", "No conversations logged that day.");
        historyStatus.textContent = "";
        return;
      }

      entries.forEach((e) => {
        renderHistoryEntry(e);
      });
      historyStatus.textContent = `${entries.length} exchange${entries.length === 1 ? "" : "s"}`;
    } catch (e) {
      addEntry("system", "", "Couldn't load that day's conversation.");
      historyStatus.textContent = "";
    }
  });

  function renderHistoryEntry(e) {
    // Same visual shape as live chat: user bubble, then Perla's reply.
    // Tier 0 (direct system dispatch, no LLM) gets a subtler treatment
    // since it's a command echo rather than a conversational reply.
    const isTier0 = e.tier === 0;

    if (e.input) {
      addHistoryEntry("user", "You", e.input, e.time);
    }
    if (e.response) {
      const kind = isTier0 ? "perla entry-tier0" : "perla";
      addHistoryEntry(kind, "Perla", e.response, e.time);
    }
  }

  function addHistoryEntry(kind, label, text, timeStr) {
    const entry = document.createElement("div");
    entry.className = "entry entry-" + kind.split(" ")[0];
    if (kind.includes("entry-tier0")) entry.classList.add("entry-tier0");
    const useMd = kind.startsWith("perla");
    entry.innerHTML =
      `<div class="entry-bubble">` + (useMd ? `<div class="md"></div>` : `<p></p>`) + `</div>` +
      `<div class="entry-meta"><span class="entry-time">${timeStr || ""}</span></div>`;
    if (useMd) entry.querySelector(".md").innerHTML = renderMarkdown(text);
    else entry.querySelector("p").textContent = text;
    output.appendChild(entry);
    return entry;
  }

  // ---------- Reminders (view-only, status-grouped) ----------
  const remindersBtn = document.getElementById("remindersBtn");
  const remindersBar = document.getElementById("remindersBar");
  const remindersStatus = document.getElementById("remindersStatus");

  function closeRemindersPanel() {
    if (activeOverlay !== "reminders") return;
    activeOverlay = null;
    remindersBtn.classList.remove("active");
    remindersBar.hidden = true;
    composer.hidden = false;
    remindersStatus.textContent = "";
    output.innerHTML = liveOutputHTML !== null ? liveOutputHTML : "";
    output.scrollIntoView({ block: "end" });
  }

  async function openRemindersPanel() {
    if (!CONFIG.ENDPOINT) {
      addEntry("system", "", "Not linked to Perla yet — set CONFIG.ENDPOINT.");
      return;
    }
    elevatePanel.hidden = true;
    elevateBtn.classList.remove("active");
    closeHistoryPanel();

    activeOverlay = "reminders";
    remindersBtn.classList.add("active");
    remindersBar.hidden = false;
    composer.hidden = true;
    liveOutputHTML = output.innerHTML;
    output.innerHTML = "";
    remindersStatus.textContent = "Loading…";

    try {
      const res = await fetch(CONFIG.ENDPOINT + CONFIG.REMINDERS_PATH, {
        headers: { Authorization: "Bearer " + authToken },
      });
      if (!res.ok) throw new Error("failed");
      const data = await res.json();
      renderReminders(data);
      remindersStatus.textContent = "";
    } catch (e) {
      output.innerHTML = "";
      addEntry("system", "", "Couldn't load reminders.");
      remindersStatus.textContent = "";
    }
  }

  remindersBtn.addEventListener("click", () => {
    closeAppMenu();
    if (activeOverlay === "reminders") {
      closeRemindersPanel();
    } else {
      openRemindersPanel();
    }
  });

  function formatReminderTime(iso) {
    // iso like 2026-08-26T18:00 -> "Tue, Aug 26 · 6:00 PM"; if it's today,
    // just the time.
    if (!iso) return "";
    const dt = new Date(iso);
    if (isNaN(dt.getTime())) return iso;
    const today = new Date();
    const isToday = dt.toDateString() === today.toDateString();
    const timeStr = dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    if (isToday) return `Today · ${timeStr}`;
    const dateStr = dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    return `${dateStr} · ${timeStr}`;
  }

  function renderReminders(data) {
    output.innerHTML = "";

    const pending = data.pending || [];
    const missed = data.missed || [];
    const delivered = data.delivered || [];

    if (pending.length === 0 && missed.length === 0 && delivered.length === 0) {
      const wrap = document.createElement("div");
      wrap.className = "reminder-empty";
      wrap.textContent = "No reminders set.";
      output.appendChild(wrap);
      return;
    }

    if (missed.length > 0) {
      output.appendChild(buildReminderSection(
        "missed", `Missed (${missed.length})`, missed,
        (r) => `Was due ${formatReminderTime(r.due)} — caught at ${formatReminderTime(r.delivered)}`
      ));
    }

    // Upcoming always shows, even when empty, so it's clear there's
    // nothing pending rather than looking like the section didn't load.
    const upcomingSection = buildReminderSection(
      "pending", `Upcoming (${pending.length})`, pending,
      (r) => r.overdue ? `Due ${formatReminderTime(r.due)} — waiting to fire` : `Due ${formatReminderTime(r.due)}`,
      "Nothing on the books."
    );
    output.appendChild(upcomingSection);

    if (delivered.length > 0) {
      const details = document.createElement("details");
      details.className = "reminder-collapsible reminder-section";
      const summary = document.createElement("summary");
      summary.innerHTML = `<div class="reminder-section-title">Delivered (${delivered.length})<span class="disclosure-arrow">›</span></div>`;
      details.appendChild(summary);
      const list = buildReminderList(delivered, "delivered",
        (r) => `Delivered ${formatReminderTime(r.delivered)}`
      );
      details.appendChild(list);
      output.appendChild(details);
    }
  }

  function buildReminderSection(statusClass, title, items, metaFn, emptyText) {
    const section = document.createElement("div");
    section.className = "reminder-section";
    const heading = document.createElement("div");
    heading.className = "reminder-section-title " + statusClass;
    heading.textContent = title;
    section.appendChild(heading);

    if (items.length === 0 && emptyText) {
      const empty = document.createElement("div");
      empty.className = "reminder-empty";
      empty.textContent = emptyText;
      section.appendChild(empty);
      return section;
    }

    section.appendChild(buildReminderList(items, statusClass, metaFn));
    return section;
  }

  function repeatLabel(token) {
    if (!token) return "";
    const t = token.toLowerCase();
    if (t === "hourly") return "repeats hourly";
    if (t === "daily") return "repeats daily";
    if (t === "weekly") return "repeats weekly";
    if (t === "monthly") return "repeats monthly";
    if (t === "yearly") return "repeats yearly";
    const m = t.match(/^every:(\d+)([hdw])$/);
    if (m) {
      const n = parseInt(m[1], 10);
      const unit = { h: "hour", d: "day", w: "week" }[m[2]];
      return `repeats every ${n} ${unit}${n > 1 ? "s" : ""}`;
    }
    return "";
  }

  function buildReminderList(items, statusClass, metaFn) {
    const list = document.createElement("div");
    const glyphSVGs = {
      pending: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>',
      missed: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      delivered: '<svg viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><polyline points="20 6 9 17 4 12"/></svg>',
    };

    items.forEach((r) => {
      const row = document.createElement("div");
      row.className = "reminder-row";

      const glyphClass = statusClass === "pending" && r.overdue ? "overdue" : statusClass;
      const glyph = document.createElement("div");
      glyph.className = "reminder-glyph " + glyphClass;
      glyph.innerHTML = glyphSVGs[statusClass] || "";

      const body = document.createElement("div");
      body.className = "reminder-body";
      const text = document.createElement("div");
      text.className = "reminder-text";
      text.textContent = r.text;
      const cadenceLabel = repeatLabel(r.repeat);
      if (cadenceLabel) {
        const cadence = document.createElement("div");
        cadence.className = "reminder-cadence";
        cadence.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
        const span = document.createElement("span");
        span.textContent = cadenceLabel;
        cadence.appendChild(span);
        body.appendChild(cadence);
      }
      const meta = document.createElement("div");
      meta.className = "reminder-meta";
      meta.textContent = metaFn(r);
      body.appendChild(text);
      body.appendChild(meta);

      row.appendChild(glyph);
      row.appendChild(body);
      list.appendChild(row);
    });

    return list;
  }

  // ---------- Mobile keyboard handling (chat-app style) ----------
  // The on-screen keyboard shrinks the visualViewport rather than the
  // layout viewport, so with a plain 100dvh app shell the composer ends
  // up hidden behind the keyboard while the page silently scrolls under
  // it. Real chat apps instead resize the whole chat surface to fit the
  // visible area: header stays pinned at its natural position, the
  // composer sits right on top of the keyboard, and the message list is
  // the only thing that shrinks (and auto-scrolls to keep the latest
  // message in view). We do that here by driving --app-height / .app's
  // height directly from visualViewport instead of translating anything.
  (function keyboardResize() {
    const appEl = document.getElementById("app");
    if (!window.visualViewport || !appEl) return;

    let rafId = null;

    const applyViewportHeight = () => {
      const vv = window.visualViewport;

      // Ignore pinch-zoom: only care about the keyboard-driven case,
      // which is a shrink at scale ~1.
      const height = vv.scale > 1.01 ? window.innerHeight : vv.height;

      appEl.style.height = height + "px";

      // visualViewport can be offset from the top (e.g. address bar
      // collapse behavior on some browsers) — pin the app shell's top
      // to that offset so it tracks the actually-visible region rather
      // than drifting under content the user can't see.
      appEl.style.top = vv.offsetTop ? vv.offsetTop + "px" : "";

      // Keep the newest message visible once the keyboard has finished
      // animating in/out and the new height has settled.
      output.scrollIntoView({ block: "end" });
    };

    const scheduleApply = () => {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(applyViewportHeight);
    };

    window.visualViewport.addEventListener("resize", scheduleApply);
    window.visualViewport.addEventListener("scroll", scheduleApply);

    // Also apply on focus/blur of the composer input directly — on some
    // mobile browsers the visualViewport resize event fires a beat late,
    // which shows up as a visible jump. Nudging it right on focus/blur
    // covers that gap.
    if (textInput) {
      textInput.addEventListener("focus", () => setTimeout(scheduleApply, 50));
      textInput.addEventListener("blur", () => setTimeout(scheduleApply, 50));
    }

    // Initial sizing in case the page loads with the viewport already
    // in a non-default state (e.g. rotated device).
    applyViewportHeight();
  })();

  // ---------- Session expiry / re-lock ----------
  // The daemon's session tokens are in-memory: a restart (or switch) makes
  // the stored token stale, and every authenticated call returns 401. Rather
  // than surfacing that as a generic "Couldn't reach Perla", toss the token
  // and bounce back to the gate.
  function relockSession() {
    sessionStorage.removeItem("perla_session_token");
    sessionStorage.removeItem("perla_elevate_until");
    sessionStorage.removeItem("perla_elevated");
    sessionStorage.removeItem("perla_tier2_unread");
    authToken = null;
    stopTierTimer();
    app.hidden = true;
    gate.style.display = "";
    gateError.hidden = false;
    gateError.textContent = "Session expired — enter your password.";
    gatePassword.value = "";
    gatePassword.focus();
  }

  // ---------- Clear conversation ----------
  const clearChatBtn = document.getElementById("clearChatBtn");

  clearChatBtn.addEventListener("click", () => {
    closeAppMenu();
    // Back out of an overlay first so the chat transcript is the thing
    // on screen — otherwise the wipe would silently apply to the chat
    // hidden underneath the history/reminders view.
    if (activeOverlay === "history") {
      closeHistoryPanel();
    } else if (activeOverlay === "reminders") {
      closeRemindersPanel();
    }
    if (!output.querySelector(".entry")) return;
    if (!window.confirm("Clear this conversation?")) return;
    output.innerHTML = "";
    setChatLog(activeTier, "");
    showWelcome(activeTier);
  });

  // ---------- Deferred init ----------
  // Runs after every const/function above is declared. Handles the
  // "already had a session token" auto-unlock path from earlier in this
  // script, restoring saved tier/chat state for that case.
  updateComposerState();
  if (authToken) {
    initAppState(false);
    // Resume the Full Mode countdown across a reload, if it's still running.
    const existingUntil = parseInt(sessionStorage.getItem("perla_elevate_until") || "0", 10);
    if (isElevated && existingUntil > Date.now()) {
      startTierTimer(existingUntil);
    } else if (isElevated && existingUntil <= Date.now()) {
      sessionStorage.removeItem("perla_elevate_until");
      setElevated(false);
    }
  }
</script>

</body>
</html>
