<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17131a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Perla" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/api/avatar" />
  <title>Perla</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3CradialGradient%20id%3D%22glow%22%20cx%3D%2235%25%22%20cy%3D%2230%25%22%20r%3D%2270%25%22%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220.35%22/%3E%0A%20%20%20%20%20%20%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23c97b8d%22%20stop-opacity%3D%220%22/%3E%0A%20%20%20%20%3C/radialGradient%3E%0A%20%20%3C/defs%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%2317131a%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22url%28%23glow%29%22/%3E%0A%20%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%238c4f5c%22%20stroke-width%3D%221.5%22/%3E%0A%20%20%3Ctext%20x%3D%2232%22%20y%3D%2233%22%20text-anchor%3D%22middle%22%20dominant-baseline%3D%22central%22%0A%20%20%20%20%20%20%20%20font-family%3D%22Iowan%20Old%20Style%2C%20Palatino%20Linotype%2C%20Palatino%2C%20Georgia%2C%20serif%22%0A%20%20%20%20%20%20%20%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23e4a2b2%22%3EP%3C/text%3E%0A%3C/svg%3E%0A" />
  <style>
    :root {
      --bg: #17131a;
      --bg-panel: #201a23;
      --bg-panel-2: #29212c;
      --rule: #453a49;
      --rule-faint: #322a36;
      --ink: #e9dfc7;
      --ink-dim: #a3906c;
      --ink-faint: #6e5f45;
      --brass: #c97b8d;
      --brass-bright: #e4a2b2;
      --brass-dim: #8c4f5c;
      --wax: #8a3226;
      --wax-bright: #b8452f;
      --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-serif);
      /* overflow hidden here (not just on .app) is what stops the desktop
       card's extra 28px top/bottom padding from creating a page-level
       scrollbar — .app itself scrolls internally via .page, the shell
       never needs to. */
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(ellipse 900px 600px at 50% -10%, rgba(201, 123, 141, 0.07), transparent 60%),
        var(--bg);
    }

    button {
      font-family: inherit;
    }

    input {
      font-family: inherit;
    }

    /* ---------- Password Gate ---------- */
    .gate {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
      background: var(--bg);
    }

    .gate-card {
      width: 100%;
      max-width: 340px;
      text-align: center;
      padding: 40px 32px 32px;
      border: 1px solid var(--rule);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    .gate-mark {
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 1px solid var(--brass-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: var(--brass-bright);
      background: radial-gradient(circle at 35% 30%, rgba(201, 123, 141, 0.18), transparent 70%);
      overflow: hidden;
    }

    .gate-mark img,
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gate-card h1 {
      margin: 0 0 32px;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .gate-card input[type="password"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      font-size: 16px;
      text-align: center;
      padding: 10px 4px;
      letter-spacing: 0.15em;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .gate-card input[type="password"]:focus {
      border-bottom-color: var(--brass);
    }

    .gate-card button {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--brass-dim);
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.14), rgba(201, 123, 141, 0.04));
      color: var(--brass-bright);
      font-size: 15px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .gate-card button:hover {
      background: rgba(201, 123, 141, 0.2);
    }

    .gate-card button:active {
      transform: scale(0.98);
    }

    .gate-error {
      margin: 14px 0 0;
      color: var(--wax-bright);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-6px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    /* ---------- App shell ---------- */
    .app {
      height: 100dvh;
      /* JS overrides height (and top) to track the live visualViewport
       while the on-screen keyboard is open, so the whole shell (header
       included) shrinks to the visible area instead of the header
       getting pushed off-screen or the composer floating above the
       keyboard. position:fixed is what makes the JS-set `top` do
       anything — see the @media(max-width) override below. */
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      /* No side borders — the chat blends straight into the page
       background instead of sitting in a bounded card. */
    }

    /* Below this, the app is full-bleed and fixed to track the visual
     viewport (keyboard handling). Kept distinct from the 641px desktop
     breakpoint below so there's no width where both could apply. */
    @media (max-width: 640px) {
      .app {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        max-width: none;
      }
    }

    .content-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .content-wrap[hidden] {
      display: none !important;
    }

    .app-header {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      z-index: 20;
      /* Blends into the page background instead of sitting in its own
       panel — no border-bottom, no distinct background fill. */
      background: transparent;
      /* Full-bleed: .app (the chat column) is capped at max-width and
       centered within a flex-centered body, so a margin-based breakout
       (calc(50% - 50vw)) resolves against .app's width, not the real
       viewport — it doesn't actually reach the browser edges. Using
       position:fixed anchored to the true viewport corners is what
       makes this a real top bar spanning the whole window, independent
       of how .app itself is sized/centered. Unlike the chat body, the
       header's own buttons intentionally use the full window width
       (hamburger/logo at the true left edge, status at the true right
       edge) rather than being re-capped to the chat column's width. */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      box-sizing: border-box;
    }

    /* The header is fixed now, so it no longer takes up space in normal
     flow — reserve that height at the top of .app so the app-menu,
     dropdown panels, and content-wrap (all its siblings) sit below the
     header instead of underneath it. */
    .app {
      padding-top: 58px;
    }

    .app-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--brass-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--brass-bright);
      overflow: hidden;
    }

    .brand-name {
      font-size: 19px;
      letter-spacing: 0.03em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink-faint);
      margin-left: 6px;
      flex-shrink: 0;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.ok {
      background: #7fae6a;
      box-shadow: 0 0 8px rgba(127, 174, 106, 0.6);
    }

    .status-dot.err {
      background: var(--wax-bright);
      box-shadow: 0 0 8px rgba(184, 69, 47, 0.6);
    }

    .page {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
    }

    .output {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .entry {
      max-width: 92%;
      display: flex;
      flex-direction: column;
    }

    .entry-user {
      align-self: flex-end;
    }

    .entry-perla {
      align-self: flex-start;
    }

    .entry-system {
      align-self: center;
      max-width: 100%;
    }

    .entry-bubble {
      padding: 10px 14px;
    }

    .entry-user .entry-bubble {
      text-align: left;
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.16), rgba(201, 123, 141, 0.07));
      border: 1px solid rgba(201, 123, 141, 0.28);
      border-radius: 16px 16px 4px 16px;
    }

    .entry-perla .entry-bubble {
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule-faint);
      border-radius: 16px 16px 16px 4px;
    }

    .entry-system .entry-bubble {
      text-align: center;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid var(--rule-faint);
      border-radius: 20px;
      padding: 6px 14px;
    }

    .entry p {
      margin: 0;
      font-size: 17px;
      line-height: 1.55;
    }

    .entry-user p {
      color: var(--ink);
    }

    .entry-perla p {
      color: var(--ink);
    }

    .entry-system p {
      color: var(--ink-faint);
      font-style: italic;
      font-size: 14px;
    }

    /* Markdown container — used for Perla's bubbles (live chat + history
     replay). Everything is HTML-escaped before this renders, so these
     rules only ever see tags the renderer itself emits. */
    .md {
      font-size: 17px;
      line-height: 1.55;
      color: var(--ink);
    }

    .md p {
      margin: 0 0 10px;
      font-size: inherit;
      line-height: inherit;
    }

    .md p:last-child {
      margin-bottom: 0;
    }

    .md h1,
    .md h2,
    .md h3,
    .md h4 {
      margin: 12px 0 6px;
      line-height: 1.3;
      font-weight: 600;
    }

    .md h1 {
      font-size: 1.3em;
    }

    .md h2 {
      font-size: 1.2em;
    }

    .md h3,
    .md h4 {
      font-size: 1.1em;
    }

    .md pre {
      position: relative;
      margin: 8px 0;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--rule-faint);
      border-radius: 8px;
      overflow-x: auto;
      white-space: pre;
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .md code {
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--rule-faint);
      border-radius: 4px;
      padding: 1px 5px;
    }

    .md pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: inherit;
    }

    .md ul,
    .md ol {
      margin: 6px 0;
      padding-left: 22px;
    }

    .md li {
      margin: 2px 0;
    }

    .md a {
      color: var(--brass-bright);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .md blockquote {
      margin: 8px 0;
      padding: 2px 0 2px 12px;
      border-left: 3px solid var(--brass-dim);
      color: var(--ink-dim);
    }

    .md hr {
      border: none;
      border-top: 1px solid var(--rule-faint);
      margin: 10px 0;
    }

    /* Meta row (timestamp + optional play button) sits below the bubble
     and stays hidden until the message is hovered, focused (keyboard
     nav), or tapped — tap support is via the .meta-visible class, which
     JS toggles on mobile where :hover doesn't apply. */
    .entry-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      padding: 0 4px;
      height: 18px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease;
    }

    .entry-user .entry-meta {
      align-self: flex-end;
    }

    .entry-perla .entry-meta {
      align-self: flex-start;
    }

    .entry:hover .entry-meta,
    .entry:focus-within .entry-meta,
    .entry.meta-visible .entry-meta {
      opacity: 1;
      visibility: visible;
    }

    .entry-time {
      font-size: 11px;
      color: var(--ink-faint);
    }

    .entry-image-wrap {
      margin-top: 6px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--rule);
      background: var(--bg);
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .entry-image {
      display: block;
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      cursor: zoom-in;
      background: var(--bg);
      border-radius: 10px;
    }

    .entry-image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .entry-image-grid .entry-image {
      width: 100%;
      height: 140px;
      max-height: none;
      object-fit: cover;
    }

    .entry-image-grid:has(.entry-image:only-child) {
      grid-template-columns: 1fr;
    }

    .entry-image-grid:has(.entry-image:only-child) .entry-image {
      height: auto;
      max-height: 360px;
      object-fit: contain;
    }

    .entry-image-loading,
    .entry-image-error {
      display: block;
      padding: 20px 14px;
      font-size: 13px;
      color: var(--ink-faint);
      font-style: italic;
      text-align: center;
    }

    .entry-image-error {
      color: var(--wax-bright);
    }

    .replay-btn,
    .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--ink-dim);
      padding: 0;
      cursor: pointer;
    }

    .replay-btn:hover,
    .copy-btn:hover {
      color: var(--brass-bright);
    }

    .copy-btn.copied {
      color: #7fae6a;
    }

    /* Per-code-block copy button (attachCodeBlockCopyButtons) — floats in
     the corner of any rendered fenced code block, chat bubble or file
     viewer alike. `position: relative` on the .md pre rule (and the file
     viewer's own pre, see below) is what anchors it. Hidden until the
     block is hovered/focused/tapped, same reveal pattern as the message
     meta row's copy button, so a wall of code isn't cluttered with
     buttons at rest. */
    pre.code-block-wrap {
      padding-right: 34px;
    }

    .code-copy-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--rule-faint);
      background: rgba(23, 19, 26, 0.75);
      color: var(--ink-faint);
      cursor: pointer;
      padding: 0;
      opacity: 0;
      transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    pre.code-block-wrap:hover .code-copy-btn,
    pre.code-block-wrap:focus-within .code-copy-btn,
    .code-copy-btn.copied {
      opacity: 1;
    }

    .code-copy-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.14);
    }

    .code-copy-btn.copied {
      color: #7fae6a;
    }

    /* Touch devices have no :hover — always show the button there so it's
     actually reachable, matching how the message meta row already
     handles touch via .meta-visible elsewhere in this file. */
    @media (hover: none) {
      .code-copy-btn {
        opacity: 1;
      }
    }

    /* ---------- Composer ---------- */
    .composer {
      padding: 10px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--rule);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      /* Lifted off the bottom edge instead of resting flush against it,
       and inset from the sides so it reads as a floating docked bar. */
      margin: 0 14px calc(14px + var(--safe-bottom));
    }

    .composer[hidden] {
      display: none;
    }

    /* Replaces .composer in the exact same footer slot whenever Tier 2's
     chat is on screen but not yet elevated — same floating-bar shell so
     the transition to/from the real composer doesn't jump the layout. */
    .elevate-composer {
      padding: 12px 14px;
      background: var(--bg-panel);
      border: 1px solid var(--wax);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin: 0 14px calc(14px + var(--safe-bottom));
    }

    /* Without this, the [hidden] attribute set from JS is silently beaten
     by the `display: flex` rule above (same specificity, and this class
     rule wins), so the bar stayed visible on every tier — this is the fix. */
    .elevate-composer[hidden] {
      display: none;
    }

    .elevate-composer-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .elevate-composer-icon {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--wax-bright);
      background: rgba(184, 69, 47, 0.14);
    }

    .elevate-composer input[type="password"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--rule);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 15px;
      padding: 8px 2px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .elevate-composer input[type="password"]::placeholder {
      color: var(--ink-faint);
    }

    .elevate-composer input[type="password"]:focus {
      border-bottom-color: var(--wax);
    }

    .attach-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--ink-faint);
      font-size: 20px;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .attach-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.08);
    }

    .attach-btn.active {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.14);
    }

    .attach-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 2px 4px;
    }

    .attach-thumb {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border: 1px solid var(--brass-dim);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(201, 123, 141, 0.06);
    }

    .attach-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .attach-thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      line-height: 1;
      border-radius: 50%;
      border: 1px solid var(--wax);
      background: rgba(23, 19, 26, 0.85);
      color: var(--wax-bright);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    /* Attached-file chip — a rounded-rectangle card with a generic file
     icon (same icon regardless of file type — no per-extension SVG set)
     and a filename. Used in BOTH the composer's attach preview (with a
     remove button) and inside a sent message bubble (without one) — one
  /* Square attached-file pill — same footprint as an image thumbnail
     (.attach-thumb, 64x64) so files and images sit at a consistent size
     whether queued in the composer or shown above a sent message. Full
     content only opens in the file viewer on click/tap; the pill itself
     just needs to be recognizable at a glance (icon + truncated name). */
    .attach-file-chip {
      position: relative;
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 4px;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: rgba(201, 123, 141, 0.06);
      cursor: pointer;
    }

    .attach-file-chip:hover {
      border-color: var(--brass-dim);
    }

    .attach-file-icon {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brass-bright);
    }

    .attach-file-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .attach-file-name {
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
      line-height: 1.2;
      color: var(--ink-dim);
      text-align: center;
    }

    /* Row of file chips AND image thumbnails together — used both in the
     composer's attach preview and standalone above a sent message (see
     .entry-attachments below). Both kinds are the same 64x64 footprint
     so they line up in one flowing row regardless of mix. */
    .attach-file-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Attachments block for a SENT message — file chips and/or images,
     rendered as their OWN element ABOVE the message bubble rather than
     nested inside it (matches Claude's UI: the attachment sits outside
     the chat bubble, the bubble only ever holds the typed text). Sent
     images are ALSO square pills here (see .entry-attachments
     .entry-image below) rather than full-size — tap opens the lightbox
     for the full view, same interaction as the file pill opening the
     file viewer. */
    .entry-attachments {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 6px;
    }

    .entry-attachments:empty {
      display: none;
      margin-bottom: 0;
    }

    /* .entry stretches its children to full width by default (flex-direction:
     column), so without this the attachments row would span the whole
     bubble column instead of hugging its own content — align it to the
     same edge the bubble itself sits on (right for the user's own
     messages) so a single small file chip doesn't look stranded at full
     width. */
    .entry-user .entry-attachments {
      align-items: flex-end;
    }

    .entry-perla .entry-attachments,
    .entry-system .entry-attachments {
      align-items: flex-start;
    }

    .entry-attachments .attach-file-row {
      justify-content: flex-end;
    }

    .entry-perla .entry-attachments .attach-file-row {
      justify-content: flex-start;
    }

    /* Sent-message image pills: same 64x64 square as a file chip, cropped
     to fill (object-fit: cover) rather than the old up-to-360px full
     preview. Grid is no longer needed for sizing since every pill is a
     fixed size — .attach-file-row's flex-wrap handles layout instead. */
    .entry-attachments .entry-image {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
      border-radius: 10px;
      object-fit: cover;
    }

    .composer-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .composer-row-spacer {
      flex: 1;
    }

    #textInput {
      width: 100%;
      resize: none;
      max-height: 120px;
      background: transparent;
      border: none;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 17px;
      padding: 6px 4px 10px;
      line-height: 1.4;
      outline: none;
    }

    #textInput::placeholder {
      color: var(--ink-faint);
    }

    .send-btn {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      border: 1px solid var(--brass-dim);
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.16), rgba(201, 123, 141, 0.05));
      color: var(--brass-bright);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .send-btn svg {
      display: block;
      width: 19px;
      height: 19px;
    }

    .send-btn:hover {
      background: rgba(201, 123, 141, 0.22);
    }

    .send-btn:active {
      transform: scale(0.94);
    }

    .send-btn:disabled {
      opacity: 0.32;
      cursor: default;
      transform: none;
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.08), rgba(201, 123, 141, 0.02));
    }

    .mic-btn {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--ink-faint);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .mic-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.08);
    }

    .mic-btn.typing-hidden {
      display: none;
    }

    .mic-icon {
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .mic-stop-square {
      position: absolute;
      width: 11px;
      height: 11px;
      border-radius: 3px;
      background: var(--wax-bright);
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .mic-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--wax-bright);
      opacity: 0;
    }

    .mic-btn.recording {
      color: var(--wax-bright);
    }

    .mic-btn.recording .mic-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    .mic-btn.recording .mic-stop-square {
      opacity: 1;
      transform: scale(1);
    }

    .mic-btn.recording .ring-1 {
      animation: pulse-ring 1.8s ease-out infinite;
    }

    .mic-btn.recording .ring-2 {
      animation: pulse-ring 1.8s ease-out infinite 0.6s;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(1);
        opacity: 0.55;
      }

      100% {
        transform: scale(1.9);
        opacity: 0;
      }
    }

    .mic-timer {
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
      margin-top: 4px;
    }

    .mic-timer:empty {
      display: none;
    }

    /* ---------- Thinking indicator ---------- */
    .thinking {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule-faint);
      border-radius: 16px 16px 16px 4px;
    }

    .think-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brass-bright);
      animation: think-bounce 1.1s ease-in-out infinite;
    }

    .think-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .think-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes think-bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* ---------- Welcome empty state ---------- */
    .welcome {
      margin: 14vh auto 0;
      text-align: center;
      color: var(--ink-dim);
      max-width: 320px;
    }

    .welcome-mark {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 1px solid var(--brass-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--brass-bright);
      background: radial-gradient(circle at 35% 30%, rgba(201, 123, 141, 0.18), transparent 70%);
      overflow: hidden;
    }

    .welcome-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .welcome h2 {
      margin: 0 0 6px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .welcome p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-faint);
    }

    /* ---------- Image lightbox ---------- */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12, 10, 14, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fade-in 0.18s ease;
    }

    .lightbox[hidden] {
      display: none;
    }

    /* Positioned wrap/inner pair, same pattern as the image editor's
     editorCanvasWrap/editorCanvasInner: --fit-w/--fit-h set the base
     "fits the screen" size in JS once the image loads, and zoom/pan on
     top of that apply as a CSS transform on the inner element — which
     keeps getBoundingClientRect() correct for any pointer math at any
     zoom level without the editor's code needing to know about zoom. */
    .lightbox-canvas-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: none;
    }

    .lightbox-canvas-inner {
      position: relative;
      line-height: 0;
      width: var(--fit-w, auto);
      height: var(--fit-h, auto);
      transform: translate(var(--lightbox-pan-x, 0px), var(--lightbox-pan-y, 0px)) scale(var(--lightbox-zoom, 1));
      transform-origin: center center;
    }

    .lightbox img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: 1px solid var(--rule);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      cursor: grab;
    }

    .lightbox img:active {
      cursor: grabbing;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* ---------- File viewer (reopen an attached text/code/document file) ---------- */
    .file-viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(12, 10, 14, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fade-in 0.18s ease;
    }

    .file-viewer[hidden] {
      display: none;
    }

    .file-viewer-panel {
      width: 100%;
      max-width: 720px;
      height: 100%;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule);
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .file-viewer-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--rule-faint);
      flex-shrink: 0;
    }

    .file-viewer-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brass-bright);
    }

    .file-viewer-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .file-viewer-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      color: var(--ink);
    }

    .file-viewer-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .file-viewer-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .file-viewer-body pre {
      margin: 0;
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .file-viewer-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    /* ---------- Image editor (crop + pen) ---------- */
    .img-editor {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(12, 10, 14, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      animation: fade-in 0.18s ease;
    }

    .img-editor[hidden] {
      display: none;
    }

    /* Canvas fills the whole editor — every control floats above it. */
    .img-editor-canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      touch-action: none;
      overflow: hidden;
    }

    .img-editor-canvas-inner {
      position: relative;
      line-height: 0;
      /* Base fit-to-screen size is set inline via JS (--fit-w/--fit-h) once
       the image loads; zoom then scales on top of that via --editor-zoom,
       and pan offsets via --editor-pan-x/--editor-pan-y. Transform-based
       zoom (rather than resizing the canvas element) keeps
       getBoundingClientRect() — and therefore all pointer-to-canvas
       coordinate mapping — correct at any zoom level for free. */
      width: var(--fit-w, auto);
      height: var(--fit-h, auto);
      max-width: none;
      max-height: none;
      transform: translate(var(--editor-pan-x, 0px), var(--editor-pan-y, 0px)) scale(var(--editor-zoom, 1));
      transform-origin: center center;
    }

    #editorCanvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      touch-action: none;
      cursor: crosshair;
    }

    .crop-box {
      position: absolute;
      border: 1.5px dashed var(--brass-bright);
      background: rgba(201, 123, 141, 0.08);
      box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .crop-handle {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--brass-bright);
      border: 1.5px solid var(--bg);
      pointer-events: auto;
    }

    .crop-handle.nw {
      top: -7px;
      left: -7px;
      cursor: nwse-resize;
    }

    .crop-handle.ne {
      top: -7px;
      right: -7px;
      cursor: nesw-resize;
    }

    .crop-handle.sw {
      bottom: -7px;
      left: -7px;
      cursor: nesw-resize;
    }

    .crop-handle.se {
      bottom: -7px;
      right: -7px;
      cursor: nwse-resize;
    }

    /* Shared floating-pill shell used by every editor control cluster. */
    .editor-float {
      position: absolute;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 22px;
      background: rgba(23, 19, 26, 0.82);
      border: 1px solid var(--rule);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .editor-float[hidden] {
      display: none;
    }

    /* Top-center: Crop / Pen mode switch — the only always-visible control. */
    .editor-mode-switch {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Top-right: close button, on its own so it never competes with modes. */
    .editor-close-float {
      top: 12px;
      right: 12px;
      padding: 0;
    }

    /* Top-left: undo/reset, small and out of the way. */
    .editor-history-float {
      top: 12px;
      left: 12px;
    }

    /* Bottom-center: whatever the active mode needs (pen options, or apply-crop). */
    .editor-context-float {
      bottom: calc(12px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100vw - 24px);
    }

    /* Bottom-right: Save. Kept apart from context controls so it's always reachable. */
    .editor-save-float {
      bottom: calc(12px + var(--safe-bottom));
      right: 12px;
    }

    /* Bottom-left: zoom controls */
    .editor-zoom-float {
      bottom: calc(12px + var(--safe-bottom));
      left: 12px;
    }

    .editor-zoom-label {
      font-size: 11px;
      color: var(--ink-faint);
      width: 34px;
      text-align: center;
      flex-shrink: 0;
      user-select: none;
    }

    .editor-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--ink-dim);
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .editor-icon-btn:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.06);
    }

    .editor-icon-btn.active {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.18);
    }

    .editor-icon-btn svg {
      flex-shrink: 0;
    }

    .editor-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: 18px;
      border: none;
      background: transparent;
      color: var(--brass-bright);
      font-family: var(--font-serif);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .editor-pill-btn:hover {
      background: rgba(201, 123, 141, 0.14);
    }

    .editor-pill-btn.primary {
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.28), rgba(201, 123, 141, 0.12));
    }

    .editor-pill-btn.primary:hover {
      background: rgba(201, 123, 141, 0.34);
    }

    .editor-divider {
      width: 1px;
      height: 20px;
      background: var(--rule);
      flex-shrink: 0;
      margin: 0 1px;
    }

    .img-editor-colors {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }

    .color-swatch.active {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px rgba(23, 19, 26, 0.8);
    }

    .img-editor-size {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 90px;
    }

    .img-editor-size input[type="range"] {
      width: 70px;
      accent-color: var(--brass-bright);
    }

    .img-editor-size-label {
      font-size: 10px;
      color: var(--ink-faint);
      width: 26px;
      flex-shrink: 0;
      text-align: right;
    }

    .attach-thumb-edit {
      position: absolute;
      bottom: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid var(--brass-dim);
      background: rgba(23, 19, 26, 0.85);
      color: var(--brass-bright);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .attach-thumb-edit:hover {
      background: rgba(201, 123, 141, 0.2);
    }

    @media (prefers-reduced-motion: reduce) {

      .mic-btn.recording .ring-1,
      .mic-btn.recording .ring-2 {
        animation: none;
      }

      .think-dot {
        animation: none;
      }

      .lightbox {
        animation: none;
      }

      .shake {
        animation: none;
      }
    }

    @media (min-width: 641px) {
      body {
        padding: 28px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app {
        height: calc(100dvh - 56px);
        /* No card chrome (border/shadow/radius) — the chat blends into
         the page background instead of floating in a bounded card. */
      }
    }

    .tier-badge {
      background: linear-gradient(180deg, var(--wax-bright), var(--wax));
      color: var(--bg);
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 20px;
      margin-right: 6px;
      box-shadow: 0 0 10px rgba(184, 69, 47, 0.45);
    }

    .tier-timer {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--brass-bright);
      border: 1px solid var(--brass-dim);
      background: rgba(201, 123, 141, 0.08);
      padding: 2px 8px;
      border-radius: 20px;
      margin-right: 6px;
      font-variant-numeric: tabular-nums;
    }

    .tier-timer[hidden] {
      display: none;
    }

    .elevate-submit {
      background: linear-gradient(180deg, rgba(184, 69, 47, 0.22), rgba(184, 69, 47, 0.08));
      color: var(--wax-bright);
      border: 1px solid var(--wax);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .elevate-submit:hover {
      background: rgba(184, 69, 47, 0.32);
    }

    .elevate-submit:active {
      transform: scale(0.96);
    }

    .panel-status {
      display: block;
      margin-top: 8px;
      font-size: 0.72rem;
      color: var(--ink-dim);
      font-style: italic;
    }

    .panel-status:empty {
      display: none;
    }

    /* ---------- Header icon buttons (shared: history, elevate) ---------- */
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--ink-dim);
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .icon-btn[hidden] {
      display: none !important;
    }

    .icon-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.08);
    }

    .icon-btn.active {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.14);
    }

    /* ---------- Hamburger menu button ---------- */
    .menu-btn {
      position: relative;
    }

    .hamburger-lines {
      width: 15px;
      height: 11px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hamburger-lines span {
      display: block;
      width: 100%;
      height: 1.5px;
      background: currentColor;
      border-radius: 1px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .menu-btn.active .hamburger-lines span:nth-child(1) {
      transform: translateY(4.5px) rotate(45deg);
    }

    .menu-btn.active .hamburger-lines span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.active .hamburger-lines span:nth-child(3) {
      transform: translateY(-4.5px) rotate(-45deg);
    }

    /* ---------- App menu (hamburger dropdown) ---------- */
    .floating-menu {
      display: flex;
      flex-direction: column;
      padding: 8px;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      position: fixed;
      width: 200px;
      max-width: calc(100vw - 40px);
      z-index: 25;
      transition: opacity 0.16s ease, transform 0.16s ease;
      opacity: 0;
      pointer-events: none;
    }

    .floating-menu.open {
      opacity: 1;
      pointer-events: auto;
    }

    .app-menu {
      /* Floats over the content near the hamburger button instead of
       pushing the page down — anchored to the header's fixed left
       padding (20px) since the button always sits there. */
      top: 58px;
      left: 20px;
      width: 240px;
      transform-origin: top left;
      transform: scale(0.94) translateY(-6px);
    }

    .app-menu.open {
      transform: scale(1) translateY(0);
    }

    .attach-menu {
      /* Anchored above the composer's attach button (opens upward instead
       of down since the button sits near the bottom of the screen).
       left/top are set dynamically in JS from the button's actual
       position, since the composer is a centered, max-width column —
       not flush against the viewport edge like the header — so a fixed
       left offset would only be correct at one particular screen width. */
      transform-origin: bottom left;
      transform: scale(0.94) translateY(6px);
    }

    .attach-menu.open {
      transform: scale(1) translateY(0);
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 15px;
      text-align: left;
      padding: 12px 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .menu-item:hover {
      background: rgba(201, 123, 141, 0.08);
    }

    .menu-item.active {
      background: rgba(201, 123, 141, 0.14);
      color: var(--brass-bright);
    }

    .menu-item-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .menu-item-icon svg {
      display: block;
    }

    .menu-item-label {
      flex: 1;
    }

    .menu-item-badge {
      font-size: 11px;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }

    .menu-item-badge.locked {
      color: var(--wax-bright);
    }

    .menu-item-badge.unread {
      color: var(--brass-bright);
      font-weight: 600;
    }

    .menu-divider {
      height: 1px;
      background: var(--rule);
      margin: 6px 4px;
    }

    /* ---------- Dropdown panels (history day picker, elevate token) ---------- */
    .dropdown-panel {
      padding: 12px 20px 16px;
      background: transparent;
      animation: panel-drop 0.18s ease;
    }

    @keyframes panel-drop {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dropdown-panel:has(> .panel-status:empty:only-child) {
      padding: 0;
    }

    .dropdown-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dropdown-row input,
    .dropdown-row select {
      flex: 1;
      min-width: 0;
      background: var(--bg-panel);
      border: 1px solid var(--rule);
      border-radius: 10px;
      color: var(--ink);
      padding: 10px 12px;
      font-size: 0.9rem;
      font-family: var(--font-serif);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .dropdown-row input::placeholder {
      color: var(--ink-faint);
    }

    .dropdown-row input:focus,
    .dropdown-row select:focus {
      border-color: var(--brass-dim);
    }

    /* ---------- History toolbar (day picker + tier filter) ---------- */
    .history-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .history-daypicker-wrap {
      position: relative;
      min-width: 0;
    }

    .history-daypicker-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 260px;
      padding: 9px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--rule);
      border-radius: 10px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 0.88rem;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .history-daypicker-btn:hover {
      border-color: var(--brass-dim);
      background: rgba(201, 123, 141, 0.06);
    }
    .history-daypicker-btn.open {
      border-color: var(--brass);
    }
    .history-daypicker-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      color: var(--brass-dim);
    }
    #historyDayBtnLabel {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }
    .history-daypicker-caret {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      color: var(--ink-faint);
      transition: transform 0.15s ease;
    }
    .history-daypicker-btn.open .history-daypicker-caret {
      transform: rotate(180deg);
    }

    /* Reuses .floating-menu's base look (same shell as the hamburger/
     attach menus) so the day list reads as the same design language
     rather than a bespoke dropdown, but anchored under the day-picker
     button instead of the header, and scrollable with the shared modern
     scrollbar since a long history can have many days. */
    .history-day-menu {
      width: 260px;
      max-height: 320px;
      overflow-y: auto;
      transform-origin: top left;
      transform: scale(0.96) translateY(-4px);
      scrollbar-width: thin;
      scrollbar-color: var(--brass-dim) transparent;
    }
    .history-day-menu.open {
      transform: scale(1) translateY(0);
    }
    .history-day-menu::-webkit-scrollbar {
      width: 8px;
    }
    .history-day-menu::-webkit-scrollbar-track {
      background: transparent;
    }
    .history-day-menu::-webkit-scrollbar-thumb {
      background: var(--brass-dim);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .history-day-menu-empty {
      padding: 12px 10px;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 13px;
      text-align: center;
    }
    .history-day-option {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      text-align: left;
      padding: 8px 10px;
      cursor: pointer;
    }
    .history-day-option:hover {
      background: rgba(201, 123, 141, 0.08);
    }
    .history-day-option.selected {
      background: rgba(201, 123, 141, 0.14);
      color: var(--brass-bright);
    }
    .history-day-option-main {
      font-size: 14px;
    }
    .history-day-option-sub {
      font-size: 11px;
      color: var(--ink-faint);
    }
    .history-day-option.selected .history-day-option-sub {
      color: var(--brass-dim);
    }

    /* Segmented tier filter — All / Tier 1 / Tier 2 */
    .history-tier-filter {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 3px;
      background: var(--bg-panel);
      border: 1px solid var(--rule);
      border-radius: 10px;
      flex-shrink: 0;
    }
    .history-tier-btn {
      background: transparent;
      border: none;
      border-radius: 7px;
      color: var(--ink-dim);
      font-family: var(--font-serif);
      font-size: 0.82rem;
      padding: 6px 12px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .history-tier-btn:hover {
      color: var(--ink);
    }
    .history-tier-btn.active {
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.24), rgba(201, 123, 141, 0.1));
      color: var(--brass-bright);
    }

    .entry-tier0 p {
      color: var(--ink-dim);
      font-style: italic;
    }

    /* ---------- Reminders ---------- */
    .reminder-section-title {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reminder-section-title.missed {
      color: var(--wax-bright);
    }

    .reminder-section-title.pending {
      color: var(--brass-bright);
    }

    .reminder-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--rule-faint);
    }

    .reminder-row:last-child {
      border-bottom: none;
    }

    .reminder-glyph {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      margin-top: 1px;
    }

    .reminder-glyph.pending {
      color: var(--brass-bright);
    }

    .reminder-glyph.overdue {
      color: var(--wax-bright);
    }

    .reminder-glyph.missed {
      color: var(--wax-bright);
    }

    .reminder-glyph.delivered {
      color: #7fae6a;
    }

    .reminder-body {
      flex: 1;
      min-width: 0;
    }

    .reminder-text {
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
    }

    .reminder-meta {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 3px;
    }

    .reminder-cadence {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--brass-dim);
    }

    .reminder-cadence svg {
      flex-shrink: 0;
    }

    .reminder-empty {
      color: var(--ink-faint);
      font-style: italic;
      font-size: 14px;
      padding: 4px 0 18px;
    }

    /* ---------- System / File browser ---------- */
    .drive-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      height: 100%;
      padding: 12px 24px calc(24px + var(--safe-bottom));
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      /* Breaks out of .app's max-width: 820px cap the same way .app-header
       already does — fixed and anchored to the true viewport edges,
       independent of how .app itself is centered/capped, so System gets
       the full browser width instead of being squeezed into the chat
       column's width. Only takes effect while open (toggled from JS
       alongside drivePanel.hidden), so the chat itself keeps its
       readable, centered width the rest of the time. */
      position: fixed;
      top: 58px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 5;
      background: var(--bg);
    }

    /* Modern, slim scrollbar — used on every internally-scrolling
     surface in the app (chat, System, History, Quick Actions, both file
     viewers). Firefox via scrollbar-width/scrollbar-color, WebKit/Blink
     via the pseudo-elements below; both degrade gracefully to the
     platform default elsewhere. One shared rule (rather than the old
     per-surface bespoke scrollbar CSS #quickActionsPanel used to have)
     so every surface looks and behaves identically, and a new scrollable
     panel just needs adding to this selector list, not its own copy. */
    .page,
    .drive-panel,
    .file-viewer-body,
    .file-viewer-modal-body,
    #quickActionsPanel,
    .md pre {
      scrollbar-width: thin;
      scrollbar-color: var(--brass-dim) transparent;
    }
    .page::-webkit-scrollbar,
    .drive-panel::-webkit-scrollbar,
    .file-viewer-body::-webkit-scrollbar,
    .file-viewer-modal-body::-webkit-scrollbar,
    #quickActionsPanel::-webkit-scrollbar,
    .md pre::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .page::-webkit-scrollbar-track,
    .drive-panel::-webkit-scrollbar-track,
    .file-viewer-body::-webkit-scrollbar-track,
    .file-viewer-modal-body::-webkit-scrollbar-track,
    #quickActionsPanel::-webkit-scrollbar-track,
    .md pre::-webkit-scrollbar-track {
      background: transparent;
    }
    .page::-webkit-scrollbar-thumb,
    .drive-panel::-webkit-scrollbar-thumb,
    .file-viewer-body::-webkit-scrollbar-thumb,
    .file-viewer-modal-body::-webkit-scrollbar-thumb,
    #quickActionsPanel::-webkit-scrollbar-thumb,
    .md pre::-webkit-scrollbar-thumb {
      background: var(--brass-dim);
      border-radius: 8px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    .page::-webkit-scrollbar-thumb:hover,
    .drive-panel::-webkit-scrollbar-thumb:hover,
    .file-viewer-body::-webkit-scrollbar-thumb:hover,
    .file-viewer-modal-body::-webkit-scrollbar-thumb:hover,
    #quickActionsPanel::-webkit-scrollbar-thumb:hover,
    .md pre::-webkit-scrollbar-thumb:hover {
      background: var(--brass);
      background-clip: padding-box;
    }

    .drive-panel[hidden] {
      display: none !important;
    }

    .drive-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      margin-bottom: 12px;
      border: 1px solid var(--rule-faint);
      border-radius: 12px;
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
      position: sticky;
      top: 0;
      z-index: 2;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .drive-breadcrumbs {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      gap: 4px;
      min-width: 0;
      font-size: 14px;
      color: var(--ink-dim);
    }

    .drive-breadcrumbs::-webkit-scrollbar {
      display: none;
    }

    .drive-breadcrumbs[hidden] {
      display: none !important;
    }

    .drive-breadcrumb-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .drive-breadcrumb-wrap .drive-breadcrumbs {
      flex: 1;
    }

    .drive-breadcrumb-edit-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
    }

    /* Writable path bar — swaps in for the breadcrumb trail when the
     edit button (or the breadcrumb background) is clicked. Styled to sit
     flush in the same slot rather than looking like a separate control,
     since it's a mode of the same "where am I" bar, not a new feature
     bolted on next to it. */
    .drive-path-edit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
      padding: 4px 10px 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--brass-dim);
      background: var(--bg);
    }
    .drive-path-edit-row[hidden] {
      display: none !important;
    }
    .drive-path-edit-icon {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-faint);
    }
    .drive-path-edit-row input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      color: var(--ink);
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      padding: 6px 0;
      outline: none;
    }
    .drive-path-edit-row input::placeholder {
      color: var(--ink-faint);
      font-family: var(--font-serif);
    }
    .drive-path-edit-row.has-error {
      border-color: var(--wax-bright);
    }

    .drive-crumb {
      background: transparent;
      border: none;
      color: var(--ink-dim);
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 500;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .drive-crumb:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.12);
    }

    .drive-crumb.current {
      color: var(--ink);
      font-weight: 600;
      cursor: default;
      background: rgba(201, 123, 141, 0.06);
    }

    .drive-crumb.current:hover {
      background: rgba(201, 123, 141, 0.06);
    }

    .drive-crumb-sep {
      color: var(--ink-faint);
      font-size: 12px;
      padding: 0 2px;
    }

    .drive-toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .drive-toolbar-actions .icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--rule-faint);
      background: rgba(201, 123, 141, 0.06);
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .drive-toolbar-actions .icon-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.18);
      border-color: var(--brass-dim);
    }

    .drive-toolbar-actions .icon-btn.active {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.22);
      border-color: var(--brass);
    }

    .drive-toolbar-divider {
      width: 1px;
      height: 22px;
      background: var(--rule-faint);
      margin: 0 2px;
      flex-shrink: 0;
    }

    .drive-new-folder-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
      border: 1px solid var(--brass-dim);
      border-radius: 12px;
      animation: qa-feedback-in 0.18s ease;
    }

    .drive-new-folder-row[hidden] {
      display: none !important;
    }

    .drive-new-folder-row input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--rule);
      border-radius: 8px;
      color: var(--ink);
      padding: 9px 12px;
      font-size: 0.9rem;
      font-family: var(--font-serif);
      outline: none;
    }

    .drive-new-folder-row input:focus {
      border-color: var(--brass);
    }

    .drive-toolbar-actions .icon-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .drive-toolbar-actions .icon-btn:disabled:hover {
      color: var(--ink-dim);
      background: rgba(201, 123, 141, 0.06);
      border-color: var(--rule-faint);
    }

    .drive-clipboard-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding: 9px 12px;
      background: rgba(201, 123, 141, 0.06);
      border: 1px dashed var(--brass-dim);
      border-radius: 10px;
      font-size: 13px;
      color: var(--ink-dim);
      animation: qa-feedback-in 0.18s ease;
    }
    .drive-clipboard-bar[hidden] {
      display: none !important;
    }
    .drive-clipboard-bar strong {
      color: var(--ink);
      font-weight: 600;
    }

    /* Visual cue for a "cut" item still sitting in its original spot,
     same convention as most desktop file managers — dimmed, not removed,
     until the paste actually completes. */
    .drive-item.is-cut {
      opacity: 0.45;
    }

    .drive-list,
    .drive-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* Grid mode — a real CSS grid of square-ish cards, toggled via a
     class on the same #driveGrid container the list rows also render
     into (buildDriveItemCard branches its own markup per mode, since
     list rows and grid cards have different internal layouts, not just
     different container layouts). */
    .drive-grid.grid-mode {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
    }

    .drive-item {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--rule-faint);
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
    }

    .drive-item:hover {
      border-color: var(--brass-dim);
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.08), rgba(201, 123, 141, 0.02));
      transform: translateX(2px);
    }

    .drive-item:active {
      transform: translateX(0) scale(0.99);
    }

    .drive-item.is-hidden {
      opacity: 0.6;
    }

    /* Grid-mode card layout override — same .drive-item element, just
     re-flowed vertically with a fixed-ish footprint instead of a full-
     width row. Kept as a modifier (not a separate class set) so hover/
     active/menu-button styling above stays shared between both modes. */
    .drive-grid.grid-mode .drive-item {
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 14px 8px 10px;
      text-align: center;
    }
    .drive-grid.grid-mode .drive-item:hover {
      transform: translateY(-2px);
    }
    .drive-grid.grid-mode .drive-item:active {
      transform: translateY(0) scale(0.98);
    }
    .drive-grid.grid-mode .drive-item-icon {
      width: 40px;
      height: 40px;
    }
    .drive-grid.grid-mode .drive-item-name {
      text-align: center;
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12.5px;
    }
    .drive-grid.grid-mode .drive-item-meta-col {
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .drive-grid.grid-mode .drive-item-menu-btn {
      position: absolute;
      top: 4px;
      right: 4px;
    }

    .drive-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      border-radius: 8px;
      background: rgba(201, 123, 141, 0.08);
      color: var(--brass-bright);
    }

    .drive-item.is-folder .drive-item-icon {
      color: #e4c26a;
      background: rgba(228, 194, 106, 0.12);
    }

    .drive-item-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      text-align: left;
      color: var(--ink);
      font-weight: 500;
    }

    .drive-item-meta-col {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .drive-item-meta {
      font-size: 12px;
      color: var(--ink-dim);
      flex-shrink: 0;
      margin-right: 4px;
      font-variant-numeric: tabular-nums;
    }

    .drive-item-modified {
      font-size: 11.5px;
      color: var(--ink-faint);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .drive-item-menu-btn {
      position: static;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--ink-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.6;
      flex-shrink: 0;
      transition: opacity 0.15s ease, color 0.15s ease, background 0.15s ease;
    }

    .drive-item:hover .drive-item-menu-btn,
    .drive-item-menu-btn.open {
      opacity: 1;
    }

    .drive-item-menu-btn:hover {
      color: var(--brass-bright);
      background: rgba(201, 123, 141, 0.18);
    }

    @media (hover: none) {
      .drive-item-menu-btn {
        opacity: 0.85;
      }
    }

    .drive-item-menu {
      position: fixed;
      z-index: 30;
      display: flex;
      flex-direction: column;
      padding: 6px;
      min-width: 170px;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .drive-item-menu[hidden] {
      display: none !important;
    }

    .drive-item-menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 13.5px;
      text-align: left;
      padding: 9px 10px;
      cursor: pointer;
    }

    .drive-item-menu button:hover {
      background: rgba(201, 123, 141, 0.1);
    }

    .drive-item-menu button.danger {
      color: var(--wax-bright);
    }

    .drive-item-menu button.danger:hover {
      background: rgba(184, 69, 47, 0.12);
    }

    .drive-item-menu-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .drive-item-menu-icon svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .drive-item-menu button {
      line-height: 1.2;
    }

    .drive-empty {
      width: 100%;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 14px;
      text-align: center;
      padding: 36px 0;
    }

    .drive-dropzone-active {
      outline: 2px dashed var(--brass);
      outline-offset: -4px;
      background: rgba(201, 123, 141, 0.05);
      border-radius: 12px;
    }

    /* Drag-and-drop highlight for the chat shell (see chatDropTarget in
     the script) — outlines the whole app rather than just the message
     list, since the drop target is deliberately the full `.app` element
     so dropping near the composer also registers. z-index above normal
     content but below modals/menus (::before overlay, not outline, so it
     doesn't get clipped by any descendant's own overflow:hidden). */
    .chat-dropzone-active {
      position: relative;
    }
    .chat-dropzone-active::after {
      content: "";
      position: absolute;
      inset: 8px;
      pointer-events: none;
      outline: 2px dashed var(--brass);
      outline-offset: -2px;
      background: rgba(201, 123, 141, 0.04);
      border-radius: 16px;
      z-index: 15;
    }

    /* ---------- File viewer modal (System's "View" action) ---------- */
    .file-viewer-modal {
      position: fixed;
      inset: 0;
      z-index: 110;
      background: rgba(12, 10, 14, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fade-in 0.18s ease;
    }
    .file-viewer-modal[hidden] {
      display: none !important;
    }

    .file-viewer-modal-card {
      width: 100%;
      max-width: 780px;
      height: 100%;
      max-height: 640px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
      border: 1px solid var(--rule);
      border-radius: 14px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .file-viewer-modal-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--rule-faint);
      flex-shrink: 0;
    }

    .file-viewer-modal-icon {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--brass-bright);
    }

    .file-viewer-modal-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      color: var(--ink);
    }

    .file-viewer-modal-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .file-viewer-modal-body pre {
      margin: 0;
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .file-viewer-modal-body img {
      display: block;
      max-width: 100%;
      margin: 0 auto;
      border-radius: 8px;
    }

    .file-viewer-modal-empty,
    .file-viewer-modal-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-faint);
      font-style: italic;
      font-size: 14px;
      text-align: center;
      padding: 20px;
    }

    .reminder-collapsible summary {
      cursor: pointer;
      list-style: none;
    }

    .reminder-collapsible summary::-webkit-details-marker {
      display: none;
    }

    .reminder-collapsible summary .reminder-section-title {
      margin-bottom: 10px;
    }

    .reminder-collapsible summary .disclosure-arrow {
      display: inline-block;
      transition: transform 0.15s ease;
      margin-left: auto;
      color: var(--ink-faint);
    }

    .reminder-collapsible[open] summary .disclosure-arrow {
      transform: rotate(90deg);
    }

    .reminder-section {
      margin-bottom: 22px;
    }

    .reminder-section:last-child {
      margin-bottom: 0;
    }

    /* ---------- Global Notifications ---------- */
    /* App-scope floating notices: reuses .qa-feedback-card styling and the
       qa-feedback-in keyframes, but mounts in a fixed top-center container
       visible from every panel (chat, History, Reminders, Quick Actions,
       Drive). The app-header is z-index 20 and position:fixed across the
       window top, so an offset below it keeps cards clear of the header. */
    .global-notifications {
      position: fixed;
      top: calc(58px + 10px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 19;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      width: min(92vw, 360px);
      pointer-events: none;
    }

    .global-notifications > * {
      pointer-events: auto;
    }

    /* ---------- Quick Actions ---------- */
    #quickActionsPanel {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 10px 18px calc(48px + var(--safe-bottom));
    }

    /* While Quick Actions is open the panel must own the entire content
     column: it's a flex:1 sibling of .content-wrap, so without hiding the
     chat beneath it the two would each claim half the height and the
     button grid would stop at a phantom midline instead of extending to
     the bottom edge of the window. Same "swap .content-wrap out" idea as
     #drivePanel — done declaratively so open/close/relock need no JS. */
    #quickActionsPanel:not([hidden]) ~ .content-wrap {
      display: none;
    }

    .qa-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .qa-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .qa-section-title {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-faint);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--rule-faint);
    }

    .qa-section-title svg {
      color: var(--brass-dim);
      flex-shrink: 0;
    }

    .qa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .qa-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 6px;
      min-height: 88px;
      border-radius: 14px;
      border: 1px solid var(--rule);
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-panel-2) 100%);
      color: var(--ink);
      font-family: var(--font-serif);
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1),
        background 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    .qa-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: radial-gradient(circle at 50% 0%, rgba(201, 123, 141, 0.18), transparent 70%);
      opacity: 0;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    .qa-btn:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--brass);
      background: linear-gradient(180deg, rgba(201, 123, 141, 0.12) 0%, var(--bg-panel-2) 100%);
      box-shadow: 0 6px 18px rgba(201, 123, 141, 0.22), 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .qa-btn:hover::before {
      opacity: 1;
    }

    .qa-btn:active {
      transform: translateY(1px) scale(0.96);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      border-color: var(--brass-bright);
      transition-duration: 0.06s;
    }

    .qa-btn:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none !important;
      box-shadow: none !important;
    }

    /* Button dynamic states */
    .qa-btn.is-loading {
      border-color: var(--brass-bright) !important;
      box-shadow: 0 0 0 2px rgba(201, 123, 141, 0.4) !important;
      pointer-events: none;
    }

    .qa-btn.is-loading .qa-icon {
      animation: qa-spin 0.8s linear infinite;
    }

    .qa-btn.is-success {
      border-color: #7fae6a !important;
      box-shadow: 0 0 0 2px rgba(127, 174, 106, 0.45) !important;
    }

    .qa-btn.is-error {
      border-color: var(--wax-bright) !important;
      box-shadow: 0 0 0 2px rgba(184, 69, 47, 0.45) !important;
    }
